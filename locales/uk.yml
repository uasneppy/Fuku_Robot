settings_del_sec_bot: "Повідомлення бота"
settings_del_list_svc: "Telegram публікує сповіщення, коли в групі щось відбувається. Натисніть тип, щоб обрати, коли я видаляю такі сповіщення."
settings_del_list_bot: "Натисніть вид моїх повідомлень, щоб обрати, коли я його видаляю."
settings_del_hint_time: "Час відлічується від моменту надсилання повідомлення. Максимум — 24 години."
settings_del_hint_cleanservice: "Сповіщення про вступ і вихід використовують те саме налаштування, що й /cleanservice."
settings_del_hint_punish_auto: "Сповіщення про мут за невиконану вимогу залишається до 24 годин, щоб учасник міг натиснути «Виправлено»."
settings_del_no_right: "Я не можу видаляти повідомлення тут, тому деякі з цих налаштувань можуть не працювати. Зробіть мене адміном з правом «Видалення повідомлень»."
