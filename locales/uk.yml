captcha_help_msg: "Захистіть свою групу від ботів і спамерів за допомогою перевірки капчею!\n\n\nЗмусьте нових учасників довести, що вони люди, розв'язавши просте завдання, перш ніж вони зможуть писати повідомлення.\n\n\n*Типи капчі:*\n\n× Math: розв'язати простий арифметичний приклад\n\n× Text: розпізнати текст на зображенні\n\n× Turnstile: перевірка Cloudflare на вебсторінці\n\n\n*Команди для адмінів:*\n\n× /captcha `<on/off>`: увімкнути або вимкнути перевірку капчею\n\n× /captchamode `<math/text/turnstile>`: встановити тип капчі (математичні приклади або розпізнавання тексту)\n\n× /captchatime `<1-10>`: встановити тайм-аут у хвилинах (за замовчуванням: 2)\n\n× /captchaaction `<kick/ban/mute>`: встановити дію при невдалій перевірці (за замовчуванням: kick)\n\n× /captchaattempts `<1-10>`: встановити максимальну кількість спроб (за замовчуванням: 3)\n\n\nПісля вмикання нових учасників автоматично заглушують, доки вони не пройдуть капчу.\n\nЯкщо вони не пройдуть її або вичерпають час, буде виконано налаштовану дію."
