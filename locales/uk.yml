settings_del_desc_title: "Сповіщення про зміну назви групи."
settings_del_desc_pinned: "Сповіщення про закріплення повідомлення. Саме закріплене повідомлення залишається."
settings_del_desc_video: "Сповіщення про відеочати: заплановано, розпочато, завершено або запрошено учасників."
settings_del_desc_forum: "Сповіщення про теми форуму: змінено, закрито, відкрито знову або тему General приховано чи показано."
settings_del_desc_boost: "Сповіщення про буст групи від учасника."
settings_del_desc_timer: "Сповіщення про зміну таймера автовидалення повідомлень."
settings_del_desc_background: "Сповіщення про зміну фону групи."
settings_del_desc_gifts: "Сповіщення про розіграші та подарунки."
settings_del_desc_other: "Усі інші службові сповіщення, які я можу видалити, наприклад передані користувачі чи чати та дані вебзастосунків. Сповіщення про створення й міграцію групи залишаються."
settings_del_bot_welcome: "Привітання"
settings_del_bot_goodbye: "Прощання"
settings_del_bot_rules: "Правила"
settings_del_bot_auto: "Автопокарання"
settings_del_bot_manual: "Ручні покарання"
settings_del_desc_welcome: "Привітання, яке я надсилаю, коли хтось долучається."
settings_del_desc_goodbye: "Прощання, яке я надсилаю, коли хтось виходить."
settings_del_desc_rules: "Повідомлення з правилами, яке я надсилаю в групі. Повідомлення з правилами в приватному чаті не видаляється ніколи."
settings_del_desc_auto: "Мої сповіщення про заходи, яких я вживаю щодо учасника самостійно: вимоги, флуд, чорний список і ШІ-спам."
settings_del_desc_manual: "Мої відповіді після /ban, /mute, /kick, /warn та подібних команд. Помилки й списки залишаються."
settings_del_sec_member: "Від учасників"
settings_del_list_mem: "Виберіть, які повідомлення учасників я видаляю. Натисніть рядок, щоб налаштувати."
settings_del_mem_commands: "Команди"
settings_del_mem_edited: "Відредаговані"
settings_del_mem_self: "Самовидалення"
settings_del_desc_commands: "Команди, які я обробляю, зокрема від адмінів. Я видаляю команду після обробки, а моя відповідь залишається."
settings_del_desc_edited: "Я видаляю повідомлення учасника, якщо його відредаговано пізніше, ніж через час відстрочки після надсилання. Якщо правку зроблено раніше, повідомлення залишається."
settings_del_desc_self: "Кожне повідомлення учасника, надіслане відтепер, видаляється через обраний час. Уже надіслані повідомлення та мої власні не зачіпаються."
settings_del_hint_commands: "Команда для іншого бота або невідома мені ніколи не видаляється."
settings_del_hint_edited: "Я не бачу, що саме змінила правка, тому враховується будь-яка пізня правка. Адмінів і схвалених учасників це не стосується. Повідомлення старше 47 годин зберігається."
settings_del_hint_self: "Адмінів, схвалених учасників і закріплених повідомлень це не стосується. Вимкнення скасовує видалення, що ще очікують. У дуже активній групі частину повідомлень може бути збережено."
settings_del_hint_grace: "Час відстрочки відлічується від моменту надсилання повідомлення. Максимум — 1 година."
