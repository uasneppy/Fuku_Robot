# AI spam filter module strings
aispam_help_msg: "<b>🤖 AI-фільтр спаму</b>\n\nФільтр, який вмикають за бажанням: AI-модель оцінює кожне повідомлення в чаті та видаляє ті, які впевнено вважає спамом.\n\nБільше нічого не відбувається: ні попередження, ні муту, ні відповіді, ні сповіщення. Повідомлення, яке модель впевнено вважає спамом, тихо видаляється, а відправнику про це не повідомляють.\n\nПовідомлення англійською видаляються від 80% впевненості, а будь-якою іншою мовою — від 90%, бо модель передусім англомовна.\n\n\n*Команди адмінів:*\n\n× /aispam: Показати, чи увімкнено фільтр і що саме надсилається моделі.\n\n× /aispam `<on/off>`: Увімкнути або вимкнути фільтр у цьому чаті.\n\n\nФільтр вимкнено в кожному чаті, доки його не ввімкне адмін, і він працює лише тоді, коли оператор бота налаштував API-ключ.\n"
aispam_status_enabled: "AI-фільтр спаму в цьому чаті <b>увімкнено</b>."
aispam_status_disabled: "AI-фільтр спаму в цьому чаті <b>вимкнено</b>. Увімкніть його командою <code>/aispam on</code>."
aispam_status_key_missing: "⚠️ Недоступно: оператор бота не налаштував API-ключ, тому жодне повідомлення не перевіряється."
aispam_status_globally_disabled: "⚠️ Недоступно: оператор бота вимкнув AI-фільтр спаму глобально, тому жодне повідомлення не перевіряється."
aispam_data_notice: "<b>Що надсилається для кожного перевіреного повідомлення:</b>\n• Назва, опис, правила і мова чату\n• Профіль відправника: скільки днів тому бот уперше його побачив, кількість повідомлень за останню годину, кількість попереджень\n• Текст або підпис повідомлення, домени посилань у ньому, а також чи це пересилання або відповідь\n• Кілька останніх повідомлень відправника в цьому чаті\n\n\nІмена, юзернейми, ID користувачів, номери телефонів і повідомлення з інших чатів не надсилаються.\n"
aispam_enabled_success: "✅ AI-фільтр спаму тепер <b>увімкнено</b>. Повідомлення, які модель впевнено вважає спамом, буде видалено."
aispam_disabled_success: "❌ AI-фільтр спаму тепер <b>вимкнено</b>."
aispam_no_key: "❌ Увімкнути AI-фільтр спаму не можна: оператор бота не налаштував API-ключ. Нічого не змінено."
aispam_globally_disabled: "❌ Увімкнути AI-фільтр спаму не можна: оператор бота вимкнув його глобально. Нічого не змінено."
aispam_invalid_option: "Незрозумілий ввід. Я приймаю: <code>on</code>/<code>off</code>/<code>yes</code>/<code>no</code>"
aispam_breaker_notice: "⚠️ AI-перевірки спаму в цьому чаті призупинено на кілька хвилин через повторні збої AI-провайдера. Вони відновляться самі, а фільтр лишається увімкненим."

# Admin module extended documentation
admin_extended_docs: "<b>Підтримка анонімних адмінів</b>\n\nКоманда <code>/anonadmin</code> дозволяє власникам групи вмикати розпізнавання анонімних адмінів:\n<code>/anonadmin on</code> - Увімкнути перевірку анонімних адмінів\n<code>/anonadmin off</code> - Вимкнути перевірку анонімних адмінів\n\nКоли перевірку увімкнено, бот просить анонімні акаунти підтвердитися перед адмінською дією.\n\n<b>Як працює перевірка анонімного адміна:</b>\n1. Бот бачить, що відправник — GroupAnonymousBot\n2. Початкове повідомлення кешується на 20 секунд\n3. У чат надсилається кнопка «Підтвердити адміна»\n4. Хто її натисне, того перевіряють як адміна, і команда виконується\n5. Якщо ніхто не підтвердився, кнопка спливає за 20 секунд\n\n<b>Підтримувані команди:</b>\nАдміни: /promote, /demote, /title\nБани: /ban, /dban, /sban, /tban, /unban\nМути: /mute, /smute, /dmute, /tmute, /unmute\nЗакріплення: /pin, /unpin, /permapin, /unpinall\nОчищення: /purge, /del\nПопередження: /warn, /swarn, /dwarn\n"

admin_notes_docs: "<b>Примітки щодо безпеки</b>\n• Увесь ввід користувачів екранується в HTML, щоб запобігти ін'єкціям\n• Зміни прав адмінів виконуються з обробкою помилок і відновленням після паніки\n"

# Antiflood extended docs
antiflood_notes_docs: "<b>Стандартна поведінка</b>\nАнтифлуд <b>стандартно вимкнено</b>. Увімкніть його самі командою <code>/setflood &lt;number&gt;</code>.\n"

# Locks module extended documentation
locks_types_docs: "<b>Блокування дозволів</b> (16 типів)\n<code>sticker</code> - Стікери\n<code>audio</code> - Аудіофайли\n<code>voice</code> - Голосові повідомлення\n<code>document</code> - Документи\n<code>video</code> - Відео\n<code>videonote</code> - Відеоповідомлення\n<code>contact</code> - Контакти\n<code>photo</code> - Фото\n<code>gif</code> - GIF\n<code>url</code> - Посилання\n<code>bots</code> - Додавання ботів\n<code>forward</code> - Пересилання\n<code>game</code> - Ігри\n<code>location</code> - Геолокації\n<code>rtl</code> - Текст справа наліво\n<code>anonchannel</code> - Повідомлення від каналів\n\n<b>Блокування обмежень</b> (6 типів)\n<code>messages</code> - Усі повідомлення\n<code>comments</code> - Коментарі не учасників\n<code>media</code> - Усі медіа\n<code>other</code> - Ігри/стікери/GIF\n<code>previews</code> - Прев'ю посилань\n<code>all</code> - Усе\n"

locks_notes_docs: "<b>Технічні примітки</b>\n• Блокування діють у реальному часі\n• На адмінів блокування не поширюються\n• Блокування зберігаються після перезапуску бота\n• Кеш очищується під час оновлень\n"

# Languages extended docs
languages_extended_docs: "<b>Як це працює</b>\n• <b>Особисті чати:</b> будь-хто може змінити власну мову\n• <b>Групи:</b> мову групи можуть змінювати лише адміни\n\nМовні налаштування кешуються для швидкодії й зберігаються окремо для користувачів і груп.\n"

# Greetings extended docs
greetings_extended_docs: "<b>Інтеграція з капчею</b>\nКоли модуль капчі увімкнено:\n1. Нових учасників мутять під час вступу\n2. Замість привітання надсилається капча\n3. Після перевірки надсилається привітання\n4. Якщо перевірку не пройдено, застосовується дія капчі\n"

# Extended documentation locale keys - Notes module
notes_extended_docs: "<b>Можливості:</b>\n• <b>Текст і медіа</b>: Зберігайте текст, фото, відео, документи та інше\n• <b>Власні кнопки</b>: Додавайте до нотаток вбудовані кнопки\n• <b>Параметри форматування</b>: Керуйте показом і поведінкою нотатки\n• <b>Нотатки для адмінів</b>: Обмежуйте окремі нотатки адміністраторами\n• <b>Приватні нотатки</b>: Надсилайте нотатки користувачам в особисті\n• <b>Попередній перегляд</b>: Вмикайте або вимикайте прев'ю посилань\n• <b>Захищений вміст</b>: Забороняйте пересилати вміст нотатки\n\n<b>Параметри форматування нотаток:</b>\nПід час збереження нотатки спеціальні теги керують її поведінкою:\n• <code>{private}</code> - Нотатка надсилається лише в особисті, ніколи в групу\n• <code>{noprivate}</code> - Нотатка надсилається лише в групу, ніколи в особисті\n• <code>{admin}</code> - Нотатку можуть отримати лише адміни\n• <code>{protect}</code> - Вміст не можна переслати\n• <code>{nonotif}</code> - Надсилається без звуку сповіщення\n• <code>{nopreview}</code> - Без прев'ю посилань\n\n<b>Режим приватних нотаток:</b>\nКоли приватні нотатки увімкнено (<code>/privatenotes on</code>), усі нотатки йдуть користувачам в особисті, а не в групу. Чат групи лишається чистим.\n\nОкрема нотатка може це змінити:\n• <code>{private}</code> - Завжди надсилати в особисті\n• <code>{noprivate}</code> - Завжди надсилати в групу\n\n<b>Сира нотатка (без форматування):</b>\nЩоб побачити вміст нотатки без форматування (для редагування):\n<code>/get notename noformat</code>\n"

notes_permissions_docs: "<b>Потрібні права:</b>\n• Зберігати/видаляти нотатки: Change Group Info\n• Переглядати нотатки адмінів: статус адміна\n• Видаляти всі нотатки: власник чату\n• Отримувати звичайні нотатки: будь-хто\n"

# Extended documentation locale keys - Pins module
pins_extended_docs: "<b>Можливості:</b>\n\n<b>Anti-Channel Pin:</b>\nКоли увімкнено, бот відкріплює кожне повідомлення, яке автоматично закріпив пов'язаний канал. Зручно, коли ви хочете самі вирішувати, що закріплено в групі.\n\n<b>Важливо:</b> з увімкненим anti channel pin завжди відкріплюйте командою <code>/unpin</code>, а не вручну в Telegram. Після ручного відкріплення старе повідомлення знову закріпиться, щойно канал щось опублікує.\n\n<b>Clean Linked:</b>\nКоли увімкнено, бот видаляє кожне повідомлення, надіслане в групу з пов'язаного каналу. Чат групи лишається вільним від дублікатів дописів каналу.\n\n<b>Permapin:</b>\nСтворюйте власні закріплені повідомлення з:\n• Текстом із форматуванням HTML/Markdown\n• Вбудованими кнопками з посиланнями\n• Медіа (фото, документи, стікери, аудіо, відео, голосові, відеоповідомлення)\n• Усіма стандартними заповнювачами ({first}, {chatname} тощо)\n\n<b>Працює через підключення:</b>\nЦі команди працюють, коли ви підключені до чату через <code>/connect</code>:\n• <code>/antichannelpin</code>\n• <code>/cleanlinked</code>\n"

pins_notes_docs: "<b>Примітки:</b>\n• <code>/unpinall</code> просить підтвердження, перш ніж відкріпити все\n• Permapin підтримує всі типи медіа, які Telegram дозволяє закріплювати\n• Налаштування anti-channel pin і clean linked зберігаються для кожного чату окремо й переживають перезапуск бота\n\n<b>Потрібні права:</b>\n<b>Бот:</b> адмін із правом \"Pin Messages\"\n<b>Користувач:</b> більшість команд потребує адміна з правом \"Pin Messages\"\n"

# Extended documentation locale keys - Purges module
purges_extended_docs: "<b>Видалення діапазону через purgefrom/purgeto:</b>\nКоли треба точніше керувати тим, що видаляється:\n\n1. Дайте відповідь на <b>перше</b> повідомлення діапазону:\n<code>/purgefrom</code>\nБот підтвердить позначку (вона діє 30 секунд).\n\n2. Дайте відповідь на <b>останнє</b> повідомлення діапазону:\n<code>/purgeto</code>\nУсі повідомлення між позначками (включно) буде видалено.\n\nЗручно, коли до початку важко догортати або треба перевірити діапазон перед видаленням.\n\n<b>Обмеження:</b>\n• <b>Максимум за одне очищення:</b> 1000 повідомлень\n• <b>Вік повідомлень:</b> старші за 48 годин можуть не видалятися (обмеження Telegram API)\n• <b>Потрібні права:</b> і користувач, і бот мають мати право \"Delete Messages\"\n"

purges_notes_docs: "<b>Примітки:</b>\n• Позначка <code>/purgefrom</code> спливає за 30 секунд, якщо не надійшло <code>/purgeto</code>\n• Великі діапазони видаляються паралельно, для швидкості\n• Повідомлення про результат (скільки видалено) зникають за 3 секунди\n• Уже видалені повідомлення пропускаються без помилок\n"

# Extended documentation locale keys - Reports module
reports_extended_docs: "<b>Як це працює:</b>\n\n<b>Скарга на повідомлення:</b>\n1. <b>Дайте відповідь на порушне повідомлення</b> командою <code>/report</code> або згадайте <code>@admin</code>\n2. Бот надсилає сповіщення зі згадкою всіх адмінів, у яких увімкнено скарги\n3. У сповіщенні є кнопки для швидкої модерації\n\n<b>Кнопки для адмінів:</b>\n• <b>📩 Повідомлення</b> - Посилання на повідомлення, на яке скаржаться\n• <b>👢 Вигнати</b> - Вигнати користувача (повернутися можна)\n• <b>🚫 Бан</b> - Назавжди забанити користувача\n• <b>🗑 Видалити</b> - Видалити повідомлення\n• <b>✅ Вирішено</b> - Позначити скаргу вирішеною без дій\n\n<b>Особисті та групові налаштування:</b>\n• <b>В особистих:</b> <code>/reports on/off</code> вмикає або вимикає сповіщення про скарги для ВАС\n• <b>У групі:</b> <code>/reports on/off</code> вмикає або вимикає скарги в цій групі\n"
reports_permissions_docs: "<b>Хто може скаржитися?</b>\n✅ Звичайні користувачі\n❌ Адміни (скаржитися самим собі немає сенсу)\n❌ Заблоковані користувачі\n❌ Анонімні канали / системні акаунти Telegram\n\n<b>На кого можна скаржитися?</b>\n✅ На звичайних користувачів\n❌ На самого бота\n❌ На адмінів (вони захищені від скарг)\n❌ На анонімні канали / системні акаунти Telegram\n"

# Extended documentation locale keys - Rules module
rules_extended_docs: "<b>Можливості:</b>\n\n<b>Приватні правила:</b>\nУвімкніть приватні правила (<code>/privaterules on</code>), щоб надсилати правила в особисті, а не в групу. Чат групи лишається чистим.\n\n<b>Власна кнопка правил:</b>\nЗадайте власний текст кнопки (до 30 символів):\n<code>/rulesbtn View Rules</code>\n\nСкинути до стандартного:\n<code>/resetrulesbtn</code>\n\n<b>Встановлення правил:</b>\nЗадайте правила текстом після команди або у відповідь на повідомлення:\n<code>/setrules Please be respectful to all members.</code>\n\nАбо у відповідь на повідомлення:\n<code>/setrules</code>\n\n<b>Потрібні права:</b>\n• Команди для користувачів: доступні всім\n• Команди адмінів: потрібні права адміна в чаті\n"

# Extended documentation locale keys - Warns module
warns_extended_docs: "<b>Стандартні налаштування:</b>\n• <b>Стандартний ліміт:</b> 3 попередження\n• <b>Стандартна дія:</b> mute\n\n<b>Доступні дії:</b>\n• <code>ban</code> - Назавжди забанити користувача в чаті\n• <code>kick</code> - Вигнати користувача (повернутися можна)\n• <code>mute</code> - Замутити користувача (писати не можна)\n\n<b>Тихі попередження і з видаленням:</b>\n• <code>/swarn</code> - Видалити вашу команду і тихо попередити\n• <code>/dwarn</code> - Видалити повідомлення користувача і попередити\n"

warns_permissions_docs: "<b>Потрібні права:</b>\n• <code>/warn</code>, <code>/dwarn</code>, <code>/swarn</code>: бот-адмін + адмін із правом обмежувати\n• <code>/rmwarn</code>, <code>/unwarn</code>: бот-адмін + адмін\n• <code>/resetwarn</code>, <code>/resetwarns</code>: бот-адмін + адмін\n• <code>/resetallwarns</code>: лише власник чату\n• <code>/setwarnmode</code>, <code>/setwarnlimit</code>: бот-адмін + адмін\n• <code>/warnings</code>: бот-адмін + адмін\n• <code>/warns</code>: будь-хто (можна вимкнути)\n"

warns_notes_docs: "<b>Примітки:</b>\n• Коли користувач досягає ліміту, налаштована дія (ban/kick/mute) застосовується автоматично\n• Причини попереджень зберігаються й показуються під час перегляду\n• <code>/warns</code> — єдина команда модуля, яку адміни можуть вимкнути\n• Анонімні дописи каналу попередити не можна\n• Адмінів попередити не можна\n"

# Extended documentation locale keys - Mutes module
mutes_extended_docs: "<b>Формат часу для тимчасового муту:</b>\n• <code>m</code> = хвилини (напр., <code>30m</code>)\n• <code>h</code> = години (напр., <code>2h</code>)\n• <code>d</code> = дні (напр., <code>1d</code>)\n\n<b>Варіанти муту:</b>\n• <code>/mute</code> - Звичайний мут із необов'язковою причиною\n• <code>/smute</code> - Тихий мут (видаляє вашу команду)\n• <code>/dmute</code> - Мут із видаленням (мутить користувача і видаляє його повідомлення)\n• <code>/tmute</code> - Тимчасовий мут на вказаний час\n\n<b>Потрібні права:</b>\n<b>Команди лише для адмінів.</b> Той, хто їх виконує, повинен мати:\n• Статус адміна в чаті\n• Право обмежувати учасників\n\nБот також має бути адміном із правом обмежувати учасників.\n"

# Extended documentation locale keys - Filters module
filters_extended_docs: "<b>Розширені можливості:</b>\n\n<b>Випадкові відповіді:</b>\nРозділіть кілька відповідей знаками <code>%%%</code>. Одна обирається випадково:\n<code>/filter hello Hi there!%%%Hello!%%%Hey, how are you?</code>\n\n<b>Медіафільтри:</b>\nДайте відповідь на будь-яке медіа (фото, відео, документ, стікер тощо) командою <code>/filter trigger</code>, щоб фільтр надсилав саме його.\n\n<b>Режим noformat:</b>\nАдміни можуть побачити сирий вміст фільтра (з кодами форматування), додавши <code>noformat</code> після тригера:\n<code>hello noformat</code>\nЗручно, щоб налагоджувати фільтри або перевіряти кнопки.\n\n<b>Кнопки фільтрів:</b>\nДо фільтрів можна додавати вбудовані кнопки:\n<code>/filter hello Hello! Check out these links:\n[Button 1](buttonurl:https://example.com)\n[Button 2](buttonurl:https://example2.com)</code>\n"

filters_technical_docs: "<b>Як працюють фільтри:</b>\n1. Коли надходить повідомлення, бот отримує всі фільтри чату оптимізованим кешованим запитом\n2. Алгоритм Ахо-Корасік зіставляє всі ключові слова з текстом повідомлення\n3. Перший збіг запускає відповідь\n4. Фільтри підтримують текст, медіа і кнопки\n\n<b>Підтвердження перезапису:</b>\nЯкщо ви додаєте фільтр, що вже існує, бот перепитає перед перезаписом. Підтвердження діє 5 хвилин.\n\n<b>Поведінка кешу:</b>\n• Списки фільтрів кешуються на 15 хвилин для кожного чату\n• Кеш очищується автоматично, коли фільтри додають або видаляють\n"

filters_limits_docs: "<b>Обмеження:</b>\n• Щонайбільше 150 фільтрів на чат\n• Щонайбільше 100 символів у ключовому слові\n• Ключові слова зберігаються малими літерами\n\n<b>Потрібні права:</b>\n• <code>/filter</code>, <code>/addfilter</code>: адмін із правом Change Info\n• <code>/stop</code>, <code>/rmfilter</code>, <code>/removefilter</code>: адмін із правом Change Info\n• <code>/stopall</code>: лише власник чату\n• <code>/filters</code>: доступно всім\n"

# Extended documentation locale keys - Captcha module
captcha_extended_docs: |
  <b>Як це працює:</b>
  1. Коли капчу ввімкнено, нові учасники автоматично отримують мут одразу після вступу
  2. Новому учаснику надсилається завдання капчі
  3. Користувач має вибрати правильну відповідь із запропонованих варіантів
  4. Якщо все вдало, мут знімається і користувач може брати участь у групі
  5. Якщо він не впорався або вийшов час, виконується налаштована дія (kick, ban або mute)

  <b>Типи капчі:</b>
  • <b>Математична</b>: розв'язати простий арифметичний приклад (додавання, віднімання, множення)
  • <b>Текстова</b>: розпізнати текст на спотвореному зображенні

  <b>Відкладені повідомлення:</b>
  Поки користувач проходить капчу, всі повідомлення, які він намагається надіслати, зберігаються й видаляються. Адміни можуть:
  • Переглянути, що користувач намагався надіслати, командою <code>/captchapending</code>
  • Очистити збережені повідомлення командою <code>/captchaclear</code>

  Це допомагає виявити можливий спам до завершення перевірки.

captcha_permissions_docs: "<b>Вимоги до бота:</b>\n• Бан користувачів (для дій kick/ban)\n• Обмеження учасників (для муту під час перевірки)\n• Видалення повідомлень (для прибирання повідомлень капчі)\n\n<b>Дії при невдачі:</b>\n• <code>kick</code> - вигнати користувача з можливістю повернутися\n• <code>ban</code> - назавжди забанити користувача\n• <code>mute</code> - тримати користувача в муті 24 години\n"

# Extended documentation locale keys - Blacklists module
blacklists_extended_docs: "<b>Доступні дії:</b>\nДію задає команда <code>/blaction</code>:\n• <code>none</code> - Лише видаляє повідомлення, нічого більше\n• <code>warn</code> - Видаляє повідомлення і попереджає користувача (стандартно)\n• <code>mute</code> - Видаляє повідомлення і мутить користувача\n• <code>kick</code> - Видаляє повідомлення і виганяє користувача (повернутися можна)\n• <code>ban</code> - Видаляє повідомлення і назавжди банить користувача\n\n<b>Примітка:</b>\nСтандартний режим чорного списку — <b>warn</b>: повідомлення видаляється, користувач отримує попередження.\n\n<b>Команди:</b>\n• <code>/addblacklist &lt;trigger&gt;</code> - Додає слово до чорного списку чату\n• <code>/rmblacklist &lt;trigger&gt;</code> - Прибирає слово з чорного списку чату\n• <code>/blaction &lt;mute/kick/ban/warn/none&gt;</code> - Дія бота, коли знайдено заборонене слово\n• <code>/remallbl</code> - Видаляє всі слова з чорного списку чату (лише власник)\n"

# Extended documentation locale keys - Disabling module
disabling_extended_docs: "<b>Основні можливості:</b>\n• Вимикати окремі команди бота для неадмінів\n• Адміни завжди можуть користуватися вимкненими командами\n• За бажанням — автоматично видаляти вимкнені команди\n• Вимикати кілька команд одразу\n\n<b>Кілька команд одразу:</b>\n<code>/disable adminlist rules info</code>\nВимикає <code>/adminlist</code>, <code>/rules</code> і <code>/info</code> за раз.\n\n<b>Видалення команд:</b>\n<code>/disabledel on</code> - Відтепер вимкнені команди видалятимуться.\n<code>/disabledel off</code> - Відтепер вимкнені команди не видалятимуться.\n<code>/disabledel</code> - Поточне налаштування видалення.\n"

disabling_notes_docs: "<b>Важливо:</b>\n• <b>Адміни понад правилом:</b> вимкнені команди діють лише на неадмінів. Усі адміни можуть користуватися будь-якою командою.\n• <b>Підключення:</b> вимкнені команди й далі доступні через <code>/connect</code> для підключених чатів.\n• <b>Кілька команд:</b> і <code>/disable</code>, і <code>/enable</code> приймають кілька назв в одному повідомленні.\n• <b>Обробка помилок:</b> якщо частину команд не вдалося вимкнути чи ввімкнути, ви дізнаєтеся, які спрацювали, а які ні.\n\n<b>Потрібні права:</b>\n• <code>/disable</code>, <code>/enable</code>, <code>/disabledel</code>: лише адміни\n• <code>/disableable</code>, <code>/disabled</code>: усі користувачі (але <code>/disabled</code> можна вимкнути)\n"

# Extended documentation locale keys - Help module
help_extended_docs: "<b>Система навігації:</b>\nМодуль довідки — це головний вхід і навігація бота. Коли користувач надсилає <code>/start</code> в особистому чаті, бот показує привітання з вбудованою клавіатурою для переходу до модулів.\n\nКоманда <code>/help</code> показує список модулів. Кнопка модуля відкриває його команди й опис використання. Якщо <code>/help</code> надіслано в групі, бот переводить користувача в особистий чат, щоб не засмічувати групу.\n\n<code>/about</code> показує відомості про бота, версію і посилання, а <code>/donate</code> — як підтримати проєкт.\n"

# Extended documentation locale keys - Devs module
devs_extended_docs: "<b>Ієрархія команди:</b>\nМодуль Devs містить команди керування й діагностики бота, доступні лише внутрішній команді. Команда має три рівні з дедалі меншими правами.\n\n<b>Рівень 1 — Власник:</b> Задається змінною середовища <code>OWNER_ID</code> під час розгортання. Повний контроль: склад команди, усі команди діагностики, усі командні команди.\n\n<b>Рівень 2 — Sudo / Dev:</b> Призначає власник через <code>/addsudo</code> або <code>/adddev</code>. Команди діагностики: статистика бота, відомості про чат, керування чатами.\n\n<b>Рівень 3 — Учасник команди:</b> Автоматично охоплює власника + усіх sudo + усіх dev. Може лише переглядати склад команди через <code>/teamusers</code>.\n\n<b>Примітка:</b> Sudo і Dev мають однаковий доступ до команд. Різниця існує для організаційних потреб.\n\n<b>Важливо:</b> Ці команди не видно в загальному меню довідки, а неуповноважених користувачів вони мовчки ігнорують.\n"

# Extended documentation locale keys - Users module
users_extended_docs: "<b>Фоновий облік:</b>\nМодуль Users — пасивний фоновий модуль без команд для користувачів. Він тихо працює на кожному повідомленні, яке обробляє бот, і записує всіх відправників і всі чати, де бот активний.\n\n<b>Що записується:</b>\n• ID, юзернейми та імена кожного відправника повідомлень\n• ID і назви кожної групи, де є бот\n• ID, назви та юзернейми пов'язаних каналів\n\n<b>Обмеження частоти:</b>\n• Оновлення користувачів: не частіше одного за <code>UserUpdateInterval</code>\n• Оновлення чатів: не частіше одного за <code>ChatUpdateInterval</code>\n• Це запобігає зайвим записам у базу і водночас тримає дані досить свіжими\n\n<b>Пасивна робота:</b>\n• Працює як спостерігач повідомлень у групі обробників -1 (спрацьовує раніше за всі команди)\n• Жодних дій від користувача — повністю автоматично\n• Інші модулі, як-от <code>/info</code>, залежать від даних цього модуля\n"

