# AntiRaid module strings
antiraid_help_msg: |
  Старий режим рейду вимкнено, тимчасових банів більше немає. Я автоматично блокую групу, коли починається рейд, а адміни можуть заблокувати її вручну.

  × <code>/autolockdown</code>: переглянути або змінити автоматичні тригери — наплив учасників і потік повідомлень.
  × <code>/lockdown</code> і <code>/unlockdown</code>: заблокувати цю групу вручну та зняти блокування.
  × <code>/autoantiraid N|off</code>: усе ще задає поріг напливу учасників (від 3 до 500 входів за 60 секунд) і вмикає його, або вимикає наплив.

  <code>/antiraid</code>, <code>/raidtime</code> і <code>/raidactiontime</code> тепер лише вказують сюди й нічого не змінюють.
  Старий автоматичний поріг групи став її порогом напливу учасників.

# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: "Федерації ділять один список банів між групами, якими ви володієте. Одне видалення — усі об'єкти.\n\n*Власник (в особистих):*\n× /newfed <name>: Створити федерацію (одна на користувача).\n× /renamefed <name>: Перейменувати федерацію.\n× /delfed: Видалити федерацію (з підтвердженням).\n× /fedpromote /feddemote: Керувати адмінами федерації.\n× /fedreason on/off: Вимагати причину для fban.\n× /fednotif on/off: Повідомляти власника в особисті про fban.\n× /subfed /unsubfed /fedsubs: Підписка на іншу федерацію (до 5).\n× /fbanlist [csv|json|minicsv]: Експорт fban.\n× /importfbans: Імпорт із CSV/JSON-файлу, на який ви відповіли.\n× /setfedlog /unsetfedlog: Чат журналу федерації.\n\n*Власник групи:*\n× /joinfed <fed_id>: Приєднати цей чат до федерації.\n× /leavefed: Вийти з федерації.\n× /quietfed on/off: Приховати пасивні сповіщення про fban.\n\n*Адміни федерації:*\n× /fban /unfban /funban: Бан/розбан у федерації.\n× /fedstat /fbanstat: Перевірити fban користувача.\n\n*Усі:*\n× /fedinfo /fedadmins /chatfed /myfeds\n"
logchannels_help_msg: "Надсилайте дії адмінів в окремий канал журналу. Кожен об'єкт веде записи.\n\n1. Додайте бота в канал як адміна.\n2. У цьому каналі надішліть /setlog.\n3. Перешліть це повідомлення в групу.\n\n*Команди адмінів:*\n× /unsetlog: Прибрати канал журналу.\n× /logchannel: Показати поточний канал журналу.\n× /logcategories: Список категорій.\n× /log <category>: Увімкнути категорію.\n× /nolog <category>: Вимкнути категорію.\n\nКатегорії: settings, admin, user, automated, reports, other.\n"
