# Backup/Restore module strings
backup_help_msg: "<b>📦 Резервні копії</b>\n\nЗберігайте й відновлюйте налаштування групи цими командами. Документація об'єкта: збережена й доступна.\n\n<b>Команди для користувачів:</b>\n• /export - Експортувати всі налаштування групи у JSON-файл\n• /export notes filters rules - Експортувати лише окремі модулі\n\n<b>Команди творця:</b>\n• /import - У відповідь на файл копії — відновити налаштування\n• /import notes filters - Імпортувати лише окремі модулі\n• /reset - Скинути всі налаштування до стандартних\n• /reset warnings locks - Скинути лише окремі модулі\n\n<b>Обмеження частоти:</b>\n• Експорт: 1 раз на 5 хвилин\n• Імпорт: 1 раз на 10 хвилин\n• Скидання: 1 раз на годину\n"

backup_export_button: "📤 Експорт"
backup_import_button: "📥 Імпорт"
backup_export_success: "<b>✅ Експорт завершено.</b>\n\n<b>Чат:</b> %s\n<b>Експортовано модулів:</b> %d\n<b>Час експорту:</b> %s\n\n<b>Модулі:</b>\n%s\n"

backup_export_success_text: "✅ Експортовано модулів: {modules}. Завантажте файл копії вище."
backup_export_rate_limited: "⏳ Зачекайте <b>{time}</b>, перш ніж експортувати знову."
backup_export_no_modules: "❌ Для цього чату немає модулів для експорту."
