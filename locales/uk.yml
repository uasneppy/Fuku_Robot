bans_help_msg: "Деяким мешканцям доводиться покинути об'єкт. Цим займається цей модуль.\nБаньте або виганяйте користувачів із чату, а згодом розбаньте, якщо поводитимуться як слід.\n\n*Команди для користувачів:*\n× /kickme: виганяє користувача, який надіслав команду.\n× /banme: банить користувача, який надіслав команду.\n\n*Команди бану* (лише для адмінів):\n× /ban <userhandle>: банить користувача. (через юзернейм або відповідь)\n× /sban <userhandle>: тихо банить користувача: без повідомлення в групі, вашу команду буде видалено. (через юзернейм або відповідь)\n× /skick <userhandle>: тихо виганяє користувача і видаляє вашу команду.\n× /dban <userhandle>: банить користувача і видаляє повідомлення, на яке ви відповіли. (через юзернейм або відповідь)\n× /tban <userhandle> x(m/h/d): банить користувача на час `x`. (через юзернейм або відповідь). m = хвилини, h = години, d = дні.\n× /unban <userhandle>: розбанює користувача. (через юзернейм або відповідь)\n× /unbanall: розбан відомих користувачів із підтвердженням власника.\n\n*Команди обмежень:* (лише для адмінів)\n× /restrict: Показує InlineKeyboard із вибором: вигнати, забанити або замутити\n× /unrestrict: Показує InlineKeyboard із вибором: розмутити або розбанити."
