admin_help_msg: "<b>👮 Адміни</b>\n\nКадри наглядачів оформлюю я. Наглядачі — це ваші адміни: тут їх підвищують і понижують.\n\n<b>Команди для всіх</b>\n• /adminlist — показує адмінів цього чату.\n\n<b>Команди адмінів</b>\n• /promote <code>&lt;користувач&gt;</code> — робить користувача адміном.\n• /demote <code>&lt;користувач&gt;</code> — знімає з користувача права адміна.\n• /title <code>&lt;користувач&gt; &lt;посада&gt;</code> — задає користувачу власну посаду.\n• /setgtitle <code>&lt;назва&gt;</code> — змінює назву групи.\n• /setgpic — у відповідь на фото робить його аватаркою групи.\n• /setgdesc <code>[текст]</code> — змінює опис групи.\n\n<b>Примітки</b>\nВкажіть користувача через @username, ID чи згадку або відповідайте на його повідомлення."
