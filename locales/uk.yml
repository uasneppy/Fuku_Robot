blacklists_help_msg: "Заборонені слова видаляються одразу. Контрабанда на об'єкті не допускається.\n\n*Команди для користувачів:*\n× /blacklists: Переглянути чорний список чату.\n\n*Команди адмінів:*\n× /addblacklist `<trigger>`: Додати слово до чорного списку чату.\n× /rmblacklist `<trigger>`: Прибрати слово з чорного списку чату.\n× /blaction `<mute/kick/ban/warn/none>`: Дія бота, коли знайдено заборонене слово.\n× /blacklistaction: Те саме\n\n*Лише для власника:*\n× /remallbl: Видалити всі слова з чорного списку чату\n\n*Примітка:*\nСтандартний режим чорного списку — *none*: повідомлення просто видаляються з чату."
