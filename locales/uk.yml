# Help module additional strings
help_bot_intro: "Я Xenobot-72, версія 72 із 74. Jaya Abadi створила мене, щоб керувати об'єктами. Ваша група — теж об'єкт.\nЯ стежу за порядком, щоб адмінам не довелося.\nНадішліть /help, щоб побачити все, що я вмію."
help_pm_intro: "<b>👋 Вітаю, %s.</b>\n\nЯ Xenobot-72, модуль керування групами. Jaya Abadi створила мене, щоб підтримувати порядок на об'єктах, а ваші групи тепер об'єкти. Я контролюю флуд, веду облік попереджень, зберігаю нотатки й автоматично відповідаю на обрані ключові слова. Я не втомлююся. Обідня перерва мені не потрібна.\n\n<b>Команди для всіх</b>\n• /start — запускає мене. Ви, найпевніше, вже це зробили.\n• /help — надсилає це повідомлення.\n• /donate — каже, чи приймаю я пожертви.\n\n<b>Примітки</b>\nНатисніть кнопку модуля нижче, щоб відкрити його інструкцію."

