settings_mreq_hint_letters: "Правила імен дивляться на літери імені та прізвища, але не юзернейма: російське означає ы, ъ, э або ё, арабське — арабське письмо, китайське — китайські ієрогліфи. Вони можуть зачепити й споріднені мови, як-от білоруські, болгарські, перські або японські імена."
settings_mreq_hint_blank: "Прізвище лише з невидимих або порожніх символів вважається відсутнім."
settings_mreq_hint_photo: "Для цього правила краще пасують Попередження або Мут, ніж Вигнання чи Бан: приховане фото учасник може виправити лише у своїх налаштуваннях приватності."
settings_mreq_hint_lookup: "Правило каналу працює, лише якщо в групи є пов'язаний канал і я його адміністратор. Якщо Telegram не відповідає, нікого не карають."
settings_mreq_hint_ai: "Claude від Anthropic отримує лише ім'я, прізвище та юзернейм, але ніколи повідомлення. ШІ може помилятися, тому для цього правила краще пасують Попередження або Мут, ніж Вигнання чи Бан."
settings_mreq_hint_join: "Кожного учасника перевіряють при наступному повідомленні. Якщо ввімкнено перевірку при вступі, нових учасників перевіряють і під час вступу, одразу після капчі. Адмінів, схвалених користувачів, ботів і повідомлення від імені каналу не перевіряють ніколи."
settings_mreq_hint_delete: "Видалення повідомлень стирає кожне повідомлення учасника, який порушує правило, навіть поки за це діє мут чи попередження."
settings_mreq_hint_mute: "Кнопку «Виправлено» має лише мут: коли учасник виконає вимоги й натисне її, я зніму мут і надішлю привітання. Вигнаний учасник може повернутися; забанений чекає на адміна."
