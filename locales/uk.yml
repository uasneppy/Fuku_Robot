settings_help_msg: "<b>⚙️ Налаштування</b>\n\nОдин пульт керування на весь об'єкт.\n\n<b>Команди адмінів</b>\n• /settings — відкриває меню налаштувань. У групі воно відкривається тут або в приватному чаті; у приватному чаті зі мною показує групи, якими ви можете керувати.\n• /timezone — показує часовий пояс групи або змінює його: /timezone Europe/Kyiv, /timezone +2 чи /timezone default.\n\n<b>Примітки</b>\n• Сторінки: Staff-група, заборонені джерела, локдаун, капча, антифлуд, попередження, замки, чорний список, фільтри, привітання, прощання, правила, нотатки, реакції, повідомлення, вимоги до учасників, видалення, перемикачі, мова, часовий пояс, канал журналу, анонімні адміни й доступ.\n• Списки й повідомлення задаються, коли ви надсилаєте їх мені в приватному чаті.\n• Зміна в меню дорівнює відповідній команді: /linkstaff, /unlinkstaff, /unlockdown, /autolockdown, /captcha, /captchamode, /captchatime, /captchaaction, /setflood, /setfloodmode, /delflood, /setwelcome, /setgoodbye, /setrules та іншим. Для вимог до учасників команди немає: налаштувати їх можна лише в меню.\n• Відкрити меню може лише власник групи, якщо власник не дозволив це адмінам. Самі команди й далі працюють для адмінів.\n• Меню, відкрите в групі, відповідає лише тому, хто його відкрив. Кожне натискання перевіряє, що вам усе ще можна і що у вас є право, потрібне відповідній команді."
