# Backup/Restore module strings
backup_help_msg: |
  <b>📦 Резервні копії та відновлення</b>

  Створюйте резервні копії та відновлюйте налаштування групи за допомогою цих команд:

  <b>Команди для користувачів:</b>
  • /export - експортувати всі налаштування групи у файл JSON
  • /export notes filters rules - експортувати лише вибрані модулі

  <b>Команди для творця:</b>
  • /import - відповісти на файл резервної копії, щоб відновити налаштування
  • /import notes filters - імпортувати лише вибрані модулі
  • /reset - скинути всі налаштування до типових
  • /reset warnings locks - скинути лише вибрані модулі

  <b>Обмеження частоти:</b>
  • Експорт: 1 раз на 5 хвилин
  • Імпорт: 1 раз на 10 хвилин
  • Скидання: 1 раз на годину

