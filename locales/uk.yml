# Reactions module strings
reactions_help_msg: "<b>🎭 Автореакції</b>\n\nАвтоматичні реакції на обрані ключові слова. Бойовий дух — теж ресурс об'єкта.\n\nНалаштуйте емодзі-реакції, що спрацьовують на певні слова.\n\n<b>Команди адмінів:</b>\n• /addreaction <keyword> <emoji> - Додати автореакцію\n• /removereaction <keyword> - Прибрати реакцію\n• /reactions - Список налаштованих реакцій\n• /resetreactions - Очистити всі реакції\n\n<b>Приклад:</b>\n• /addreaction hello 👋 - Бот ставить 👋, коли хтось пише \"hello\"\n"

