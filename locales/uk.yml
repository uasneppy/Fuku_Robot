blacklists_help_msg: "*Команди для користувачів:*\n\n× /blacklists: переглянути всі чорні списки в чаті.\n\n\n*Команди для адмінів:*\n\n× /addblacklist `<trigger>`: додає слово до чорного списку поточного чату.\n\n× /rmblacklist `<trigger>`: вилучає слово з чорного списку чату.\n\n× /blaction `<mute/kick/ban/warn/none>`: встановлює дію бота при виявленні слова з чорного списку.\n\n× /blacklistaction: те саме, що вище\n\n\n*Лише для власника:*\n\n× /remallbl: вилучає всі слова з чорного списку чату\n\n\n*Примітка:*\n\nРежим за замовчуванням для чорного списку — *none*, який просто видаляє повідомлення з чату."
