connections_help_msg: |-
  Цей модуль дозволяє підключитися до бази даних чату й додавати до неї дані так, що чат про це не дізнається! З очевидних причин додавати щось можуть лише адміністратори, але переглядати ваші дані може будь-який учасник. (Заблоковані або вилучені користувачі — ні!)

  *Команди*:
  × /connect `<chatid>`: Підключитися до вказаного чату, щоб переглядати й редагувати його вміст.
  × /disconnect: Відключитися від поточного чату.
  × /reconnect: Повторно підключитися до чату, до якого ви були підключені раніше.
  × /connection: Переглянути інформацію про поточний підключений чат.

  *Команди адміністратора:*
  × /allowconnect <yes/no>: Дозволити користувачам підключатися до чатів чи ні.

  Ідентифікатор чату можна дізнатися командою /id у вашому чаті. Не дивуйтеся, якщо він від'ємний: усі супергрупи мають від'ємні ідентифікатори.
connections_is_user_connected_bot_not_admin: "Я не адміністратор у цьому чаті!"
connections_is_user_connected_need_group: "Цю команду потрібно використовувати в груповому чаті, а не в приватних повідомленнях!"
connections_is_user_connected_user_not_admin: "Щоб це зробити, потрібно бути адміністратором."
connections_not_connected: "Ви не підключені до жодного чату."
connections_stale_connection: "Ваше підключення застаріло — я більше не маю доступу до цього чату. Скористайтеся /connect, щоб підключитися до чинного чату."
connections_reconnect_need_pm: "Щоб повторно підключитися до чату, напишіть мені в приватні повідомлення!"
connections_reconnect_no_last_chat: "У вас немає попереднього чату для повторного підключення!"
connections_reconnect_reconnected: "Ви знову підключені до <b>%s</b>!!"
disabling_help_msg: |-
  Цей модуль дозволяє вимкнути деякі поширені команди, щоб ніхто не міг ними користуватися. Також можна автоматично видаляти їх, щоб не засмічувати чат.

  *Команди адміністратора*:
  × /disable `<commandname>`: Заборонити користувачам використовувати команду в цій групі.
  × /enable `<item name>`: Знову дозволити користувачам використовувати команду в цій групі.
  × /disableable: Список усіх команд, які можна вимкнути.
  × /disabledel `<yes/no/on/off>`: Видаляти вимкнені команди, якщо їх використовують не адміністратори.
  × /disabled: Список вимкнених команд у цьому чаті.

  Примітка:
  Вимкнена команда не працює лише для не-адміністраторів. Усі адміністратори й далі можуть нею користуватися.
  Вимкнені команди залишаються доступними через функцію /connect. Якщо хочете, щоб і це було заборонено, напишіть у чат підтримки.
devs_help_msg: |-
  Команди керування ботом і діагностики, доступні лише власнику бота та довіреним розробникам. Звичайним користувачам вони не показуються.
  *Команди команди:*
  × /stats: Показати статистику бота та системну інформацію.
  × /teamusers: Список усіх учасників команди.
  *Команди власника:*
  × /addsudo: Надати користувачу права sudo.
  × /adddev: Надати користувачу права розробника.
  × /remsudo: Забрати в користувача права sudo.
  × /remdev: Забрати в користувача права розробника.
  *Діагностичні команди:*
  × /chatinfo: Показати докладну інформацію про чат.
  × /chatlist: Створити й надіслати список усіх активних чатів.
  × /leavechat: Примусово змусити бота вийти із вказаного чату.
filters_help_msg: |-
  Фільтри не залежать від регістру: щоразу, коли хтось пише ваші тригерні слова, Fuku відповідатиме чимось іншим! Це можна використати для створення власних команд.

  Команди:
  - /filter <trigger> <reply>: Щоразу, коли хтось пише trigger, бот відповідатиме вказаним реченням. Для фільтрів із кількох слів візьміть тригер у лапки.
  - /filters: Список усіх фільтрів чату.
  - /stop <trigger>: Припинити відповіді бота на trigger.
  - /stopall: Зупинити ВСІ фільтри в поточному чаті. Цю дію неможливо скасувати.

  Приклади:
  - Створити фільтр:
  -> /filter hello Привіт! Як справи?
  - Створити фільтр із кількох слів:
  -> /filter hello friend Привіт і тобі! Давно не бачились!
  - Створити фільтр, яким можуть користуватися лише адміністратори:
  -> /filter example Цей фільтр не спрацює, якщо його напише звичайний користувач {admin}
  - Щоб зберегти файл, зображення, gif або будь-яке інше вкладення, просто дайте відповідь на файл командою:
  -> /filter trigger
formatting_fillings: |-
  <b>Наповнювачі</b>

  Ви можете підставляти у свої повідомлення контекстні дані. Наприклад, згадати користувача на ім'я у привітанні або у фільтрі!
  Їх також можна використовувати, щоб згадувати користувача в нотатках!

  <b>Підтримувані наповнювачі:</b>
  - <code>{first}</code>: Ім'я користувача.
  - <code>{last}</code>: Прізвище користувача.
  - <code>{fullname}</code>: Повне ім'я користувача.
  - <code>{username}</code>: Юзернейм користувача. Якщо його немає, натомість згадує самого користувача.
  - <code>{mention}</code>: Згадує користувача за його ім'ям.
  - <code>{id}</code>: ID користувача.
  - <code>{chatname}</code>: Назва чату.
  - <code>{rules}</code>: Додає до повідомлення кнопку правил.
  - <code>{protect}</code>: Забороняє пересилати вміст повідомлення.
  - <code>{preview}</code>: Вмикає попередній перегляд посилань у повідомленнях.
  - <code>{nonotif}</code>: Вимикає сповіщення для цього повідомлення.
formatting_help_msg: "Fuku підтримує багато варіантів форматування, щоб ваші повідомлення були виразнішими. Перегляньте їх, натиснувши кнопки нижче!"
formatting_markdown: |
  <b>Форматування Markdown</b>

  Ви можете форматувати повідомлення за допомогою <b>жирного</b>, <i>курсиву</i>, <u>підкреслення</u> та багато чого іншого. Сміливо експериментуйте!

  <b>Підтримуваний markdown</b>:

  - <code>`code words`</code>: Зворотні апострофи позначають моноширинний шрифт. Виглядає так: <code>code words</code>.

  - <code>_italic words_</code>: Підкреслення позначають курсив. Виглядає так: <i>italic words</i>.

  - <code>*bold words*</code>: Зірочки позначають жирний шрифт. Виглядає так: <b>bold words</b>.

  - <code>~strikethrough~</code>: Тильди позначають закреслений текст. Виглядає так: <strike>закреслений</strike>.

  - <code>||spoiler||</code>: Подвійні вертикальні риски позначають спойлер. Виглядає так: <tg-spoiler>Спойлер</tg-spoiler>.

  - <code>```pre```</code>: Щоб форматувальник ігнорував інші символи форматування всередині тексту, обрамленого '```', буде так: <code>**bold** | *bold*</code>.

  - <code>__underline__</code>: Подвійні підкреслення позначають підкреслений текст. Виглядає так: підкреслений. ПРИМІТКА: деякі клієнти намагаються бути розумними й сприймають це як курсив. У такому разі скористайтеся вбудованим форматуванням вашого застосунку.

  - <code>[hyperlink](example.com)</code>: Так форматуються гіперпосилання. Виглядає так: <a href='https://example.com/'>гіперпосилання</a>.

  - <code>[My Button](buttonurl://example.com)</code>: Так форматуються кнопки. Цей приклад створить кнопку "My Button", яка відкриває <code>example.com</code> після натискання.

  Якщо хочете розмістити кнопки в одному рядку, скористайтеся форматуванням <code>:same</code>.

  <b>Приклад:</b>

  <code>[button 1](buttonurl:example.com)</code>

  <code>[button 2](buttonurl://example.com:same)</code>

  <code>[button 3](buttonurl://example.com)</code>

  Кнопки 1 і 2 буде показано в одному рядку, а кнопку 3 — під ними.
formatting_random: |
  <b>Випадковий вміст</b>

  Ще одна цікава можливість — випадковий вміст повідомлення. Зробіть повідомлення трохи особистішими, змінюючи привітання або нотатки!

  Як користуватися випадковим вмістом:

  - %%%: Цей роздільник дозволяє додати боту випадкові відповіді.

  Наприклад:

  <code>привіт

  %%%

  як справи</code>

  Бот випадково обере, що надіслати: перше повідомлення, "привіт", чи друге, "як справи".

  Це допоможе зробити Fuku більш індивідуальним! (працює лише у фільтрах і нотатках)

  Приклад привітання:

  - Щоразу, коли приєднується новий користувач, йому показуватиметься одне з трьох наведених тут повідомлень.

  -> /filter "hey"

  привіт, <code>{first}</code>!

  %%%

  Оооо, <code>{first}</code>, як справи?

  %%%

  Як ти? <code>{first}</code>
greetings_help_msg: |-
  Вітайте нових учасників у своїх групах або прощайтеся з ними, коли вони йдуть!

  *Команди адміністратора:*
  × /setwelcome `<reply/text>`: Встановити текст привітання для групи.
  × /welcome `<yes/no/on/off>`: Увімкнути або вимкнути привітання для групи.
  × /resetwelcome: Скинути привітання до стандартного.
  × /setgoodbye `<reply/text>`: Встановити текст прощання для групи.
  × /goodbye `<yes/no/on/off>`: Увімкнути або вимкнути прощання для групи.
  × /resetgoodbye: Скинути прощання до стандартного.
  × /cleanservice `<yes/no/on/off>`: Видаляти всі службові повідомлення, як-от сповіщення «x приєднався до групи».
  × /cleanwelcome `<yes/no/on/off>`: Видаляти попереднє привітання щоразу, коли приєднується новий учасник.
  × /autoapprove `<yes/no/on/off>`: Автоматично затверджувати всіх нових учасників.
help_about: |-
  @%s  — один із найшвидших і найфункціональніших менеджерів груп.

  Fuku ✨ розробляється й активно підтримується @DivideProjects!

  Fuku працює з 2020 року й обслуговує тисячі груп із сотнями тисяч користувачів!

  <b>Чому Fuku:</b>
  - Простий: легкий у використанні та сумісний із багатьма командами ботів.
  - Функціональний: багато можливостей, яких немає в інших ботів для керування групами.
  - Швидкий: а знаєте що? Він написаний не на Python, а на <a href='https://go.dev/'>Go</a> як основній мові програмування.

  <b>Поточна версія:</b> %s
help_configuration_step-1: |-
  Ласкаво просимо до налаштування Fuku

  Спершу додайте Fuku ✨ до своєї групи! Для цього натисніть кнопку нижче, виберіть групу, а потім натисніть «Готово», щоб продовжити.
help_configuration_step-2: |-
  Чудово, молодець!

  Тепер, щоб я працював правильно, зробіть мене адміністратором групи!
  Для цього виконайте прості кроки:
  ▫️ Перейдіть до своєї групи
  ▫️ Натисніть назву групи
  ▫️ Натисніть «Змінити»
  ▫️ Натисніть «Адміністратори»
  ▫️ Натисніть «Додати адміністратора»
  ▫️ Натисніть лупу
  ▫️ Знайдіть @%s
  ▫️ Підтвердьте
help_configuration_step-3: |-
  Чудово!

  Тепер бот готовий до роботи!
  Усі команди можна використовувати з / або !

  Якщо виникнуть труднощі з налаштуванням мене у вашій групі, не вагайтеся звертатися до @DivideSupport.
  Ми будемо раді допомогти.
help_donatetext: |-
  Хочете підтримати мене? Чудово!
  Усі кошти йдуть на мій розвиток, який робить мене швидким і чутливим.
  Можливо, ваш внесок допоможе додати мені одну-дві нові функції, які я не міг отримати через обмеження серверів.
  Усі кошти підуть на мої сервіси, як-от база даних, сховище та хостинг!
  Підтримати можна, звернувшись до мого власника тут: @DivideProjectsBot
lang_sample: "Українська"
language_flag: "🇺🇦"
language_name: "Українська"
help_help_msg: "Головна точка входу та навігація Fuku Robot.\n*Команди навігації:*\n× /start: показати вітальне повідомлення з навігаційним меню.\n× /help: показати меню допомоги зі списком модулів; /help <module> покаже деталі.\n× /about: показати інформацію про бота, версію та корисні посилання.\n× /donate: показати інформацію про підтримку проєкту."
languages_help_msg: "Не вдається змінити мову бота?\nЛегко змінити за допомогою цього модуля!\n\nПросто введіть /lang і за допомогою inline-клавіатури оберіть мову для себе або для групи.\n\nВи можете допомогти нам додати більше мов, долучившись до [Crowdin](https://crowdin.com/project/fuku_robot)"
locks_help_msg: "*Лише для адмінів*:\n× /lock `<permission>`: заблокувати дозвіл чату.\n× /unlock `<permission>`: розблокувати дозвіл чату.\n× /locks: переглянути дозволи чату.\n× /locktypes: переглянути доступні типи блокувань!\n\nБлокування дозволяють обмежити користувачів групи.\nБлокування URL автоматично видаляє всі повідомлення з посиланнями, блокування стікерів видаляє всі стікери тощо.\nБлокування ботів не дозволить не-адмінам додавати ботів до чату.\n\n**Приклад:**\n`/lock media`: блокує всі медіаповідомлення в чаті."
misc_help_msg: "× /info: отримати інформацію про себе; можна відповісти на повідомлення або вказати ID чи юзернейм користувача.\n× /id: отримати ID поточної групи. Якщо використати у відповіді на повідомлення, покаже ID цього користувача.\n× /ping: пінг сервера Telegram!\n× /tr <lang code> <msg/reply to message>: перекласти повідомлення.\n× /removebotkeyboard: прибирає застряглу клавіатуру бота з вашого чату.\n× /stat: показує загальну кількість повідомлень у чаті.\n× /stickerid: дайте відповідь на стікер, щоб отримати його file ID.\n× /zombies: вилучити видалені акаунти, відомі боту (адмін).\n× /github <user|user/repo>: знайти користувача або репозиторій GitHub.\n× /wiki <search>: пошук в англійській Вікіпедії.\n× /ud <term>: пошук в Urban Dictionary.\n× /runs: випадкова примітка."
mutes_help_msg: "Іноді користувачі можуть набридати, і ви можете захотіти заборонити їм писати в чат. Цей модуль допоможе: ним можна заглушувати учасників вашої групи.\n\n*Команди заглушення:* (лише для адмінів)\n× /mute <userhandle>: заглушити користувача (за юзернеймом або у відповіді)\n× /smute <userhandle>: тихо заглушити користувача, без повідомлення в групі, а також видаляє вашу команду. (за юзернеймом або у відповіді)\n× /dmute <userhandle>: заглушити користувача та видалити повідомлення, на яке ви відповіли. (за юзернеймом або у відповіді)\n× /tmute <userhandle> x(m/h/d): заглушити користувача на час `x`. (за юзернеймом або у відповіді). m = хвилини, h = години, d = дні.\n× /unmute <userhandle>: зняти заглушення з користувача. (за юзернеймом або у відповіді)"
notes_help_msg: "Зберігайте дані для майбутніх користувачів у нотатках!\nНотатки чудово підходять для збереження будь-яких дрібниць: номера телефону, гарного гіфа, кумедної картинки - чого завгодно!\n*Команди для користувачів:*\n- /get <notename>: отримати нотатку.\n- #notename: те саме, що /get.\nКоманди для адмінів:\n- /save <notename> <note text>: зберегти нову нотатку з назвою \"word\". Якщо відповісти на повідомлення, буде збережено його. Працює навіть з медіа!\n- /clear <notename>: видалити відповідну нотатку.\n- /notes: показати всі нотатки в поточному чаті.\n- /saved: те саме, що /notes.\n- /clearall: видалити ВСІ нотатки в чаті. Це не можна скасувати.\n- /privatenotes: чи надсилати нотатки в особисті повідомлення. Надішле повідомлення з кнопкою, натиснувши яку користувачі отримають нотатку в особисті."
pins_help_msg: "Тут зібрано всі команди, пов'язані із закріпленням; тримайте чат в курсі останніх новин за допомогою простого закріпленого повідомлення!\n\n*Команди для користувачів:*\n× /pinned: показати поточне закріплене повідомлення.\n\n*Команди для адмінів:*\n× /pin: закріпити повідомлення, на яке ви відповіли. Додайте 'loud' або 'notify', щоб надіслати сповіщення учасникам групи.\n× /pinned: показує останнє закріплене повідомлення в поточному чаті.\n× /permapin <text>: закріпити власне повідомлення через бота. Воно може містити markdown, кнопки та інші чудові можливості.\n× /unpin: відкріпити поточне закріплене повідомлення. Якщо використано у відповіді, відкріплює повідомлення, на яке відповіли.\n× /unpinall: відкріплює всі закріплені повідомлення.\n× /antichannelpin <yes/no/on/off>: не дозволяти Telegram автоматично закріплювати повідомлення пов'язаних каналів. Без аргументів показує поточне налаштування.\n× /cleanlinked <yes/no/on/off>: видаляти повідомлення, надіслані пов'язаним каналом.\nПримітка: при використанні антизакріплення з каналу відкріплюйте повідомлення командою /unpin, а не вручну. Інакше старе повідомлення буде закріплено знову, щойно канал надішле будь-яке повідомлення."
purges_help_msg: "*Лише для адмінів:*\n- /purge: видаляє всі повідомлення між цим і повідомленням, на яке ви відповіли.\n- /del: видаляє повідомлення, на яке ви відповіли.\n\n*Приклади*:\n- Видалити всі повідомлення від того, на яке ви відповіли, і до цього моменту.\n-> `/purge`"
reports_help_msg: "Ми всі зайняті люди й не маємо часу стежити за своїми групами цілодобово. Але як реагувати, якщо хтось у групі розсилає спам?\n\n× /report `<reason>`: дайте відповідь на повідомлення, щоб поскаржитися на нього адмінам.\n- @admin: те саме, що /report, але не команда.\n\n*Лише для адмінів:*\n× /reports `<on/off/yes/no>`: змінити налаштування скарг або переглянути поточний стан.\n- Якщо в особистих повідомленнях, перемикає ваш статус.\n- Якщо в групі, перемикає статус цієї групи.\n× /reports `block` (лише у відповіді): заборонити користувачу використовувати /report або @admin.\n× /reports `unblock` (лише у відповіді): дозволити користувачу знову використовувати /report або @admin.\n× /reports `showblocklist`: переглянути всіх заблокованих користувачів, які не можуть використовувати /report або @admin.\n\nЩоб поскаржитися на користувача, просто дайте відповідь на його повідомлення з @admin або /report; Fuku відповість, що адмінів сповіщено.\nВи МАЄТЕ відповісти на повідомлення, щоб поскаржитися на користувача; не можна просто використати @admin, щоб кликати адмінів без причини!\n\n*ПРИМІТКА:* жодна з цих команд не спрацює, якщо їх використовують адміни."
rules_help_msg: "У кожному чаті діють різні правила; цей модуль допоможе зробити їх зрозумілішими!\n*Команди для користувачів*:\n× /rules: переглянути поточні правила чату.\n*Команди для адмінів*:\n× /setrules `<text>`: встановити правила для цього чату.\n× /privaterules `<yes/no/on/off>`: увімкнути/вимкнути надсилання правил в особисті повідомлення.\n× /resetrules: скинути правила чату до типових\n× /rulesbtn `<custom text>`: встановити текст кнопки правил.\n× /resetrulesbutton: скинути текст кнопки правил до типового.\n× /resetrulesbtn: те саме, що вище."
bot_updates_creators_plug: "\nПідписуйтесь на @DivideProjects, щоб дізнаватися про більше корисних ботів від моїх творців."
utils_string_handling_extract_time_invalid_time_amount: "Вказано некоректну кількість часу."
utils_string_handling_extract_time_invalid_time_type: "Вказано некоректний тип часу. Очікувалося m, h або d, отримано: %s"
warns_help_msg: "Тримайте учасників у межах за допомогою попереджень; не давайте їм вийти з-під контролю!\nЯкщо вам потрібні автоматичні попередження, прочитайте про модуль чорного списку!\n\n*Команди для адмінів:*\n- /warn <reason>: попередити користувача.\n- /dwarn <reason>: попередити користувача у відповіді та видалити його повідомлення.\n- /swarn <reason>: тихо попередити користувача та видалити ваше повідомлення.\n- /warns: переглянути попередження користувача.\n- /rmwarn: зняти останнє попередження користувача.\n- /resetwarn: скинути всі попередження користувача до 0.\n- /resetallwarns: видалити всі попередження в чаті. Усі користувачі повертаються до 0 попереджень.\n- /warnings: переглянути налаштування попереджень чату.\n- /setwarnmode <ban/kick/mute>: встановити режим покарання за попередження в чаті.\n- /setwarnlimit <number>: встановити кількість попереджень до покарання користувачів.\n\n*Приклади*\n- Попередити користувача.\n-> `/warn @user For disobeying the rules`"
users_help_msg: "Автоматичний фоновий трекер користувачів і чатів. Цей модуль не має команд для користувачів — він непомітно записує кожного відправника повідомлень і кожен чат, де активний бот.\n*Що відстежується:*\n× ID користувачів, юзернейми та відображувані імена кожного відправника повідомлень.\n× ID та назви чатів для кожної групи, у якій є бот.\n× ID, назви та юзернейми пов'язаних каналів.\n*Обмеження частоти:*\n× Оновлення користувачів виконуються не частіше ніж раз на UserUpdateInterval.\n× Оновлення чатів виконуються не частіше ніж раз на ChatUpdateInterval.\nІнші модулі, такі як /info, залежать від даних, зібраних цим модулем."
