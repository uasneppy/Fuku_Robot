# AntiRaid module strings
antiraid_help_msg: "<b>🛡 Антирейд</b>\n\nСтарий режим рейду вимкнено, тимчасових банів більше немає. Я сам блокую групу локдауном, коли починається рейд, а адміни можуть увімкнути його вручну.\n\n<b>Команди адмінів</b>\n• /autolockdown — показує або змінює автоматичні тригери: наплив учасників і потік повідомлень.\n• /lockdown і /unlockdown — вмикають локдаун групи вручну і знімають його.\n• /autoantiraid <code>N|off</code> — задає поріг напливу учасників (від 3 до 500 вступів за 60 секунд) і вмикає його або вимикає наплив.\n\n<b>Примітки</b>\n/antiraid, /raidtime і /raidactiontime тепер лише вказують сюди й нічого не змінюють. Старий автоматичний поріг групи став її порогом напливу учасників."

# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: "<b>🏛 Федерації</b>\n\nФедерація — це спільний список банів для груп, якими ви володієте. Один бан — усі об'єкти.\n\n<b>Команди власника федерації (у приватному чаті)</b>\n• /newfed <code>&lt;назва&gt;</code> — створює федерацію (одна на користувача).\n• /renamefed <code>&lt;назва&gt;</code> — перейменовує федерацію.\n• /delfed — видаляє федерацію після підтвердження.\n• /fedpromote і /feddemote — керують адмінами федерації.\n• /fedreason <code>on/off</code> — вимагає причину для fban.\n• /fednotif <code>on/off</code> — повідомляє власника про fban у приватному чаті.\n• /subfed, /unsubfed і /fedsubs — підписка на іншу федерацію (до 5).\n• /fbanlist <code>[csv|json|minicsv]</code> — експортує fban.\n• /importfbans — імпортує fban із CSV- чи JSON-файлу, на який ви відповіли.\n• /unsetfedlog — прибирає чат журналу федерації.\n\n<b>Чат журналу федерації</b>\n• /setfedlog — у групі робить цю групу журналом федерації; ви маєте бути там адміном.\n• Для каналу опублікуйте в ньому <code>/setfedlog &lt;fed_id&gt;</code> (я маю бути там адміном), потім протягом години перешліть цей допис мені в приватний чат або в групу з акаунта власника федерації.\n\n<b>Команди власника групи</b>\n• /joinfed <code>&lt;fed_id&gt;</code> — приєднує цю групу до федерації.\n• /leavefed — виводить групу з федерації.\n• /quietfed <code>on/off</code> — приховує пасивні сповіщення про fban.\n\n<b>Команди адмінів федерації</b>\n• /fban, /unfban і /funban — банять і розбанюють у федерації.\n• /fedstat і /fbanstat — показують fban користувача.\n\n<b>Команди для всіх</b>\n• /fedinfo, /fedadmins, /chatfed і /myfeds — показують відомості про федерації."
logchannels_help_msg: "<b>🧾 Канал журналу</b>\n\nНадсилайте дії адмінів в окремий канал журналу. Кожен об'єкт веде записи.\n\n<b>Як підключити</b>\n• Додайте мене в канал як адміна.\n• У цьому каналі надішліть /setlog.\n• Перешліть це повідомлення в групу.\n\n<b>Команди адмінів</b>\n• /unsetlog — прибирає канал журналу.\n• /logchannel — показує поточний канал журналу.\n• /logcategories — перелічує категорії.\n• /log <code>&lt;категорія&gt;</code> — вмикає категорію.\n• /nolog <code>&lt;категорія&gt;</code> — вимикає категорію.\n\n<b>Примітки</b>\nКатегорії: <code>settings</code>, <code>admin</code>, <code>user</code>, <code>reports</code>."
