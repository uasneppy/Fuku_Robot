settings_mreq_desc_lastname: "Учасник без прізвища порушує це правило."
settings_mreq_desc_username: "Учасник без @username порушує це правило."
settings_mreq_desc_russian: "Ім'я або прізвище з ы, ъ, э чи ё порушує це правило. Білоруська і болгарська використовують частину цих літер, тож такі імена теж можуть підпасти під правило."
settings_mreq_desc_arabic: "Ім'я або прізвище з будь-якою арабською літерою порушує це правило. Перська, урду й інші мови мають те саме письмо, тож такі імена теж підпадають під правило."
settings_mreq_desc_chinese: "Ім'я або прізвище з будь-яким китайським ієрогліфом порушує це правило. Японські імена, записані кандзі, мають ті самі знаки, тож вони теж підпадають під правило."
settings_mreq_desc_photo: "Учасник без видимого мені фото профілю порушує це правило. Фото, приховане налаштуваннями приватності, вважається відсутнім. Учасник може показати його всім, або адмін може схвалити учасника."
settings_mreq_desc_channel: "Учасник, не підписаний на пов'язаний канал цієї групи, порушує це правило. Перевірити це я можу лише як адміністратор того каналу."
settings_mreq_desc_ai: "Ім'я, яке Claude вважає спамом, наприклад рекламу чи шахрайство, порушує це правило. Нових учасників я перевіряю при вступі або першому повідомленні, а будь-якого учасника — після зміни імені. Тих, хто вже в групі, я перевіряю лише після зміни імені."
settings_mreq_now: "Покарання: {action}"
settings_mreq_choose_hint: "Вимк. і Попередження діють одразу. Вигнання, Бан і Мут спершу просять підтвердження."
settings_mreq_actions_hint: "Попередження враховується в ліміті попереджень групи. Вигнання дозволяє повернутися. Бан не пускає, доки адмін не розбанить. Мут триває, доки учасник не виправить вказане й не натисне «Виправлено»."
settings_mreq_confirm: "Змінити «{rule}» на {action}?"
settings_mreq_confirm_kick: "Кожного учасника, який порушує це правило, буде вигнано при наступному повідомленні, зокрема тих, хто вже в групі. Повернутися можна після виправлення."
settings_mreq_confirm_ban: "Кожного учасника, який порушує це правило, буде забанено при наступному повідомленні, зокрема тих, хто вже в групі. Розбанити може лише адмін."
settings_mreq_confirm_mute: "Кожного учасника, який порушує це правило, буде видано мут при наступному повідомленні, зокрема тих, хто вже в групі. Щоб звільнитися, учасник отримає кнопку «Виправлено»."
settings_mreq_confirm_ai_kick: "Учасника, чиє ім'я визнано спамом, буде вигнано при вступі, при першому повідомленні або після зміни імені. Тих, хто вже в групі, перевіряють лише після зміни. Повернутися можна після виправлення."
settings_mreq_confirm_ai_ban: "Учасника, чиє ім'я визнано спамом, буде забанено при вступі, при першому повідомленні або після зміни імені. Тих, хто вже в групі, перевіряють лише після зміни. Розбанити може лише адмін."
settings_mreq_confirm_ai_mute: "Учасника, чиє ім'я визнано спамом, буде видано мут при вступі, при першому повідомленні або після зміни імені. Тих, хто вже в групі, перевіряють лише після зміни. Щоб звільнитися, учасник отримає кнопку «Виправлено»."
settings_mreq_here_basic: "Це звичайна група, а вимоги перевіряють лише в супергрупах, тож тут нікого не перевіряють."
settings_mreq_here_nolink: "{rule}: пов'язаного каналу цієї групи не знайдено, тож нікого не перевіряють."
