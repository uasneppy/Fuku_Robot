# Backup/Restore module strings
backup_help_msg: "<b>📦 Резервні копії</b>\n\nЗберігайте й відновлюйте налаштування групи. Документація об'єкта: збережена й доступна.\n\n<b>Команди адмінів</b>\n• /export — експортує всі налаштування групи в JSON-файл.\n• /export <code>notes filters rules</code> — експортує лише вказані модулі.\n\n<b>Команди власника</b>\n• /import — у відповідь на файл копії відновлює налаштування.\n• /import <code>notes filters</code> — імпортує лише вказані модулі.\n• /reset — скидає всі налаштування до стандартних.\n• /reset <code>warnings locks</code> — скидає лише вказані модулі.\n\n<b>Примітки</b>\nЕкспорт — раз на 5 хвилин, імпорт — раз на 10 хвилин, скидання — раз на годину."

