antiflood_help_msg: "<b>🌊 Антифлуд</b>\n\nХтось заходить, надсилає 100 повідомлень і руйнує чат. З антифлудом на цьому все й закінчується: я дію проти того, хто надсилає забагато повідомлень поспіль.\n\n<b>Команди адмінів</b>\n• /flood — показує налаштування антифлуду.\n• /setflood <code>&lt;число/off/no&gt;</code> — задає, після скількох повідомлень поспіль діяти; <code>0</code>, <code>off</code> або <code>no</code> вимикають антифлуд.\n• /setfloodmode <code>&lt;дія&gt;</code> — задає дію проти флудера: <code>ban</code>, <code>kick</code> або <code>mute</code>.\n• /delflood <code>&lt;yes/no/on/off&gt;</code> — вмикає або вимикає видалення флуд-повідомлень.\n\n<b>Приклад</b>\n<code>/setflood 5</code> — діяти після п'яти повідомлень поспіль."
