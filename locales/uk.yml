antiflood_help_msg: "Знаєте, як іноді люди приходять, надсилають 100 повідомлень і руйнують ваш чат? З антифлудом цього більше не станеться!\n\n\nАнтифлуд дозволяє вживати заходів щодо користувачів, які надсилають понад x повідомлень поспіль. Дії: ban/kick/mute\n\n\n*Команди для адмінів*:\n\n× /flood: показати поточні налаштування антифлуду.\n\n× /setflood `<number/off/no>`: встановити кількість повідомлень, після якої вживаються заходи щодо користувача. Значення '0', 'off' або 'no' вимикає.\n\n× /setfloodmode `<action type>`: вибрати дію щодо користувача, який флудить. Варіанти: ban/kick/mute\n\n× /delflood `<yes/no/on/off>`: чи видаляти повідомлення, надіслані флудером."
