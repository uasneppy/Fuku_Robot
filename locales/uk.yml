lockdown_help_msg: |
  Локдаун зупиняє рейд у цій групі: усіх, окрім адмінів, буде заглушено, доки адмін не зніме його.

  × <code>/lockdown [reason]</code>: Негайно заблокувати групу без підтвердження. Писати можуть лише адміни, навіть затверджені користувачі не можуть, а нових учасників вилучатимуть до зняття локдауну.
  × <code>/unlockdown</code>: Зняти локдаун. Усі дозволи повертаються точно такими, якими були до локдауну, а вилучених мною людей розблоковують, окрім акаунтів, заблокованих назавжди через «Заблокувати нових учасників».
  × <code>/lockdownstatus</code>: Показати, чи група під локдауном, з якого часу, ким і чому (будь-який адмін).
  × <code>/autolockdown [joins|flood|ai] [N|on|off]</code>: Показати або змінити автоматичні тригери. Переглядати може будь-який адмін; змінювати лише власник групи або адмін із правом обмежувати учасників. Число від 3 до 500 задає поріг і вмикає тригер.

  Ці команди доступні лише власнику групи або адміну з правом обмежувати учасників, і я перевіряю це наживо. Я маю бути адміном із правом обмежувати учасників, а група має бути супергрупою.
  Локдаун ніколи не закінчується сам. Він триває, доки адмін не зніме його.
  Бани, які я даю тим, хто приєднався, діють 330 днів від приєднання. Якщо локдаун триває довше, ці бани спливають самі, і люди можуть повернутися; підсумок зняття показує, скільки їх.
  Анонімних адмінів спершу просять підтвердити особу.
  Запити на вступ відхиляються, поки триває локдаун; після зняття їх можна подати знову.

  Коли групу заблоковано, я надсилаю сповіщення до її Staff-групи (якщо вона зв'язана) і до її каналу логів (якщо категорію логів адміна ввімкнено): тригер, скільки людей приєдналося безпосередньо перед цим і відтоді, до 10 таких акаунтів і запрошувальне посилання, яким скористалася більшість із них.

  Я також сам блокую цю групу, коли починається рейд: коли 15 людей приєднується за 60 секунд (наплив приєднань) або коли за 30 секунд надходить 30 повідомлень, фото, GIF чи стікерів, щонайменше 60% із них від щонайменше 3 учасників, що приєдналися за останні 24 години (флуд). Це числа за замовчуванням; <code>/autolockdown</code> показує числа саме цієї групи. Обидва тригери ввімкнені за замовчуванням. Адміни, затверджені користувачі та команди, які я обробляю, ніколи не враховуються, тож затвердження довірених новачків виводить їх із підрахунку. Коли я блокую групу, то публікую коротке повідомлення, а сповіщення вказує, який тригер спрацював. Протягом 10 хвилин після зняття я сам знову не блокую. Якщо я бачу рейд, але не можу заблокувати (я маю бути адміном із правом обмежувати учасників у супергрупі), то попереджаю Staff-групу та канал логів, не частіше одного разу на добу. Ці налаштування не зберігаються в резервних копіях.

  Тригер ШІ: підозрілий текст від учасників, що приєдналися за останні 24 години, перевіряє TypeSafe, а їхні фото, GIF і стікери перевіряє Anthropic Claude (якщо налаштовано). 5 вердиктів «спам» від 3 акаунтів протягом 120 с блокують групу; один вердикт ніколи не блокує, а ШІ ніколи не видаляє й не банить.

  🔓 Зняти локдаун: знімає локдаун, як <code>/unlockdown</code>. Лише власник групи або адмін із правом обмежувати учасників, перевіряється наживо; бути в Staff-групі недостатньо.

  🚫 Заблокувати нових учасників: назавжди блокує акаунти сплеску, щоб вони не могли повернутися, і я не можу це скасувати. Адмінів, затверджених користувачів і тих, кого впустив адмін, не чіпають. Наступне натискання блокує лише нові акаунти. Лише власник групи або адмін із правом обмежувати учасників, перевіряється наживо.

  ⛔ Відкликати посилання: відкликає запрошувальне посилання, яким скористався рейд, якщо його створив я; посилання інших адмінів треба відкликати в Telegram. Лише власник групи або адмін із правом запрошувати користувачів. Для одного локдауну пропонується одне відкликання; якщо рейд перейде на інше моє посилання, відкличте його в налаштуваннях групи в Telegram.

  Кожна кнопка просить підтвердження від того, хто її натиснув. Натискайте від свого імені, не як анонімний адмін чи канал. Поки група заблокована, я щогодини нагадую про це; після зняття нагадування припиняються.
