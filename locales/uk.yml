# Reactions module strings
reactions_help_msg: |
  <b>🎭 Автореакції</b>

  Автоматично реагуйте на повідомлення за ключовими словами!

  Налаштуйте автоматичні емодзі-реакції, які спрацьовують, коли користувачі надсилають певні слова.

  <b>Команди для адмінів:</b>
  • /addreaction <keyword> <emoji> - додати автореакцію
  • /removereaction <keyword> - видалити реакцію
  • /reactions - список налаштованих реакцій
  • /resetreactions - очистити всі реакції

  <b>Приклад:</b>
  • /addreaction hello 👋 - бот реагує 👋, коли хтось пише «hello»

