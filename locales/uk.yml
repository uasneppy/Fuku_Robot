warns_help_msg: "Попередження про порушення тримають мешканців у рамках, поки все не вийшло з-під контролю.\nПро автоматичні попередження читайте в модулі чорного списку.\n\n*Команди адмінів:*\n- /warn <reason>: Попередити користувача.\n- /dwarn <reason>: Попередити у відповідь на повідомлення і видалити його.\n- /swarn <reason>: Тихо попередити користувача і видалити вашу команду.\n- /warns: Переглянути попередження користувача.\n- /rmwarn: Зняти останнє попередження користувача.\n- /resetwarn: Скинути всі попередження користувача до 0.\n- /resetallwarns: Видалити всі попередження в чаті. У всіх стає 0.\n- /warnings: Налаштування попереджень чату.\n- /setwarnmode <ban/kick/mute>: Задати дію за попередження.\n- /setwarnlimit <number>: Скільки попереджень до покарання.\n\n*Приклади*\n- Попередити користувача.\n-> `/warn @user For disobeying the rules`"
users_help_msg: "Реєстр мешканців. Автоматичний фоновий облік користувачів і чатів. Команд у модуля немає: він тихо записує кожного відправника повідомлень і кожен чат, де працює бот.\n*Що записується:*\n× ID, юзернейми та імена кожного відправника повідомлень.\n× ID і назви кожної групи, де є бот.\n× ID, назви та юзернейми пов'язаних каналів.\n*Обмеження частоти:*\n× Оновлення користувачів — не частіше одного за UserUpdateInterval.\n× Оновлення чатів — не частіше одного за ChatUpdateInterval.\nІнші модулі, як-от /info, залежать від даних цього модуля."
