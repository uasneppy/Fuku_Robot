settings_help_msg: |
  Керуйте цією групою з одного меню кнопок.

  <b>Команди адмінів</b>:
  × /settings: Відкрити меню налаштувань. У групі воно відкривається тут або в приватному чаті; у приватному чаті зі мною показує групи, якими ви можете керувати.

  Меню охоплює зв'язок зі Staff-групою, локдаун (стан, зняття й автоматичні тригери), капчу, антифлуд, вимоги до учасників і повідомлення привітання, прощання та правил: задайте будь-яке, надіславши його мені в приватному чаті. Кожна зміна в ньому дорівнює відповідній команді: /linkstaff, /unlinkstaff, /unlockdown, /autolockdown, /captcha, /captchamode, /captchatime, /captchaaction, /setflood, /setfloodmode, /delflood, /setwelcome, /setgoodbye і /setrules. Для вимог до учасників немає команди: налаштувати їх можна лише в меню.

  Відкрити меню може лише власник групи, якщо він не пустив адмінів. Самі команди налаштувань працюють для адмінів як раніше. Меню, відкрите в групі, відповідає лише тому, хто його відкрив. Кожне натискання перевіряє, що вам усе ще можна, а кожна зміна потребує щонайменше того права, що потрібне її команді.
