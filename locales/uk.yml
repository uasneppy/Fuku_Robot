bans_help_msg: "Іноді користувачі набридають, і ви можете захотіти вилучити їх із чату — цей модуль саме для цього!\n\nБлокуйте/вилучайте користувачів із чату та розблоковуйте їх пізніше, якщо вони поводитимуться добре.\n\n\n*Команди для користувачів:*\n\n× /kickme: вилучає користувача, який виконав команду.\n\n× /banme: блокує користувача, який виконав команду.\n\n\n*Команди блокування* (лише для адмінів):\n\n× /ban <userhandle>: блокує користувача (через згадку або відповідь).\n\n× /sban <userhandle>: блокує користувача тихо, не надсилає повідомлення в групу та видаляє вашу команду (через згадку або відповідь).\n\n× /skick <userhandle>: тихо вилучає користувача та видаляє вашу команду.\n\n× /dban <userhandle>: блокує користувача та видаляє повідомлення, на яке відповіли (через згадку або відповідь).\n\n× /tban <userhandle> x(m/h/d): блокує користувача на час `x` (через згадку або відповідь). m = хвилини, h = години, d = дні.\n\n× /unban <userhandle>: розблоковує користувача (через згадку або відповідь).\n\n× /unbanall: підтвердження лише для власника, щоб розблокувати відомих користувачів.\n\n\n*Команди обмеження:* (лише для адмінів)\n\n× /restrict: показує InlineKeyboard для вибору: вилучити, заблокувати або заглушити\n\n× /unrestrict: показує InlineKeyboard для вибору: зняти заглушення або розблокувати."
