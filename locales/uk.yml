settings_mreq_confirm_kick: "Кожного учасника, який порушує це правило, буде вилучено при наступному повідомленні, зокрема тих, хто вже в групі. Він зможе повернутися, коли виправить."
settings_mreq_confirm_ban: "Кожного учасника, який порушує це правило, буде забанено при наступному повідомленні, зокрема тих, хто вже в групі. Розбанити може лише адмін."
settings_mreq_confirm_mute: "Кожного учасника, який порушує це правило, буде заглушено при наступному повідомленні, зокрема тих, хто вже в групі. У нього буде кнопка «Виправлено», щоб звільнитися."
settings_mreq_confirm_ai_kick: "Учасника, чиє ім'я визнано спамом, буде вилучено при вступі або при першому повідомленні, або після зміни імені. Тих, хто вже в групі, перевіряють лише після зміни. Він зможе повернутися, коли виправить."
settings_mreq_confirm_ai_ban: "Учасника, чиє ім'я визнано спамом, буде забанено при вступі або при першому повідомленні, або після зміни імені. Тих, хто вже в групі, перевіряють лише після зміни. Розбанити може лише адмін."
settings_mreq_confirm_ai_mute: "Учасника, чиє ім'я визнано спамом, буде заглушено при вступі або при першому повідомленні, або після зміни імені. Тих, хто вже в групі, перевіряють лише після зміни. У нього буде кнопка «Виправлено», щоб звільнитися."
