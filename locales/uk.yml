captcha_help_msg: "Контроль доступу на об'єкт. Захистіть групу від ботів і спамерів перевіркою CAPTCHA.\n\nНові учасники доводять, що вони люди, розв'язавши просте завдання, перш ніж зможуть писати.\n\n*Типи капчі:*\n× Math: Простий арифметичний приклад\n× Text: Розпізнати текст на зображенні\n× Turnstile: Перевірка Cloudflare на вебсторінці\n\n*Команди адмінів:*\n× /captcha `<on/off>`: Увімкнути або вимкнути капчу\n× /captchamode `<math/text/turnstile>`: Задати тип капчі\n× /captchatime `<1-10>`: Час на проходження в хвилинах (стандартно: 2)\n× /captchaaction `<kick/ban/mute>`: Дія, якщо перевірку не пройдено (стандартно: kick)\n× /captchaattempts `<1-10>`: Максимум спроб (стандартно: 3)\n\nКоли капчу увімкнено, нових учасників мутять, доки вони не пройдуть перевірку.\nЯкщо не пройдуть або час вийде, застосовується налаштована дія."
