lockdown_help_msg: "<b>🔒 Локдаун</b>\n\nЛокдаун зупиняє рейд у цій групі: усі, окрім адмінів, не можуть писати, доки адмін не зніме його. Сам він ніколи не закінчується.\n\n<b>Команди адмінів</b>\n• <code>/lockdown [причина]</code> — негайно блокує групу без підтвердження. Писати можуть лише адміни, навіть схвалені учасники ні, а нових учасників вилучають до зняття.\n• /unlockdown — знімає локдаун. Усі дозволи повертаються точно такими, якими були, а вилучених мною людей розбанюють, окрім акаунтів, забанених назавжди через «Забанити нових учасників».\n• /lockdownstatus — показує, чи група під локдауном, з якого часу, ким і чому. Доступно будь-якому адміну.\n• <code>/autolockdown [joins|flood|ai] [N|on|off]</code> — показує або змінює автоматичні тригери. Переглядати може будь-який адмін, змінювати — лише власник групи або адмін із правом обмежувати учасників. Число від 3 до 500 задає поріг і вмикає тригер.\n\n<b>Автоматичний локдаун</b>\nЯ блокую групу сам, коли починається рейд:\n• наплив вступів — 15 людей вступає за 60 секунд;\n• флуд — за 30 секунд надходить 30 повідомлень, фото, GIF чи стікерів, щонайменше 60% із них від щонайменше 3 учасників, що вступили за останні 24 години;\n• ШІ — підозрілий текст тих, хто вступив за останні 24 години, перевіряє TypeSafe, а їхні фото, GIF, стікери й обкладинки відео — Anthropic Claude (якщо налаштовано). Коли увімкнено /aispam, рахується й кожне видалене ним повідомлення будь-якого учасника. 5 вердиктів «спам» від 3 акаунтів за 120 с блокують групу; один вердикт — ніколи.\nЦе числа за замовчуванням; <code>/autolockdown</code> показує числа цієї групи. Наплив і флуд увімкнені за замовчуванням. Адмінів, схвалених учасників і команди, які я обробляю, не враховують, тож схвалення довірених новачків виводить їх із підрахунку. Коли я блокую групу, то публікую коротке повідомлення, а сповіщення вказує, який тригер спрацював. 10 хвилин після зняття я не блокую групу сам. Якщо я бачу рейд, але не можу заблокувати, то попереджаю Staff-групу та канал журналу, не частіше одного разу на добу.\n\n<b>Кнопки сповіщення</b>\n• 🔓 Зняти локдаун — знімає локдаун, як /unlockdown.\n• 🚫 Забанити нових учасників — назавжди банить акаунти сплеску, щоб вони не повернулися; скасувати це я не можу. Адмінів, схвалених учасників і тих, кого впустив адмін, не чіпають. Наступне натискання банить лише нові акаунти.\n• ⛔ Відкликати посилання — відкликає посилання-запрошення рейду, якщо його створив я; посилання інших адмінів відкликайте в Telegram. Для одного локдауну — одне відкликання; якщо рейд перейде на інше моє посилання, відкличте його в налаштуваннях групи в Telegram.\nЗняти й банити може власник групи або адмін із правом обмежувати учасників, відкликати — адмін із правом запрошувати; я перевіряю це наживо, бути в Staff-групі недостатньо. Кожна кнопка просить підтвердження від того, хто її натиснув. Натискайте від свого імені, не як анонімний адмін чи канал.\n\n<b>Примітки</b>\n• Ці команди доступні лише власнику групи або адміну з правом обмежувати учасників, і я перевіряю це наживо. Анонімних адмінів спершу просять підтвердити особу.\n• Я маю бути адміном із правом обмежувати учасників, а група має бути супергрупою.\n• Бани, які я видаю тим, хто вступив, діють 330 днів від вступу. Якщо локдаун триває довше, ці бани спливають, і люди можуть повернутися; підсумок зняття показує, скільки їх.\n• Запити на вступ відхиляються, поки триває локдаун; після зняття їх можна подати знову.\n• Коли групу заблоковано, я надсилаю сповіщення до її Staff-групи (якщо її прив'язано) і до каналу журналу (якщо категорію admin увімкнено): тригер, скільки людей вступило перед цим і відтоді, до 10 таких акаунтів і посилання-запрошення, яким скористалася більшість. Поки група заблокована, я щогодини нагадую про це.\n\n<b>Приклад</b>\n<code>/lockdown хвиля спаму</code> — блокує групу з причиною «хвиля спаму»."
