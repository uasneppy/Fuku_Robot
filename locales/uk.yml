bans_help_msg: "<b>🔨 Бани</b>\n\nДеяким мешканцям доводиться покинути об'єкт. Цей модуль вилучає їх із чату й повертає, коли вони поводяться як слід.\n\n<b>Команди для всіх</b>\n• /kickme — вилучає вас із чату.\n• /banme — банить вас у чаті.\n\n<b>Команди адмінів</b>\n• /ban <code>&lt;користувач&gt;</code> — банить користувача.\n• /sban <code>&lt;користувач&gt;</code> — тихо банить користувача: без повідомлення в групі, вашу команду буде видалено.\n• /dban <code>&lt;користувач&gt;</code> — банить користувача й видаляє повідомлення, на яке ви відповіли.\n• /tban <code>&lt;користувач&gt; &lt;час&gt;</code> — банить на час: <code>30m</code>, <code>2h</code>, <code>7d</code>.\n• /skick <code>&lt;користувач&gt;</code> — тихо вилучає користувача й видаляє вашу команду.\n• /unban <code>&lt;користувач&gt;</code> — розбанює користувача.\n• /unbanall — розбанює всіх відомих користувачів після підтвердження власника.\n• /restrict — показує кнопки: вилучити, забанити або видати мут.\n• /unrestrict — показує кнопки: зняти мут або розбанити.\n\n<b>Примітки</b>\nВкажіть користувача через @username чи ID або відповідайте на його повідомлення. Час: <code>m</code> — хвилини, <code>h</code> — години, <code>d</code> — дні.\n\n<b>Приклад</b>\n<code>/tban @user 2h</code> — бан на дві години."
