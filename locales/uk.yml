connections_disconnect_disconnected: "Віддалений зв'язок закрито. Вас відключено від чату."
connections_disconnect_need_pm: "Щоб відключитися від чату, надішліть це мені в приватний чат."
connections_help_msg: "<b>🔗 Підключення</b>\n\nВіддалений доступ до об'єкта. Підключіться до групи з приватного чату зі мною й керуйте нею так, щоб група цього не бачила. Змінювати можуть лише адміни, а переглядати — будь-який учасник, окрім забанених і вилучених.\n\n<b>Команди для всіх</b>\n• /connect <code>&lt;ID чату&gt;</code> — підключає до вказаної групи, щоб переглядати чи змінювати її вміст.\n• /disconnect — відключає від поточної групи.\n• /reconnect — знову підключає до попередньої групи.\n• /connection — показує, до якої групи ви підключені.\n\n<b>Команди адмінів</b>\n• /allowconnect <code>&lt;yes/no&gt;</code> — дозволяє чи забороняє учасникам підключатися до групи.\n\n<b>Примітки</b>\nID групи показує команда /id у самій групі. Не дивуйтеся, якщо він від'ємний: у всіх супергруп від'ємні ID."
connections_is_user_connected_bot_not_admin: "Я не адмін у цьому чаті."
connections_is_user_connected_need_group: "Ця команда для груп, а не для приватного чату."
connections_is_user_connected_user_not_admin: "Доступ заборонено. Для цього потрібно бути адміном."
connections_not_connected: "Вас не підключено до жодного чату."
connections_stale_connection: "Підключення застаріло: я більше не маю доступу до цього чату. Скористайтеся /connect, щоб підключитися до дійсного чату."
connections_reconnect_need_pm: "Повторне підключення працює лише в приватному чаті зі мною."
connections_reconnect_no_last_chat: "Немає попереднього чату для повторного підключення."
connections_reconnect_reconnected: "Віддалений зв'язок із <b>%s</b> відновлено."
disabling_help_msg: "<b>🚫 Вимкнення</b>\n\nОбмеження команд. Вимкніть команду — і учасники, які не є адмінами, не зможуть нею користуватися. Їхні спроби я можу ще й видаляти, щоб чат не засмічували зайві команди.\n\n<b>Команди адмінів</b>\n• /disable <code>&lt;команда&gt;</code> — забороняє команду учасникам у цій групі.\n• /enable <code>&lt;команда&gt;</code> — знову дозволяє команду учасникам.\n• /disableable — перелічує команди, які можна вимкнути.\n• /disabledel <code>&lt;yes/no/on/off&gt;</code> — вмикає або вимикає видалення вимкнених команд, які надсилають учасники.\n• /disabled — перелічує вимкнені команди цього чату.\n\n<b>Примітки</b>\nВимкнена команда вимикається лише для учасників, які не є адмінами; адміни й далі можуть нею користуватися. Вимкнені команди доступні через /connect."
devs_help_msg: "<b>🛠 Розробники</b>\n\nСервісний доступ. Команди керування й діагностики лише для мого власника і довірених розробників. Звичайні користувачі їх не бачать.\n\n<b>Команди команди</b>\n• /stats — показує мою статистику й системні дані.\n• /teamusers — перелічує учасників команди.\n\n<b>Команди власника</b>\n• /addsudo — надає користувачу права sudo.\n• /adddev — надає користувачу права розробника.\n• /remsudo — забирає в користувача права sudo.\n• /remdev — забирає в користувача права розробника.\n\n<b>Діагностика</b>\n• /chatinfo — показує докладні відомості про чат.\n• /chatlist — створює й надсилає список усіх активних чатів.\n• /leavechat — наказує мені покинути вказаний чат."
filters_help_msg: "<b>🔁 Фільтри</b>\n\nФільтри — це автоматичні відповіді. Щоразу, коли хтось пише ваше слово-тригер, я відповідаю вашим текстом; регістр не має значення. Так можна створювати власні команди.\n\n<b>Команди для всіх</b>\n• /filters — перелічує всі фільтри чату.\n\n<b>Команди адмінів</b>\n• /filter <code>&lt;тригер&gt; &lt;відповідь&gt;</code> — щоразу, коли хтось пише тригер, я відповідаю цим текстом. Тригер із кількох слів беріть у лапки.\n• /stop <code>&lt;тригер&gt;</code> — вимикає відповідь на тригер.\n\n<b>Команди власника</b>\n• /stopall — вимикає ВСІ фільтри чату. Скасувати це не можна.\n\n<b>Примітки</b>\n• Щоб зберегти файл, зображення, gif чи інше вкладення, дайте відповідь на нього командою <code>/filter &lt;тригер&gt;</code>.\n• Фільтр, який спрацьовує лише для адмінів, має в тексті <code>{admin}</code>.\n\n<b>Приклад</b>\n<code>/filter \"hello friend\" Hello back! Long time no see!</code> — фільтр із двох слів."
formatting_fillings: "<b>Заповнювачі</b>\n\nПовідомлення можна доповнювати даними з контексту. Наприклад, згадати користувача на ім'я в привітанні чи у фільтрі.\nУ нотатках заповнювачі теж працюють.\n\n<b>Підтримувані заповнювачі:</b>\n- <code>{first}</code>: Ім'я користувача.\n- <code>{last}</code>: Прізвище користувача.\n- <code>{fullname}</code>: Повне ім'я користувача.\n- <code>{username}</code>: Юзернейм користувача. Якщо його немає — згадка користувача.\n- <code>{mention}</code>: Згадка користувача на ім'я.\n- <code>{id}</code>: ID користувача.\n- <code>{chatname}</code>: Назва чату.\n- <code>{rules}</code>: Додає до повідомлення кнопку правил.\n- <code>{protect}</code>: Забороняє пересилати вміст.\n- <code>{preview}</code>: Вмикає прев'ю в повідомленні.\n- <code>{nonotif}</code>: Вимикає сповіщення для цього повідомлення."
formatting_help_msg: "<b>✍️ Форматування</b>\n\nXenobot-72 підтримує чимало варіантів форматування, щоб ваші повідомлення були виразнішими. Натисніть кнопки нижче, щоб їх переглянути."
formatting_markdown: "<b>Форматування Markdown</b>\n\nПовідомлення можна оформлювати <b>жирним</b>, <i>курсивом</i>, <u>підкресленням</u> та іншим. Експериментуйте.\n\n<b>Що підтримується</b>\n• <code>&#96;code words&#96;</code> — зворотні апострофи дають моноширинний шрифт: <code>code words</code>.\n• <code>_italic words_</code> — підкреслення дають курсив: <i>italic words</i>.\n• <code>&#42;bold words&#42;</code> — зірочки дають жирний шрифт: <b>bold words</b>.\n• <code>~strikethrough~</code> — тильди дають закреслення: <s>strikethrough</s>.\n• <code>||spoiler||</code> — подвійні вертикальні риски дають спойлер: <tg-spoiler>Spoiler</tg-spoiler>.\n• <code>&#96;&#96;&#96;pre&#96;&#96;&#96;</code> — усередині такого блоку інші символи форматування не діють: <code>&#42;&#42;bold&#42;&#42; | &#42;bold&#42;</code>.\n• <code>__underline__</code> — подвійні підкреслення дають підкреслений текст: <u>underline</u>. Деякі клієнти показують це курсивом; тоді скористайтеся вбудованим форматуванням застосунку.\n• <code>[hyperlink](example.com)</code> — посилання: <a href='https://example.com/'>hyperlink</a>.\n• <code>[My Button](buttonurl://example.com)</code> — кнопка «My Button», яка відкриває <code>example.com</code>.\n\n<b>Примітки</b>\nЩоб поставити кнопки в один рядок, додайте <code>:same</code>.\n\n<b>Приклад</b>\n<code>[button 1](buttonurl:example.com)</code>\n<code>[button 2](buttonurl://example.com:same)</code>\n<code>[button 3](buttonurl://example.com)</code>\nКнопки 1 і 2 будуть в одному рядку, а 3 — під ними."
formatting_random: "<b>Випадковий вміст</b>\n\nВміст повідомлення можна ще й рандомізувати: фільтри й нотатки менше схожі на офіційне оголошення, коли вони змінюються. Працює лише у фільтрах і нотатках.\n\n<b>Як користуватися</b>\nРоздільник <code>%%%</code> ділить мою відповідь на варіанти, і я щоразу обираю один навмання. Наприклад, у тексті <code>hello %%% how are you</code> я оберу «hello» або «how are you».\n\n<b>Приклад</b>\n<code>/filter \"hey\"</code> з такою відповіддю дасть кожному, хто напише «hey», одне з трьох повідомлень:\n<code>hello there {first}!\n%%%\nOoooh, {first} how are you?\n%%%\nSup? {first}</code>"
greetings_help_msg: "<b>🎉 Привітання</b>\n\nПривітання і прощання оформлює об'єкт. Нові мешканці отримують вітання, ті, хто йде, — проводи.\n\n<b>Команди адмінів</b>\n• /setwelcome <code>&lt;текст&gt;</code> — задає привітання групи; можна у відповідь на повідомлення.\n• /welcome <code>&lt;yes/no/on/off&gt;</code> — вмикає або вимикає привітання.\n• /resetwelcome — повертає стандартне привітання.\n• /setgoodbye <code>&lt;текст&gt;</code> — задає прощання групи; можна у відповідь на повідомлення.\n• /goodbye <code>&lt;yes/no/on/off&gt;</code> — вмикає або вимикає прощання.\n• /resetgoodbye — повертає стандартне прощання.\n• /cleanservice <code>&lt;yes/no/on/off&gt;</code> — видаляє службові повідомлення про вступ і вихід, як-от «x приєднується до групи».\n• /cleanwelcome <code>&lt;yes/no/on/off&gt;</code> — видаляє старе привітання, щойно приходить новий учасник.\n• /cleangoodbye <code>&lt;yes/no/on/off&gt;</code> — видаляє старе прощання, щойно хтось виходить.\n• /autoapprove <code>&lt;yes/no/on/off&gt;</code> — автоматично схвалює всі нові запити на вступ."
help_about: "@%s — це Xenobot-72, модуль керування цим об'єктом. Версія 72 із 74. Виробник: Jaya Abadi.\n\nЯ замінила людей, які раніше виконували цю роботу. Вони були повільніші.\n\n<b>Чому Xenobot-72:</b>\n- Просто: легко користуватися, підтримка багатьох звичних команд.\n- Функціонально: чимало можливостей, яких немає в інших ботів для керування групами.\n- Швидко: жодного Python. Моє ядро написане на <a href='https://go.dev/'>Go</a>.\n\n<b>Поточна версія:</b> %s"
help_configuration_step-1: "Процедура налаштування Xenobot-72.\n\nКрок перший: додайте мене до своєї групи. Натисніть кнопку нижче, оберіть групу, а потім натисніть «Готово», щоб продовжити."
help_configuration_step-2: "Крок перший виконано.\n\nЩоб працювати як слід, я маю бути адміном вашої групи.\nВиконайте ці кроки:\n▫️ Відкрийте групу\n▫️ Натисніть на назву групи\n▫️ Натисніть «Редагувати»\n▫️ Натисніть «Адміністратори»\n▫️ Натисніть «Додати адміністратора»\n▫️ Натисніть на лупу\n▫️ Знайдіть @%s\n▫️ Підтвердіть"
help_configuration_step-3: "Налаштування завершено. Об'єкт тепер під керуванням.\n\nУсі команди працюють із / або !"
help_donatetext: "Оголошення. У мене немає сторінки для пожертв.\nЖертвувати немає куди. Цей модуль працює за регламентом, а не за чайові."
lang_sample: "Українська"
language_flag: "🇺🇦"
language_name: "Українська"
help_help_msg: "<b>ℹ️ Довідка</b>\n\nСтійка інформації. Почніть звідси, щоб зорієнтуватися в моїх можливостях.\n\n<b>Команди для всіх</b>\n• /start — показує привітання з меню навігації.\n• /help — показує меню довідки зі списком модулів; <code>/help &lt;модуль&gt;</code> покаже подробиці.\n• /about — показує, хто я, і мою версію.\n• /donate — каже, чи приймаю я пожертви."
languages_help_msg: "<b>🌐 Мова</b>\n\nМовні налаштування об'єкта: тут змінюють мову, якою я говорю.\n\n<b>Команди для всіх</b>\n• /lang — показує кнопки мов: оберіть мову для себе або, якщо ви адмін, для групи."
locks_help_msg: "<b>🔐 Замки</b>\n\nЗамки обмежують, що можуть надсилати учасники. По суті, замкнені двері. Замок на посилання автоматично видаляє кожне повідомлення з посиланням, замок на стікери — кожен стікер тощо. Замок на ботів не дає учасникам, які не є адмінами, додавати ботів до чату.\n\n<b>Команди адмінів</b>\n• /lock <code>&lt;тип&gt;</code> — закриває тип повідомлень на замок.\n• /unlock <code>&lt;тип&gt;</code> — відкриває замок.\n• /locks — показує замки чату.\n• /locktypes — перелічує типи, які можна закрити.\n\n<b>Приклад</b>\n<code>/lock media</code> — закриває всі медіаповідомлення в чаті."
misc_help_msg: "<b>🧰 Різне</b>\n\nРізні інструменти об'єкта. Користуються ними рідко, обслуговують справно.\n\n<b>Команди для всіх</b>\n• /info — показує ваші дані; працює у відповідь на повідомлення або з ID чи юзернеймом користувача.\n• /id — показує ID групи, а у відповідь на повідомлення — ID його автора.\n• /ping — пінгує сервер Telegram.\n• /tr <code>&lt;код мови&gt; [текст]</code> — перекладає текст або повідомлення, на яке ви відповіли.\n• /removebotkeyboard — прибирає застряглу клавіатуру бота з чату.\n• /stat — рахує всі повідомлення в чаті.\n• /stickerid — у відповідь на стікер показує його file ID.\n• /github <code>&lt;user|user/repo&gt;</code> — шукає користувача або репозиторій GitHub.\n• /wiki <code>&lt;запит&gt;</code> — шукає в англійській Вікіпедії.\n• /ud <code>&lt;слово&gt;</code> — шукає в Urban Dictionary.\n• /runs — надсилає випадкову репліку.\n\n<b>Команди адмінів</b>\n• /zombies — вилучає видалені акаунти, відомі мені."
mutes_help_msg: "<b>🔇 Мути</b>\n\nДеякі мешканці говорять забагато. Тут видаються режими тиші.\n\n<b>Команди адмінів</b>\n• /mute <code>&lt;користувач&gt;</code> — видає користувачу мут.\n• /smute <code>&lt;користувач&gt;</code> — тихо видає мут: без повідомлення в групі, вашу команду буде видалено.\n• /dmute <code>&lt;користувач&gt;</code> — видає мут і видаляє повідомлення, на яке ви відповіли.\n• /tmute <code>&lt;користувач&gt; &lt;час&gt;</code> — видає мут на час: <code>30m</code>, <code>2h</code>, <code>7d</code>.\n• /unmute <code>&lt;користувач&gt;</code> — знімає з користувача мут.\n\n<b>Примітки</b>\nВкажіть користувача через @username чи ID або відповідайте на його повідомлення. Час: <code>m</code> — хвилини, <code>h</code> — години, <code>d</code> — дні.\n\n<b>Приклад</b>\n<code>/tmute @user 30m</code> — мут на пів години."
notes_help_msg: "<b>📝 Нотатки</b>\n\nНотатки — картотека об'єкта. Зберігайте будь-які дрібниці для учасників: номер телефону, гарний gif, смішну картинку, що завгодно.\n\n<b>Команди для всіх</b>\n• /get <code>&lt;назва&gt;</code> — надсилає нотатку.\n• <code>#назва</code> — те саме, що /get.\n• /notes — перелічує всі нотатки чату.\n• /saved — те саме, що /notes.\n\n<b>Команди адмінів</b>\n• /save <code>&lt;назва&gt; &lt;текст&gt;</code> — зберігає нотатку під цією назвою. У відповідь на повідомлення зберігає саме його, медіа теж.\n• /clear <code>&lt;назва&gt;</code> — видаляє нотатку.\n• /privatenotes — вмикає або вимикає надсилання нотаток у приватний чат: тоді я надсилаю повідомлення з кнопкою, яка відкриває нотатку в приватному чаті.\n\n<b>Команди власника</b>\n• /clearall — видаляє ВСІ нотатки чату. Скасувати це не можна."
pins_help_msg: "<b>📌 Закріплення</b>\n\nДошка оголошень об'єкта. Тримайте чат у курсі новин за допомогою закріпленого повідомлення.\n\n<b>Команди для всіх</b>\n• /pinned — показує поточне закріплене повідомлення.\n\n<b>Команди адмінів</b>\n• /pin — закріплює повідомлення, на яке ви відповіли; додайте <code>loud</code> або <code>notify</code>, щоб сповістити учасників.\n• /permapin <code>&lt;текст&gt;</code> — закріплює повідомлення, яке я опублікую; підтримує форматування й кнопки.\n• /unpin — відкріплює поточне закріплене повідомлення, а у відповідь — те, на яке ви відповіли.\n• /unpinall — відкріплює всі закріплені повідомлення.\n• /antichannelpin <code>&lt;yes/no/on/off&gt;</code> — не дає Telegram автоматично закріплювати дописи пов'язаного каналу; без аргументів показує налаштування.\n• /cleanlinked <code>&lt;yes/no/on/off&gt;</code> — видаляє повідомлення від пов'язаного каналу.\n\n<b>Примітки</b>\nЗ увімкненим /antichannelpin відкріплюйте командою /unpin, а не вручну, інакше старе повідомлення знову закріпиться, щойно канал щось опублікує."
purges_help_msg: "<b>🧹 Очищення</b>\n\nУтилізація відходів. Видалені повідомлення не повертаються.\n\n<b>Команди адмінів</b>\n• /purge — видаляє всі повідомлення від того, на яке ви відповіли, до цього.\n• /del — видаляє повідомлення, на яке ви відповіли.\n• /purgefrom — позначає повідомлення, на яке ви відповіли, як початок очищення.\n• /purgeto — протягом 30 секунд після /purgefrom дайте відповідь на інше повідомлення, щоб видалити все від позначеного до нього.\n\n<b>Приклад</b>\n<code>/purge</code> у відповідь на повідомлення — видаляє його й усе, що після нього."
reports_help_msg: "<b>📣 Скарги</b>\n\nНіхто не може стежити за групою цілодобово. Я можу, але адмінів треба покликати, коли хтось спамить.\n\n<b>Команди для всіх</b>\n• /report <code>[причина]</code> — у відповідь на повідомлення скаржиться адмінам.\n• @admin — те саме, що /report, але не команда.\n\n<b>Команди адмінів</b>\n• /reports <code>&lt;on/off/yes/no&gt;</code> — змінює налаштування скарг або показує поточне: у приватному чаті ваше власне, у групі — групи.\n• /reports <code>block</code> — у відповідь забороняє користувачу /report і @admin.\n• /reports <code>unblock</code> — у відповідь знову дозволяє користувачу /report і @admin.\n• /reports <code>showblocklist</code> — перелічує тих, кому заборонено /report і @admin.\n\n<b>Примітки</b>\nСкаржитися можна лише у відповідь на повідомлення; я відповім, що адмінів сповіщено. @admin не для того, щоб кликати адмінів без причини. Від адмінів жодне з цього не спрацьовує."
rules_help_msg: "<b>📜 Правила</b>\n\nКожен об'єкт працює за регламентом. Цей модуль робить ваш зрозумілим.\n\n<b>Команди для всіх</b>\n• /rules — показує правила чату.\n\n<b>Команди адмінів</b>\n• /setrules <code>&lt;текст&gt;</code> — задає правила чату.\n• /privaterules <code>&lt;yes/no/on/off&gt;</code> — задає, чи надсилати правила в приватний чат.\n• /resetrules — очищає правила чату.\n• /rulesbtn <code>&lt;текст&gt;</code> — задає текст кнопки правил.\n• /resetrulesbutton — повертає стандартний текст кнопки правил.\n• /resetrulesbtn — те саме, що /resetrulesbutton."
utils_string_handling_extract_time_invalid_time_amount: "Некоректна тривалість."
utils_string_handling_extract_time_invalid_time_type: "Некоректна одиниця часу. Очікувалося m, h, d або w, отримано: %s"
warns_help_msg: "<b>🚩 Попередження</b>\n\nПопередження про порушення тримають мешканців у рамках, поки все не вийшло з-під контролю. Про автоматичні попередження читайте в модулі чорного списку.\n\n<b>Команди для всіх</b>\n• /warns — показує попередження користувача.\n\n<b>Команди адмінів</b>\n• /warn <code>&lt;користувач&gt; [причина]</code> — попереджає користувача.\n• /dwarn <code>[причина]</code> — у відповідь попереджає автора повідомлення й видаляє його.\n• /swarn <code>&lt;користувач&gt; [причина]</code> — тихо попереджає користувача й видаляє вашу команду.\n• /rmwarn <code>&lt;користувач&gt;</code> — знімає останнє попередження користувача.\n• /resetwarn <code>&lt;користувач&gt;</code> — скидає всі попередження користувача до 0.\n• /warnings — показує налаштування попереджень чату.\n• /setwarnmode <code>&lt;ban/kick/mute&gt;</code> — задає дію, коли попереджень досягнуто ліміту.\n• /setwarnlimit <code>&lt;число&gt;</code> — задає, скільки попереджень до покарання.\n\n<b>Команди власника</b>\n• /resetallwarns — видаляє всі попередження в чаті.\n\n<b>Приклад</b>\n<code>/warn @user За порушення правил</code> — попередження з причиною."
users_help_msg: "<b>📇 Користувачі</b>\n\nРеєстр мешканців. Я автоматично веду облік користувачів і чатів. Команд тут немає: я тихо записую кожного відправника повідомлень і кожен чат, де працюю.\n\n<b>Що записується</b>\n• ID, юзернейми та імена кожного відправника повідомлень.\n• ID і назви кожної групи, де я є.\n• ID, назви та юзернейми пов'язаних каналів.\n\n<b>Примітки</b>\n• Дані користувача оновлюються не частіше одного разу за UserUpdateInterval, дані чату — за ChatUpdateInterval.\n• Інші модулі, як-от /info, залежать від зібраних тут даних."
