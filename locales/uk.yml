staff_help_msg: "<b>👥 Staff-група</b>\n\nStaff-група — це одна група довірених адмінів, що керує вашими іншими групами.\n\n<b>Команди власника групи</b>\n• /setstaff — робить цю групу вашою Staff-групою (лише творець групи).\n• /unsetstaff — прибирає статус Staff і відв'язує всі групи (лише творець групи).\n• /linkstaff <code>[ID]</code> — прив'язує цю групу до вашої Staff-групи (лише творець групи). Додайте ID чату Staff-групи, якщо їх у вас кілька.\n• /unlinkstaff — відв'язує цю групу від її Staff-групи (лише творець обох груп).\n\n<b>У Staff-групі</b>\n• /staff — показує ID чату Staff-групи та її прив'язані групи. «Відв'язати» біля групи відв'язує її (лише творець обох груп). «Останні дії» показують минулі дії цієї Staff-групи й те, як пройшло в кожній групі. Рядок із 🔒 позначає прив'язану групу під локдауном; її адміни дізнаються причину через /lockdownstatus там.\n• Коли прив'язана група під локдауном, її сповіщення та щогодинні нагадування з'являються тут із кнопками «Зняти», «Забанити нових учасників» і «Відкликати посилання», якими можуть користуватися лише адміни цієї групи.\n\n<b>Дії Staff (у Staff-групі)</b>\n• /ban <code>&lt;користувач&gt; [термін] [причина]</code> — банить користувача в кожній прив'язаній групі.\n• /tban <code>&lt;користувач&gt; &lt;термін&gt; [причина]</code> — тимчасовий бан; термін обов'язковий.\n• /mute <code>&lt;користувач&gt; [термін] [причина]</code> — видає мут у кожній прив'язаній групі.\n• /tmute <code>&lt;користувач&gt; &lt;термін&gt; [причина]</code> — тимчасовий мут; термін обов'язковий.\n• /kick <code>&lt;користувач&gt; [причина]</code> — вилучає користувача з кожної прив'язаної групи; повернутися можна.\n• /unban <code>&lt;користувач&gt;</code> — знімає бан у кожній прив'язаній групі.\n• /unmute <code>&lt;користувач&gt;</code> — знімає мут у кожній прив'язаній групі.\n\n<b>Список блокування пересилань (у Staff-групі)</b>\n• /addfwdblock <code>&lt;джерело&gt;</code> — блокує пересилання з каналу (ID або @username) у кожній прив'язаній групі: я видаляю їх і застосовую до учасника дію зі списку. Список змінює лише творець Staff-групи.\n• /rmfwdblock <code>&lt;ID&gt;</code> — розблоковує джерело.\n• /fwdblocklist — показує заблоковані джерела.\n• /fwdblockaction <code>[дія]</code> — показує або задає дію: <code>none</code> (лише видалити), <code>warn</code>, <code>mute</code>, <code>kick</code> або <code>ban</code>.\nПересилання з групи помічається, лише якщо його опублікував анонімний адмін.\n\n<b>Примітки</b>\n• Користувач — це числовий ID, відомий мені @username або згадка. Термін — число з <code>m</code>, <code>h</code>, <code>d</code> або <code>w</code>; понад 366 днів означає назавжди.\n• Кожна дія спочатку показує картку. «Підтвердити» чи «Скасувати» може натиснути лише той, хто надіслав команду, а картка діє 5 хвилин.\n• Я дію лише в прив'язаних групах, де ви зараз адмін із правом обмежувати учасників, і ніколи проти адмінів чи власника групи; у результаті кожна група позначена як виконано, пропущено або помилка.\n• Кожен завершений підсумок має кнопку «↩ Відкотити всюди», яку також пропонують в «Останніх діях». Натиснути її може будь-який учасник Staff-групи, підтверджує той, хто натиснув, і кожна група повертається до попереднього стану лише там, де ця людина зараз може обмежувати учасників. Групи, змінені відтоді, не чіпаються. Вилучення відкотити не можна. Якщо відкат не може змінити жодну групу, нічого не витрачається, і той, хто може, зможе натиснути «Відкотити» ще раз. Щойно відкат спробував змінити групу, дію вже не можна відкотити знову.\n• Кожна виконана дія і кожен відкат публікуються в каналі журналу групи, до якої їх застосовано (категорія <code>admin</code>).\n• /sban, /dban, /skick, /dkick, /smute і /dmute тут не використовуються. Надсилайте ці команди від свого імені, а не анонімно."
