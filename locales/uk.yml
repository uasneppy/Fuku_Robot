# Reactions module strings
reactions_help_msg: "<b>👍 Реакції</b>\n\nЯ ставлю реакцію на кожне повідомлення з обраним словом. Бойовий дух — теж ресурс об'єкта.\n\n<b>Команди адмінів</b>\n• /addreaction <code>&lt;слово&gt; &lt;емодзі&gt;</code> — додає реакцію на слово.\n• /removereaction <code>&lt;слово&gt;</code> — прибирає реакцію на слово.\n• /reactions — показує реакції цього чату.\n• /resetreactions — прибирає всі реакції.\n\n<b>Примітки</b>\nЕмодзі має бути однією з реакцій Telegram. У групі може бути до 100 реакцій. Керувати ними можна й у /settings у приватному чаті.\n\n<b>Приклад</b>\n<code>/addreaction привіт 👋</code> — я ставлю 👋, коли хтось пише «привіт»."

