# Help module additional strings
help_bot_intro: "Я Xenobot-72 ✨, версія 72 із 74. Jaya Abadi створила мене, щоб керувати об'єктами. Ваша група — теж об'єкт.\nЯ стежу за порядком, щоб адмінам не довелося.\nНадішліть /help, щоб побачити все, що я вмію.\n"
help_pm_intro: "Вітаю, %s.\nЯ Xenobot-72 ✨.\n\nЯ модуль керування групами. Jaya Abadi створила мене, щоб підтримувати порядок на об'єктах, а ваші групи тепер об'єкти.\nЯ вмію контролювати флуд, вести облік попереджень, зберігати нотатки й автоматично відповідати на обрані ключові слова. Я не втомлююся. Обідня перерва мені не потрібна.\n\nКорисні команди:\n- /start: Запускає мене. Ви, найпевніше, вже це зробили.\n- /help: Надсилає це повідомлення; я розповім про себе більше.\n- /donate: Як мене підтримати.\n\nЯкщо щось дає збій або є питання, зверніться до адмінів своєї групи.\nУсі команди працюють із / або !.\n"

