approvals_help_msg: "<b>👤 Схвалення</b>\n\nВидайте надійним мешканцям перепустку: імунітет від автоматичних антиспам-заходів без прав адміна.\n\n<b>Команди адмінів:</b>\n\n× /approve <code><reply/username/mention/userid></code> <code>[reason]</code>\n× /unapprove <code><reply/username/mention/userid></code>\n× /approval <code><reply/username/mention/userid></code>\n× /approved: Список усіх схвалених користувачів\n× /unapproveall: Зняти всі схвалення (лише творець)\n\nНа схвалених користувачів не діють: антифлуд, чорний список, блокування і CAPTCHA.\n"
