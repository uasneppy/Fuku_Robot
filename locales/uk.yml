connections_stale_connection: "Підключення застаріло: я більше не маю доступу до цього чату. Скористайтеся /connect, щоб підключитися до дійсного чату."
connections_reconnect_need_pm: "Повторне підключення працює лише в особистих зі мною."
connections_reconnect_no_last_chat: "Немає попереднього чату для повторного підключення."
connections_reconnect_reconnected: "Віддалений зв'язок із <b>%s</b> відновлено."
disabling_help_msg: "Вимикайте часто вживані команди, щоб ніхто не міг ними користуватися. Команди можна ще й автоматично видаляти, щоб ніхто не засмічував чат синіми командами.\n\n*Команди адмінів*:\n× /disable `<commandname>`: Заборонити користувачам commandname у цій групі.\n× /enable `<item name>`: Знову дозволити користувачам commandname у цій групі.\n× /disableable: Список команд, які можна вимкнути.\n× /disabledel `<yes/no/on/off>`: Видаляти вимкнені команди, якщо їх надсилають неадміни.\n× /disabled: Список вимкнених команд цього чату.\n\nПримітка:\nВимкнена команда вимикається лише для неадмінів. Усі адміни можуть нею користуватися.\nВимкнені команди й далі доступні через /connect. Якщо хочете вимкнути і це, скажіть людям, які керують ботом."
devs_help_msg: "Сервісний доступ. Команди керування й діагностики бота лише для власника і довірених розробників. Звичайні користувачі їх не бачать.\n*Команди команди:*\n× /stats: Статистика бота і системні дані.\n× /teamusers: Список учасників команди.\n*Команди власника:*\n× /addsudo: Надати користувачу права sudo.\n× /adddev: Надати користувачу права розробника.\n× /remsudo: Забрати в користувача права sudo.\n× /remdev: Забрати в користувача права розробника.\n*Діагностика:*\n× /chatinfo: Докладні відомості про чат.\n× /chatlist: Створити й надіслати список усіх активних чатів.\n× /leavechat: Змусити бота покинути вказаний чат."
filters_help_msg: "Фільтри — це автоматичні відповіді. Регістр не має значення: щоразу, коли хтось пише ваше слово-тригер, Xenobot-72 відповідає вашим текстом. Так можна створювати власні команди.\n\nКоманди:\n- /filter <trigger> <reply>: Щоразу, коли хтось пише trigger, бот відповідає реченням. Для фільтрів із кількох слів візьміть тригер у лапки.\n- /filters: Список усіх фільтрів чату.\n- /stop <trigger>: Бот більше не відповідає на trigger.\n- /stopall: Вимкнути ВСІ фільтри поточного чату. Цю дію не можна скасувати.\n\nПриклади:\n- Додати фільтр:\n-> /filter hello Hello there! How are you?\n- Додати фільтр із кількох слів:\n-> /filter hello friend Hello back! Long time no see!\n- Додати фільтр, який спрацьовує лише для адмінів:\n-> /filter example This filter won't  happen if a normal user says it {admin}\n- Щоб зберегти файл, зображення, gif чи інше вкладення, дайте відповідь на файл командою:\n-> /filter trigger"
formatting_fillings: "<b>Заповнювачі</b>\n\nПовідомлення можна доповнювати даними з контексту. Наприклад, згадати користувача на ім'я в привітанні чи у фільтрі.\nУ нотатках заповнювачі теж працюють.\n\n<b>Підтримувані заповнювачі:</b>\n- <code>{first}</code>: Ім'я користувача.\n- <code>{last}</code>: Прізвище користувача.\n- <code>{fullname}</code>: Повне ім'я користувача.\n- <code>{username}</code>: Юзернейм користувача. Якщо його немає — згадка користувача.\n- <code>{mention}</code>: Згадка користувача на ім'я.\n- <code>{id}</code>: ID користувача.\n- <code>{chatname}</code>: Назва чату.\n- <code>{rules}</code>: Додає до повідомлення кнопку правил.\n- <code>{protect}</code>: Забороняє пересилати вміст.\n- <code>{preview}</code>: Вмикає прев'ю в повідомленні.\n- <code>{nonotif}</code>: Вимикає сповіщення для цього повідомлення."
formatting_help_msg: "Xenobot-72 підтримує чимало варіантів форматування, щоб ваші повідомлення були виразнішими. Натисніть кнопки нижче, щоб їх переглянути."
formatting_markdown: "<b>Форматування Markdown</b>\n\nПовідомлення можна оформлювати <b>жирним</b>, <i>курсивом</i>, <u>підкресленням</u>\nта іншим. Експериментуйте.\n\n<b>Підтримуваний markdown</b>:\n\n- <code>`code words`</code>: Зворотні апострофи дають моноширинний шрифт. Вигляд: <code>code words</code>.\n\n- <code>_italic words_</code>: Підкреслення дають курсив. Вигляд: <i>italic words</i>.\n\n- <code>*bold words*</code>: Зірочки дають жирний шрифт. Вигляд: <b>bold words</b>.\n\n- <code>~strikethrough~</code>: Тильди дають закреслення. Вигляд: <strike>strikethrough</strike>.\n\n- <code>||spoiler||</code>: Подвійні вертикальні риски дають спойлер. Вигляд: <tg-spoiler>Spoiler</tg-spoiler>.\n\n- <code>```pre```</code>: Форматувальник ігнорує інші символи форматування всередині тексту в '```', ось так: <code>**bold** | *bold*</code>.\n\n- <code>__underline__</code>: Подвійні підкреслення дають підкреслений текст. Вигляд: underline. ПРИМІТКА: Деякі клієнти показують це курсивом. Тоді скористайтеся вбудованим форматуванням застосунку.\n\n- <code>[hyperlink](example.com)</code>: Формат для посилань. Вигляд: <a href='https://example.com/'>hyperlink</a>.\n\n- <code>[My Button](buttonurl://example.com)</code>: Формат для кнопок. Цей приклад створює кнопку \"My button\", яка відкриває <code>example.com</code>.\n\nЩоб поставити кнопки в один рядок, використовуйте <code>:same</code>.\n\n<b>Приклад:</b>\n\n<code>[button 1](buttonurl:example.com)</code>\n\n<code>[button 2](buttonurl://example.com:same)</code>\n\n<code>[button 3](buttonurl://example.com)</code>\n\nКнопки 1 і 2 будуть в одному рядку, а 3 — під ними.\n"
formatting_random: "<b>Випадковий вміст</b>\n\nВміст повідомлення можна ще й рандомізувати. Привітання і нотатки\nменше схожі на офіційне оголошення, коли вони змінюються.\n\nЯк користуватися випадковим вмістом:\n\n- %%%: Цей роздільник додає боту випадкові відповіді.\n\nНаприклад:\n\n<code>hello\n\n%%%\n\nhow are you</code>\n\nБот випадково обере між першим повідомленням, \"hello\", і другим,\n\"how are you\".\n\nТак Xenobot-72 відчуватиметься більш налаштованою під вас. (працює лише у фільтрах і нотатках)\n\nПриклад привітання:\n\n- Кожен новий користувач отримає одне з трьох повідомлень,\nпоказаних тут.\n\n-> /filter \"hey\"\n\nhello there <code>{first}</code>!\n\n%%%\n\nOoooh, <code>{first}</code> how are you?\n\n%%%\n\nSup? <code>{first}</code>\n"
greetings_help_msg: "Привітання і прощання тепер оформлює об'єкт. Нові мешканці отримують вітання, ті, хто йде, отримують проводи.\n\n*Команди адмінів:*\n× /setwelcome `<reply/text>`: Задати текст привітання для групи.\n× /welcome `<yes/no/on/off>`: Увімкнути або вимкнути привітання.\n× /resetwelcome: Повернути стандартне привітання.\n× /setgoodbye `<reply/text>`: Задати текст прощання для групи.\n× /goodbye `<yes/no/on/off>`: Увімкнути або вимкнути прощання.\n× /resetgoodbye: Повернути стандартне прощання.\n× /cleanservice `<yes/no/on/off>`: Видаляти всі службові повідомлення, як-от «x приєднується до групи».\n× /cleanwelcome `<yes/no/on/off>`: Видаляти старе привітання, щойно приходить новий учасник.\n× /autoapprove `<yes/no/on/off>`: Автоматично схвалювати всі нові запити на вступ."
help_about: "@%s — це Xenobot-72, модуль керування цим об'єктом. Версія 72 із 74. Виробник: Jaya Abadi.\n\nЯ замінила людей, які раніше виконували цю роботу. Вони були повільніші.\n\n<b>Чому Xenobot-72:</b>\n- Просто: легко користуватися, підтримка багатьох звичних команд.\n- Функціонально: чимало можливостей, яких немає в інших ботів для керування групами.\n- Швидко: жодного Python. Моє ядро написане на <a href='https://go.dev/'>Go</a>.\n\n<b>Поточна версія:</b> %s"
help_configuration_step-1: "Процедура налаштування Xenobot-72.\n\nКрок перший: додайте Xenobot-72 ✨ до своєї групи. Натисніть кнопку нижче, оберіть групу, а потім натисніть «Готово», щоб продовжити."
help_configuration_step-2: "Крок перший виконано.\n\nЩоб працювати як слід, я маю бути адміном вашої групи.\nВиконайте ці кроки:\n▫️ Відкрийте групу\n▫️ Натисніть на назву групи\n▫️ Натисніть «Змінити»\n▫️ Натисніть «Адміністратори»\n▫️ Натисніть «Додати адміністратора»\n▫️ Натисніть на лупу\n▫️ Знайдіть @%s\n▫️ Підтвердіть"
help_configuration_step-3: "Налаштування завершено. Об'єкт тепер під керуванням.\n\nУсі команди працюють із / або !\n\nЯкщо щось не працює, перевірте, чи я адмін із потрібними правами, і спробуйте ще раз."
help_donatetext: "Ви бажаєте задонатити. Прийнято.\nДонати йдуть на мою роботу: базу даних, сховище і хостинг. Завдяки їм я працюю швидко.\nДонат може також відкрити функцію-другу, яку зараз не дають серверні обмеження.\nЦей модуль сам грошей не приймає. Щоб задонатити, зверніться до людей, які керують цим ботом."
lang_sample: "Українська"
language_flag: "🇺🇦"
language_name: "Українська"
help_help_msg: "Головний вхід і навігація Xenobot-72.\n*Команди навігації:*\n× /start: Показати привітання з меню навігації.\n× /help: Показати меню довідки зі списком модулів; /help <module> покаже подробиці.\n× /about: Показати відомості про бота, версію і корисні посилання.\n× /donate: Показати, як підтримати проєкт."
languages_help_msg: "Мовні налаштування об'єкта.\nЗмінюйте мову бота за допомогою цього модуля.\n\nНадішліть /lang і оберіть на вбудованій клавіатурі мову для себе або для групи."
locks_help_msg: "*Лише для адмінів*:\n× /lock `<permission>`: Заблокувати дозвіл чату.\n× /unlock `<permission>`: Розблокувати дозвіл чату.\n× /locks: Переглянути дозволи чату.\n× /locktypes: Доступні типи блокувань.\n\nБлокування обмежують, що можуть надсилати учасники групи. По суті, замкнені двері.\nБлокування URL автоматично видаляє всі повідомлення з посиланнями, блокування стікерів видаляє всі стікери тощо.\nБлокування ботів не дає неадмінам додавати ботів до чату.\n\n**Приклад:**\n`/lock media`: блокує всі медіаповідомлення в чаті."
misc_help_msg: "Різні інструменти об'єкта. Користуються ними рідко, обслуговують справно.\n× /info: Ваші дані користувача. Працює у відповідь на повідомлення або з User Id чи Username.\n× /id: ID поточної групи. У відповідь на повідомлення — ID того користувача.\n× /ping: Пінг сервера Telegram.\n× /tr <lang code> <msg/reply to message>: Перекласти повідомлення.\n× /removebotkeyboard: Прибрати застряглу клавіатуру бота з чату.\n× /stat: Порахувати всі повідомлення в чаті.\n× /stickerid: У відповідь на стікер — його file ID.\n× /zombies: Вигнати видалені акаунти, відомі боту (для адмінів).\n× /github <user|user/repo>: Знайти користувача або репозиторій GitHub.\n× /wiki <search>: Пошук в англійській Вікіпедії.\n× /ud <term>: Пошук в Urban Dictionary.\n× /runs: Випадкова репліка."
mutes_help_msg: "Деякі мешканці говорять забагато. Тут видаються режими тиші: мутьте учасників групи.\n\n*Команди муту:* (лише для адмінів)\n× /mute <userhandle>: мутить користувача. (через юзернейм або відповідь)\n× /smute <userhandle>: тихо мутить користувача: без повідомлення в групі, вашу команду буде видалено. (через юзернейм або відповідь)\n× /dmute <userhandle>: мутить користувача і видаляє повідомлення, на яке ви відповіли. (через юзернейм або відповідь)\n× /tmute <userhandle> x(m/h/d): мутить користувача на час `x`. (через юзернейм або відповідь). m = хвилини, h = години, d = дні.\n× /unmute <userhandle>: розмучує користувача. (через юзернейм або відповідь)"
notes_help_msg: "Нотатки — картотека об'єкта. Зберігайте дані для майбутніх користувачів.\nНотатки зручні для будь-яких дрібниць: номер телефону, гарний gif, смішна картинка, що завгодно.\n*Команди для користувачів:*\n- /get <notename>: Отримати нотатку.\n- #notename: Те саме, що /get.\nКоманди адмінів:\n- /save <notename> <note text>: Зберегти нову нотатку з назвою \"word\". Відповідь на повідомлення збереже саме його. Медіа теж підходять.\n- /clear <notename>: Видалити нотатку.\n- /notes: Список усіх нотаток поточного чату.\n- /saved: Те саме, що /notes.\n- /clearall: Видалити ВСІ нотатки чату. Скасувати не можна.\n- /privatenotes: Чи надсилати нотатки в особисті. Бот надішле повідомлення з кнопкою, яка відкриває нотатку в особистих."
pins_help_msg: "Дошка оголошень об'єкта. Тримайте чат у курсі новин за допомогою закріпленого повідомлення.\n\n*Команди для користувачів:*\n× /pinned: Поточне закріплене повідомлення.\n\n*Команди адмінів:*\n× /pin: Закріпити повідомлення, на яке ви відповіли. Додайте 'loud' або 'notify', щоб сповістити учасників.\n× /pinned: Останнє закріплене повідомлення поточного чату.\n× /permapin <text>: Закріпити власне повідомлення від імені бота. Підтримує markdown, кнопки та інші можливості.\n× /unpin: Відкріпити поточне закріплене повідомлення. У відповідь — відкріпити те, на яке ви відповіли.\n× /unpinall: Відкріпити всі закріплені повідомлення.\n× /antichannelpin <yes/no/on/off>: Не давати telegram автоматично закріплювати дописи пов'язаного каналу. Без аргументів показує поточне налаштування.\n× /cleanlinked <yes/no/on/off>: Видаляти повідомлення від пов'язаного каналу.\nПримітка: з увімкненим anti channel pin відкріплюйте командою /unpin, а не вручну. Інакше старе повідомлення знову закріпиться, щойно канал щось опублікує."
purges_help_msg: "*Лише для адмінів:*\n- /purge: видаляє всі повідомлення між цим і тим, на яке ви відповіли.\n- /del: видаляє повідомлення, на яке ви відповіли.\n\n*Приклади*:\n- Видалити всі повідомлення від того, на яке ви відповіли, до поточного.\n-> `/purge`"
reports_help_msg: "Ніхто не може стежити за групою цілодобово. Я можу, але адмінів треба покликати. Що робити, коли хтось спамить?\n\n× /report `<reason>`: у відповідь на повідомлення — поскаржитися адмінам.\n- @admin: те саме, що /report, але не команда.\n\n*Лише для адмінів:*\n× /reports `<on/off/yes/no>`: змінити налаштування скарг або переглянути поточне.\n- В особистих перемикає ваш власний статус.\n- У групі перемикає статус групи.\n× /reports `block` (лише у відповідь): Заборонити користувачу /report і @admin.\n× /reports `unblock` (лише у відповідь): Знову дозволити користувачу /report і @admin.\n× /reports `showblocklist`: Список заблокованих, яким не можна /report і @admin.\n\nЩоб поскаржитися на користувача, дайте відповідь на його повідомлення з @admin або /report; Xenobot-72 відповість, що адмінів сповіщено.\nСкаржитися можна ЛИШЕ у відповідь на повідомлення; @admin не для того, щоб кликати адмінів без причини.\n\n*ПРИМІТКА:* Від адмінів жодне з цього не спрацьовує."
rules_help_msg: "Кожен об'єкт працює за регламентом. Цей модуль робить ваш зрозумілим.\n*Команди для користувачів*:\n× /rules: Переглянути правила чату.\n*Команди адмінів*:\n× /setrules `<text>`: Задати правила чату.\n× /privaterules `<yes/no/on/off>`: Чи надсилати правила в особисті.\n× /resetrules: Скинути правила чату до стандартних\n× /rulesbtn `<custom text>`: Задати текст кнопки правил.\n× /resetrulesbutton: Скинути текст кнопки правил до стандартного.\n× /resetrulesbtn: Те саме."
bot_updates_creators_plug: "\nЯ Xenobot-72, версія 72 із 74. Jaya Abadi створила мене, щоб керувати такими об'єктами, як цей."
bot_updates_make_me_admin: "Надайте мені права адміністратора. Без них я не зможу керувати об'єктом на повну потужність."
