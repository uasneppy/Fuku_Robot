# AntiRaid module strings
antiraid_help_msg: |
  Старий режим рейду вимкнено, тимчасових банів більше немає. Я автоматично блокую групу, коли починається рейд, а адміни можуть заблокувати її вручну.

  × <code>/autolockdown</code>: переглянути або змінити автоматичні тригери — наплив учасників і потік повідомлень.
  × <code>/lockdown</code> і <code>/unlockdown</code>: заблокувати цю групу вручну та зняти блокування.
  × <code>/autoantiraid N|off</code>: усе ще задає поріг напливу учасників (від 3 до 500 входів за 60 секунд) і вмикає його, або вимикає наплив.

  <code>/antiraid</code>, <code>/raidtime</code> і <code>/raidactiontime</code> тепер лише вказують сюди й нічого не змінюють.
  Старий автоматичний поріг групи став її порогом напливу учасників.

# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: |
  Федерації спільно використовують список банів у ваших групах.

  *Власник (особисті повідомлення):*
  × /newfed <name>: створити федерацію (одну на користувача).
  × /renamefed <name>: перейменувати вашу федерацію.
  × /delfed: видалити вашу федерацію (з підтвердженням).
  × /fedpromote /feddemote: керувати адмінами федерації.
  × /fedreason on/off: вимагати причину для fban.
  × /fednotif on/off: сповіщати власника в особисті про fban.
  × /subfed /unsubfed /fedsubs: підписатися на іншу федерацію (макс. 5).
  × /fbanlist [csv|json|minicsv]: експортувати fban.
  × /importfbans: імпортувати з CSV/JSON-файлу у відповіді.
  × /setfedlog /unsetfedlog: чат журналу федерації.

  *Власник групи:*
  × /joinfed <fed_id>: приєднати цей чат до федерації.
  × /leavefed: вийти з федерації.
  × /quietfed on/off: приховувати пасивні сповіщення про fban.

  *Адміни федерації:*
  × /fban /unfban /funban: бан/розбан у федерації.
  × /fedstat /fbanstat: перевірити fban користувача.

  *Будь-хто:*
  × /fedinfo /fedadmins /chatfed /myfeds
logchannels_help_msg: |
  Надсилайте дії адмінів до окремого каналу журналу.

  1. Додайте бота до каналу як адміна.
  2. У цьому каналі надішліть /setlog.
  3. Перешліть це повідомлення в групу.

  *Команди адмінів:*
  × /unsetlog: прибрати канал журналу.
  × /logchannel: показати поточний канал журналу.
  × /logcategories: список категорій.
  × /log <category>: увімкнути категорію.
  × /nolog <category>: вимкнути категорію.

  Категорії: settings, admin, user, automated, reports, other.
