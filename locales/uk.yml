chat_status_bot_change_info_error: "Я не можу тут змінювати дані групи. Перевірте, чи я адмін із правом змінювати дані групи."
staff_help_msg: "Staff-група — це одна група довірених адмінів, що керує вашими іншими групами.\n\n*Власник групи:*\n× /setstaff: зробити цю групу вашою Staff-групою (лише творець групи).\n× /unsetstaff: прибрати статус Staff і відв'язати всі групи (лише творець групи).\n× /linkstaff [ID]: прив'язати цю групу до вашої Staff-групи (лише творець групи). Додайте ID чату Staff-групи, якщо їх у вас кілька.\n× /unlinkstaff: відв'язати цю групу від її Staff-групи (лише творець обох груп).\n\n*У Staff-групі:*\n× /staff: показати ID чату Staff-групи та її прив'язані групи. Натисніть «Відв'язати» біля групи, щоб відв'язати її (лише творець обох груп). Натисніть «Останні дії», щоб побачити минулі дії цієї Staff-групи та як пройшло в кожній групі. Рядок із 🔒 позначає прив'язану групу в локдауні; її адміни можуть дізнатися причину через /lockdownstatus там.\n× Коли прив'язану групу заблоковано, її сповіщення та щогодинні нагадування з'являються тут із кнопками «Зняти», «Забанити нових учасників» і «Відкликати посилання», якими можуть користуватися лише адміни цієї групи.\n\n*Дії Staff (у Staff-групі):*\n× /ban user [duration] [reason]: забанити користувача в кожній прив'язаній групі. Користувач — це числовий ID, відомий мені @username або згадка. Тривалість — число з m, h, d або w; понад 366 днів означає назавжди.\n× /tban user duration [reason]: тимчасовий бан. Тривалість обов'язкова.\n× /mute user [duration] [reason]: замутити користувача в кожній прив'язаній групі. Тривалість працює як у /ban.\n× /tmute user duration [reason]: тимчасовий мут. Тривалість обов'язкова.\n× /kick user [reason]: вигнати користувача з кожної прив'язаної групи. Повернутися можна.\n× /unban user: зняти бан у кожній прив'язаній групі.\n× /unmute user: зняти мут у кожній прив'язаній групі.\n\nКожна дія спочатку показує картку. Натиснути «Підтвердити» чи «Скасувати» може лише той, хто надіслав команду, а картка діє 5 хвилин.\nЯ дію лише в прив'язаних групах, де ви зараз адмін із правом обмежувати учасників, і ніколи проти адмінів чи власника групи; у результаті кожна група позначена як виконано, пропущено або помилка.\nКожен завершений підсумок має кнопку «↩ Скасувати всюди», яку також пропонують в «Останніх діях». Натиснути її може будь-який учасник Staff-групи, підтверджує той, хто натиснув, і кожна група повертається до попереднього стану лише там, де ця людина зараз може обмежувати учасників. Групи, змінені відтоді, не чіпаються. Вилучення скасувати не можна. Якщо скасування не може змінити жодну групу, наприклад, бо той, хто натиснув, не може обмежувати учасників у жодній із них, нічого не витрачається, і хтось, хто може, натисне «Скасувати» ще раз. Щойно скасування спробувало змінити групу, дію вже не можна скасувати знову.\nКожна виконана дія і кожне скасування публікуються в каналі журналу групи, до якої їх застосовано (категорія журналу admin).\n/sban, /dban, /skick, /dkick, /smute і /dmute тут не використовуються.\nНадсилайте ці команди від свого імені, а не анонімно.\n"
