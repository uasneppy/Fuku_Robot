connections_help_msg: "Віддалений доступ до об'єкта. Підключайтеся до бази даних чату й додавайте туди дані так, щоб чат цього не бачив. Додавати можуть лише адміни, а переглядати ваші дані — будь-який учасник (крім забанених і вигнаних).\n\n*Команди*:\n× /connect `<chatid>`: Підключитися до вказаного чату, щоб переглядати чи змінювати вміст.\n× /disconnect: Відключитися від поточного чату.\n× /reconnect: Знову підключитися до попереднього чату\n× /connection: Відомості про підключений чат.\n\n*Команди адмінів:*\n× /allowconnect <yes/no>: Дозволити чи заборонити користувачам підключатися до чатів.\n\nID чату можна дізнатися командою /id у самому чаті. Не дивуйтеся, якщо він від'ємний: у всіх супергруп від'ємні ID."
