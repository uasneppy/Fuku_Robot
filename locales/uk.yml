admin_help_msg: "Кадри наглядачів оформлюю я. Підвищуйте і понижуйте користувачів модулем адмінів.\n\n*Команди для користувачів:*\n× /adminlist: Список адмінів поточного чату.\n\n*Команди адмінів:*\n× /promote `<reply/username/mention/userid>`: Підвищити користувача.\n× /demote `<reply/username/mention/userid>`: Понизити користувача.\n× /title `<reply/username/mention/userid>` `<custom title>`: Встановити користувачу власну посаду\n× /setgtitle <title>: Змінити назву групи.\n× /setgpic: У відповідь на фото — зробити його аватаркою групи.\n× /setgdesc [text]: Змінити опис групи."
