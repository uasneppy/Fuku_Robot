blacklists_help_msg: "<b>🔤 Чорний список</b>\n\nЗаборонені слова видаляються одразу. Контрабанда на об'єкті не допускається.\n\n<b>Команди для всіх</b>\n• /blacklists — показує чорний список чату.\n\n<b>Команди адмінів</b>\n• /addblacklist <code>&lt;слово&gt;</code> — додає слово до чорного списку.\n• /rmblacklist <code>&lt;слово&gt;</code> — прибирає слово з чорного списку.\n• /blaction <code>&lt;mute/kick/ban/warn/none&gt;</code> — задає, що я роблю, коли знаходжу заборонене слово.\n• /blacklistaction — те саме, що /blaction.\n\n<b>Команди власника</b>\n• /remallbl — прибирає всі слова з чорного списку.\n\n<b>Примітки</b>\nСтандартна дія — <code>warn</code>: повідомлення видаляється, а автор отримує попередження."
