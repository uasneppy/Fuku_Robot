# AI spam filter module strings
aispam_help_msg: |
  <b>🤖 ШІ-фільтр спаму</b>

  Необов'язковий фільтр, який оцінює кожне повідомлення в цьому чаті за допомогою ШІ-моделі та видаляє ті, що вона впевнено вважає спамом.

  Більше нічого не відбувається: ні попередження, ні заглушення, ні відповіді, ні сповіщення. Повідомлення, яке модель упевнено визнала спамом, тихо видаляється, а відправнику про це не повідомляють.

  Повідомлення англійською спрацьовують від 80% упевненості, а будь-якою іншою мовою від 90%, бо модель орієнтована передусім на англійську.


  *Команди адмінів:*

  × /aispam: Показати, чи ввімкнено фільтр і що саме надсилається моделі.

  × /aispam `<on/off>`: Увімкнути або вимкнути фільтр для цього чату.


  У кожному чаті фільтр вимкнено, доки адмін його не ввімкне, а оператор бота має налаштувати ключ API.
aispam_status_enabled: "ШІ-фільтр спаму в цьому чаті <b>увімкнено</b>."
aispam_status_disabled: "ШІ-фільтр спаму в цьому чаті <b>вимкнено</b>. Увімкніть його командою <code>/aispam on</code>."
aispam_status_key_missing: "⚠️ Недоступно: оператор бота не налаштував ключ API, тож жодне повідомлення не перевіряється."
aispam_status_globally_disabled: "⚠️ Недоступно: оператор бота глобально вимкнув ШІ-фільтр спаму, тож жодне повідомлення не перевіряється."
aispam_data_notice: |
  <b>Що надсилається для кожного перевірюваного повідомлення:</b>
  • Назва, опис, правила та мова чату
  • Профіль відправника: кількість днів відколи бот уперше його побачив, повідомлення за останню годину, кількість попереджень
  • Текст або підпис повідомлення, домени посилань, а також чи це пересилання або відповідь
  • Кілька останніх повідомлень відправника в цьому чаті


  Імена, юзернейми, ID користувачів, номери телефонів і повідомлення з інших чатів не надсилаються.
aispam_enabled_success: "✅ ШІ-фільтр спаму тепер <b>увімкнено</b>. Повідомлення, які модель упевнено вважає спамом, будуть видалятися."
aispam_disabled_success: "❌ ШІ-фільтр спаму тепер <b>вимкнено</b>."
aispam_no_key: "❌ Не можу увімкнути ШІ-фільтр спаму: оператор бота не налаштував ключ API. Нічого не змінено."
aispam_globally_disabled: "❌ Не можу увімкнути ШІ-фільтр спаму: оператор бота вимкнув його глобально. Нічого не змінено."
aispam_invalid_option: "Я розумію лише один із варіантів: <code>on</code>/<code>off</code>/<code>yes</code>/<code>no</code>"
aispam_breaker_notice: "⚠️ Перевірки ШІ на спам у цьому чаті призупинено на кілька хвилин через повторні збої постачальника ШІ. Вони відновляться самі, а фільтр залишається увімкненим."

# Admin module extended documentation
admin_extended_docs: |
  <b>Підтримка анонімних адмінів</b>

  Команда <code>/anonadmin</code> дає власникам груп змогу перемикати розпізнавання анонімних адмінів:
  <code>/anonadmin on</code> - увімкнути перевірки анонімних адмінів
  <code>/anonadmin off</code> - вимкнути перевірки анонімних адмінів

  Коли увімкнено, бот вимагатиме підтвердження дій адмінів від анонімних акаунтів.

  <b>Як працює перевірка анонімного адміна:</b>
  1. Бот визначає, що відправник — GroupAnonymousBot
  2. Початкове повідомлення кешується на 20 секунд
  3. До чату надсилається кнопка «Натисніть, щоб підтвердити статус адміна»
  4. Користувача, що натиснув, перевіряють як адміна, і команда виконується
  5. Якщо не підтверджено, кнопка спливає через 20 секунд

  <b>Підтримувані команди:</b>
  Адмін: /promote, /demote, /title
  Блокування: /ban, /dban, /sban, /tban, /unban
  Заглушення: /mute, /smute, /dmute, /tmute, /unmute
  Закріплення: /pin, /unpin, /permapin, /unpinall
  Очищення: /purge, /del
  Попередження: /warn, /swarn, /dwarn

admin_notes_docs: |
  <b>Примітки щодо безпеки</b>
  • Увесь ввід користувача екранується для HTML, щоб запобігти ін'єкціям
  • Зміни прав адмінів виконуються з належною обробкою помилок і відновленням після паніки

# Antiflood extended docs
antiflood_notes_docs: |
  <b>Типова поведінка</b>
  Антифлуд <b>типово вимкнено</b>. Його потрібно явно ввімкнути командою <code>/setflood &lt;number&gt;</code>.

# Locks module extended documentation
locks_types_docs: |
  <b>Блокування дозволів</b> (16 типів)
  <code>sticker</code> - блокувати стікери
  <code>audio</code> - блокувати аудіофайли
  <code>voice</code> - блокувати голосові повідомлення
  <code>document</code> - блокувати документи
  <code>video</code> - блокувати відео
  <code>videonote</code> - блокувати відеоповідомлення
  <code>contact</code> - блокувати контакти
  <code>photo</code> - блокувати фото
  <code>gif</code> - блокувати GIF
  <code>url</code> - блокувати посилання
  <code>bots</code> - забороняти додавання ботів
  <code>forward</code> - блокувати пересилання
  <code>game</code> - блокувати ігри
  <code>location</code> - блокувати геолокації
  <code>rtl</code> - блокувати текст RTL
  <code>anonchannel</code> - блокувати повідомлення каналів

  <b>Блокування обмежень</b> (6 типів)
  <code>messages</code> - блокувати всі повідомлення
  <code>comments</code> - блокувати коментарі не учасників
  <code>media</code> - блокувати всі медіа
  <code>other</code> - блокувати ігри/стікери/GIF
  <code>previews</code> - блокувати попередній перегляд посилань
  <code>all</code> - блокувати все

locks_notes_docs: |
  <b>Технічні примітки</b>
  • Блокування діють у реальному часі
  • Адміни звільнені від усіх блокувань
  • Блокування зберігаються після перезапуску бота
  • Кеш скидається під час оновлень

# Languages extended docs
languages_extended_docs: |
  <b>Як це працює</b>
  • <b>Приватні чати:</b> будь-який користувач може змінити свою мову
  • <b>Групові чати:</b> змінити мову групи можуть лише адміни

  Налаштування мови кешуються для швидкодії та зберігаються окремо для користувачів і груп.

# Greetings extended docs
greetings_extended_docs: |
  <b>Інтеграція з капчею</b>
  Коли модуль капчі ввімкнено:
  1. Нових учасників заглушують після входу
  2. Замість привітання надсилається завдання капчі
  3. Після перевірки надсилається привітання
  4. Невдала перевірка застосовує дію капчі

# Extended documentation locale keys - Notes module
notes_extended_docs: |
  <b>Можливості:</b>
  • <b>Текст і медіа</b>: зберігайте текстові повідомлення, фото, відео, документи тощо
  • <b>Власні кнопки</b>: додавайте до нотаток інлайн-кнопки
  • <b>Параметри форматування</b>: керуйте видимістю та поведінкою нотаток
  • <b>Нотатки лише для адмінів</b>: обмежте окремі нотатки лише для адміністраторів
  • <b>Приватні нотатки</b>: надсилайте нотатки користувачам у приватні повідомлення
  • <b>Керування попереднім переглядом</b>: вмикайте або вимикайте перегляд посилань
  • <b>Захищений вміст</b>: забороніть пересилання вмісту нотатки

  <b>Параметри форматування нотаток:</b>
  Зберігаючи нотатку, можна використати спеціальні теги, що керують її поведінкою:
  • <code>{private}</code> - нотатку буде надіслано лише в ПП, ніколи в групу
  • <code>{noprivate}</code> - нотатку буде надіслано лише в групу, ніколи в ПП
  • <code>{admin}</code> - нотатка доступна лише адмінам
  • <code>{protect}</code> - вміст не можна пересилати
  • <code>{nonotif}</code> - надіслати без звуку сповіщення
  • <code>{nopreview}</code> - вимкнути попередній перегляд посилання

  <b>Режим приватних нотаток:</b>
  Коли приватні нотатки ввімкнено (<code>/privatenotes on</code>), усі нотатки надсилаються користувачам у ПП, а не в групу. Це зберігає чат групи чистим.

  Окремі нотатки можуть змінювати цю поведінку:
  • <code>{private}</code> - завжди надсилати приватно
  • <code>{noprivate}</code> - завжди надсилати в групу

  <b>Необроблена нотатка (без форматування):</b>
  Щоб побачити вміст нотатки без форматування (для редагування):
  <code>/get notename noformat</code>

notes_permissions_docs: |
  <b>Потрібні права:</b>
  • Зберігати/видаляти нотатки: зміна інформації про групу
  • Переглядати адмінські нотатки: статус адміна
  • Видаляти всі нотатки: власник чату
  • Отримувати звичайні нотатки: будь-який користувач

# Extended documentation locale keys - Pins module
pins_extended_docs: |
  <b>Можливості:</b>

  <b>Анти-закріплення з каналу:</b>
  Коли ввімкнено, бот автоматично відкріплює будь-яке повідомлення, яке пов'язаний канал закріпив автоматично. Це корисно, якщо ви хочете контролювати, що закріплюється у вашій групі.

  <b>Важливо:</b> використовуючи анти-закріплення з каналу, завжди відкріплюйте командою <code>/unpin</code>, а не вручну через Telegram. Ручне відкріплення призведе до повторного закріплення старого повідомлення, коли канал надішле нові.

  <b>Очищення пов'язаного каналу:</b>
  Коли ввімкнено, бот автоматично видаляє будь-які повідомлення, надіслані до групи з пов'язаного каналу. Це береже чат групи від дублікатів дописів каналу.

  <b>Permapin:</b>
  Створюйте власні закріплені повідомлення з:
  • текстом із форматуванням HTML/Markdown
  • інлайн-кнопками з посиланнями
  • медіавкладеннями (фото, документи, стікери, аудіо, відео, голосові, відеоповідомлення)
  • усіма стандартними підстановками ({first}, {chatname} тощо)

  <b>Підтримується через підключення:</b>
  Ці команди працюють, коли чат підключено через <code>/connect</code>:
  • <code>/antichannelpin</code>
  • <code>/cleanlinked</code>

pins_notes_docs: |
  <b>Примітки:</b>
  • Команда <code>/unpinall</code> показує діалог підтвердження перед відкріпленням усіх повідомлень
  • Permapin підтримує всі типи медіа, які Telegram дозволяє закріплювати
  • Налаштування анти-закріплення з каналу та очищення пов'язаного каналу зберігаються для кожного чату й діють після перезапуску бота

  <b>Потрібні права:</b>
  <b>Бот:</b> має бути адміном із правом «Закріплювати повідомлення»
  <b>Користувач:</b> більшість команд потребує адміна з правом «Закріплювати повідомлення»

# Extended documentation locale keys - Purges module
purges_extended_docs: |
  <b>Видалення діапазону через purgefrom/purgeto:</b>
  Коли потрібно більше контролю над діапазоном видалення:

  1. Дайте відповідь на <b>перше</b> повідомлення діапазону:
  <code>/purgefrom</code>
  Бот підтвердить, що повідомлення позначено (діє 30 секунд).

  2. Дайте відповідь на <b>останнє</b> повідомлення діапазону:
  <code>/purgeto</code>
  Усі повідомлення між двома позначками (включно) буде видалено.

  Це зручно, коли важко прокрутити до початкової точки або потрібно перевірити діапазон перед видаленням.

  <b>Обмеження:</b>
  • <b>Максимум повідомлень за одне очищення:</b> 1000
  • <b>Обмеження за віком:</b> повідомлення старші за 48 годин можуть не видалятися (обмеження Telegram API)
  • <b>Потрібні права:</b> і користувач, і бот повинні мати право «Видаляти повідомлення»

purges_notes_docs: |
  <b>Примітки:</b>
  • Позначка <code>/purgefrom</code> спливає за 30 секунд, якщо за нею не йде <code>/purgeto</code>
  • Видалення великих діапазонів використовує паралельну обробку для кращої швидкодії
  • Повідомлення про стан (скільки повідомлень видалено) автоматично видаляються за 3 секунди
  • Бот коректно обробляє вже видалені повідомлення без помилок

# Extended documentation locale keys - Reports module
reports_extended_docs: |
  <b>Як це працює:</b>

  <b>Скарга на повідомлення:</b>
  1. <b>Дайте відповідь на повідомлення-порушення</b> командою <code>/report</code> або згадайте <code>@admin</code>
  2. Бот надсилає сповіщення, що згадує всіх адмінів, які ввімкнули скарги
  3. Сповіщення містить кнопки дій для швидкої модерації

  <b>Кнопки дій адміна:</b>
  • <b>📩 Повідомлення</b> - посилання на повідомлення зі скаргою
  • <b>👢 Вилучити</b> - вилучити користувача, на якого скаржаться (він може повернутися)
  • <b>🚫 Заблокувати</b> - назавжди заблокувати користувача, на якого скаржаться
  • <b>🗑 Видалити</b> - видалити повідомлення, на яке скаржаться
  • <b>✅ Вирішено</b> - позначити скаргу вирішеною без дій

  <b>Особисті та групові налаштування:</b>
  • <b>У ПП:</b> <code>/reports on/off</code> перемикає, чи ВИ отримуєте сповіщення про скарги
  • <b>У групі:</b> <code>/reports on/off</code> перемикає, чи ввімкнено скарги для цієї групи
reports_permissions_docs: |
  <b>Хто може надсилати скарги?</b>
  ✅ Звичайні користувачі
  ❌ Адміністратори (їм не потрібно скаржитися самим на себе)
  ❌ Заблоковані користувачі
  ❌ Анонімні канали / системні акаунти Telegram

  <b>На кого можна скаржитися?</b>
  ✅ Звичайні користувачі
  ❌ Сам бот
  ❌ Адміністратори (захищені від скарг)
  ❌ Анонімні канали / системні акаунти Telegram

# Extended documentation locale keys - Rules module
rules_extended_docs: |
  <b>Можливості:</b>

  <b>Приватні правила:</b>
  Увімкніть приватні правила (<code>/privaterules on</code>), щоб правила надсилалися в особисті повідомлення, а не в групу. Так чат групи залишається чистим.

  <b>Власна кнопка правил:</b>
  Задайте власний текст кнопки (до 30 символів):
  <code>/rulesbtn Переглянути правила</code>

  Скинути до типового:
  <code>/resetrulesbtn</code>

  <b>Встановлення правил:</b>
  Правила можна задати текстом одразу або у відповіді на повідомлення:
  <code>/setrules Будь ласка, поважайте всіх учасників.</code>

  Або у відповіді на повідомлення:
  <code>/setrules</code>

  <b>Потрібні дозволи:</b>
  • Команди для користувачів: доступні всім
  • Команди для адмінів: потрібні права адміністратора в чаті

# Extended documentation locale keys - Warns module
warns_extended_docs: |
  <b>Типові налаштування:</b>
  • <b>Типовий ліміт попереджень:</b> 3 попередження
  • <b>Типовий режим покарання:</b> mute

  <b>Доступні режими покарання за попередження:</b>
  • <code>ban</code> - назавжди заблокувати користувача в чаті
  • <code>kick</code> - вилучити користувача (він зможе повернутися)
  • <code>mute</code> - заглушити користувача (не зможе писати повідомлення)

  <b>Тихі попередження та з видаленням:</b>
  • <code>/swarn</code> - видалити вашу команду й тихо попередити
  • <code>/dwarn</code> - видалити повідомлення користувача й попередити його

warns_permissions_docs: |
  <b>Потрібні дозволи:</b>
  • <code>/warn</code>, <code>/dwarn</code>, <code>/swarn</code>: бот-адмін + адмін користувача з правом обмежувати
  • <code>/rmwarn</code>, <code>/unwarn</code>: бот-адмін + адмін користувача
  • <code>/resetwarn</code>, <code>/resetwarns</code>: бот-адмін + адмін користувача
  • <code>/resetallwarns</code>: лише власник чату
  • <code>/setwarnmode</code>, <code>/setwarnlimit</code>: бот-адмін + адмін користувача
  • <code>/warnings</code>: бот-адмін + адмін користувача
  • <code>/warns</code>: будь-який користувач (можна вимкнути)

warns_notes_docs: |
  <b>Примітки:</b>
  • Коли користувач досягає ліміту попереджень, автоматично застосовується налаштована дія (ban/kick/mute)
  • Причини попереджень зберігаються й показуються під час перегляду попереджень користувача
  • <code>/warns</code> - єдина команда цього модуля, яку адміни можуть вимкнути
  • Анонімним дописам каналів попередження видати не можна
  • Адмінам попередження видати не можна

# Extended documentation locale keys - Mutes module
mutes_extended_docs: |
  <b>Формат часу для тимчасового заглушення:</b>
  • <code>m</code> = хвилини (напр., <code>30m</code>)
  • <code>h</code> = години (напр., <code>2h</code>)
  • <code>d</code> = дні (напр., <code>1d</code>)

  <b>Варіанти заглушення:</b>
  • <code>/mute</code> - звичайне заглушення з необов'язковою причиною
  • <code>/smute</code> - тихе заглушення (видаляє ваше повідомлення з командою)
  • <code>/dmute</code> - заглушення з видаленням (глушить користувача й видаляє його повідомлення)
  • <code>/tmute</code> - тимчасове заглушення на вказаний час

  <b>Потрібні дозволи:</b>
  <b>Команди лише для адмінів.</b> Той, хто їх виконує, повинен мати:
  • Статус адміністратора в чаті
  • Право обмежувати учасників

  Бот також має бути адміністратором із правом обмежувати учасників.

# Extended documentation locale keys - Filters module
filters_extended_docs: |
  <b>Розширені можливості:</b>

  <b>Випадкові відповіді:</b>
  Використовуйте <code>%%%</code>, щоб розділити кілька відповідей. Одна з них буде обрана випадково:
  <code>/filter hello Hi there!%%%Hello!%%%Hey, how are you?</code>

  <b>Медіафільтри:</b>
  Дайте відповідь на будь-яке медіа (фото, відео, документ, стікер тощо) командою <code>/filter trigger</code>, щоб створити фільтр, який надсилає це медіа.

  <b>Режим noformat:</b>
  Адміни можуть переглянути необроблений вміст фільтра (разом із кодами форматування), додавши <code>noformat</code> після тригера:
  <code>hello noformat</code>
  Це корисно для налагодження фільтрів або перегляду налаштування кнопок.

  <b>Кнопки фільтрів:</b>
  До фільтрів можна додавати вбудовані кнопки:
  <code>/filter hello Hello! Check out these links:
  [Button 1](buttonurl:https://example.com)
  [Button 2](buttonurl:https://example2.com)</code>

filters_technical_docs: |
  <b>Як працюють фільтри:</b>
  1. Коли надходить повідомлення, бот отримує всі фільтри чату оптимізованим кешованим запитом
  2. Алгоритм Ахо-Корасік ефективно зіставляє всі ключові слова фільтрів із текстом повідомлення
  3. Перший фільтр, що збігся, спрацьовує і надсилає відповідь
  4. Фільтри підтримують текстові відповіді, медіа та кнопки

  <b>Підтвердження перезапису:</b>
  Коли ви намагаєтеся додати фільтр, який уже існує, бот попросить підтвердити перезапис. Підтвердження діє 5 хвилин.

  <b>Поведінка кешу:</b>
  • Списки фільтрів кешуються на 15 хвилин для кожного чату
  • Кеш автоматично скидається, коли фільтри додають або видаляють

filters_limits_docs: |
  <b>Ліміти:</b>
  • Максимум 150 фільтрів на чат
  • Максимум 100 символів у ключовому слові фільтра
  • Ключові слова фільтрів зберігаються малими літерами

  <b>Потрібні дозволи:</b>
  • <code>/filter</code>, <code>/addfilter</code>: адмін із правом змінювати інформацію про чат
  • <code>/stop</code>, <code>/rmfilter</code>, <code>/removefilter</code>: адмін із правом змінювати інформацію про чат
  • <code>/stopall</code>: лише власник чату
  • <code>/filters</code>: доступна всім користувачам

# Extended documentation locale keys - Captcha module
captcha_extended_docs: |
  <b>Як це працює:</b>
  1. Коли капчу ввімкнено, нові учасники автоматично отримують мут одразу після вступу
  2. Новому учаснику надсилається завдання капчі
  3. Користувач має вибрати правильну відповідь із запропонованих варіантів
  4. Якщо все вдало, мут знімається і користувач може брати участь у групі
  5. Якщо він не впорався або вийшов час, виконується налаштована дія (kick, ban або mute)

  <b>Типи капчі:</b>
  • <b>Математична</b>: розв'язати простий арифметичний приклад (додавання, віднімання, множення)
  • <b>Текстова</b>: розпізнати текст на спотвореному зображенні

  <b>Відкладені повідомлення:</b>
  Поки користувач проходить капчу, всі повідомлення, які він намагається надіслати, зберігаються й видаляються. Адміни можуть:
  • Переглянути, що користувач намагався надіслати, командою <code>/captchapending</code>
  • Очистити збережені повідомлення командою <code>/captchaclear</code>

  Це допомагає виявити можливий спам до завершення перевірки.

captcha_permissions_docs: |
  <b>Вимоги до бота:</b>
  • Блокування користувачів (для дій kick/ban)
  • Обмеження учасників (для муту під час перевірки)
  • Видалення повідомлень (для прибирання повідомлень капчі)

  <b>Дії при невдачі:</b>
  • <code>kick</code> - вилучити користувача з можливістю повернутися
  • <code>ban</code> - назавжди заблокувати користувача
  • <code>mute</code> - тримати користувача в муті 24 години

# Extended documentation locale keys - Blacklists module
blacklists_extended_docs: |
  <b>Доступні дії:</b>
  Наступні дії можна задати командою <code>/blaction</code>:
  • <code>none</code> - лише видаляє повідомлення без жодних додаткових дій
  • <code>warn</code> - видаляє повідомлення й видає користувачу попередження (типово)
  • <code>mute</code> - видаляє повідомлення й глушить користувача
  • <code>kick</code> - видаляє повідомлення й вилучає користувача (він зможе повернутися)
  • <code>ban</code> - видаляє повідомлення й назавжди блокує користувача

  <b>Примітка:</b>
  Типовий режим чорного списку - <b>warn</b>: повідомлення видаляється, а користувач отримує попередження.

  <b>Команди:</b>
  • <code>/addblacklist &lt;trigger&gt;</code> - додає слово до чорного списку цього чату
  • <code>/rmblacklist &lt;trigger&gt;</code> - прибирає слово зі списку заборонених слів чату
  • <code>/blaction &lt;mute/kick/ban/warn/none&gt;</code> - задає дію бота, коли виявлено слово з чорного списку
  • <code>/remallbl</code> - прибирає всі заборонені слова з чату (лише для власника)

# Extended documentation locale keys - Disabling module
disabling_extended_docs: |
  <b>Основні можливості:</b>
  • Вимикайте окремі команди бота для користувачів, які не є адмінами
  • Адміни завжди можуть обходити вимкнені команди
  • Необов'язкове автоматичне видалення повідомлень із вимкненими командами
  • Можна вимикати одразу кілька команд

  <b>Вимкнення кількох команд:</b>
  <code>/disable adminlist rules info</code>
  Вимикає команди <code>/adminlist</code>, <code>/rules</code> та <code>/info</code> одразу.

  <b>Перемикання видалення команд:</b>
  <code>/disabledel on</code> - повідомлення з вимкненими командами тепер видалятимуться.
  <code>/disabledel off</code> - повідомлення з вимкненими командами більше не видалятимуться.
  <code>/disabledel</code> - перевірити поточне налаштування видалення.

disabling_notes_docs: |
  <b>Важливі примітки:</b>
  • <b>Обхід для адмінів:</b> вимкнені команди діють лише на користувачів без прав адміна. Усі адміни можуть користуватися будь-якою командою.
  • <b>Підтримка підключень:</b> вимкнені команди залишаються доступними через <code>/connect</code> для підключених чатів.
  • <b>Кілька команд:</b> і <code>/disable</code>, і <code>/enable</code> приймають кілька назв команд в одному повідомленні.
  • <b>Обробка помилок:</b> якщо деякі команди не вдалося вимкнути/увімкнути, ви отримаєте повідомлення, які вдалося, а які ні.

  <b>Потрібні дозволи:</b>
  • <code>/disable</code>, <code>/enable</code>, <code>/disabledel</code>: лише для адмінів
  • <code>/disableable</code>, <code>/disabled</code>: усім користувачам (але <code>/disabled</code> можна вимкнути)

# Extended documentation locale keys - Help module
help_extended_docs: |
  <b>Система навігації:</b>
  Модуль довідки забезпечує головні точки входу бота та навігацію. Коли користувач надсилає <code>/start</code> в особистому чаті, бот показує привітання з вбудованою клавіатурою для переходу до різних модулів.

  Команда <code>/help</code> показує список модулів. Натискання кнопки модуля показує його команди та інформацію про використання. Коли <code>/help</code> викликають у груповому чаті, бот перенаправляє користувача в особисті повідомлення за докладною довідкою, щоб не засмічувати групу.

  <code>/about</code> показує інформацію про бота, версію та посилання, а <code>/donate</code> - інформацію про підтримку проєкту.

# Extended documentation locale keys - Devs module
devs_extended_docs: |
  <b>Ієрархія команди:</b>
  Модуль Devs надає команди керування ботом і діагностики, доступні лише внутрішній команді бота. Команда має три рівні зі спадними привілеями.

  <b>Рівень 1 - Власник:</b> задається змінною середовища <code>OWNER_ID</code> під час розгортання. Повний контроль: керування складом команди, усі діагностичні команди, усі команди команди.

  <b>Рівень 2 - Sudo / Dev:</b> призначається власником через <code>/addsudo</code> або <code>/adddev</code>. Діагностичні команди: статистика бота, інформація про чати, керування чатами.

  <b>Рівень 3 - Учасник команди:</b> автоматично включає власника, усіх sudo та всіх dev-користувачів. Лише перегляд складу команди через <code>/teamusers</code>.

  <b>Примітка:</b> Sudo і Dev мають однаковий доступ до команд. Різниця існує для організаційних цілей.

  <b>Важливо:</b> ці команди не відображаються в публічному меню довідки й мовчки ігнорують неавторизованих користувачів.

# Extended documentation locale keys - Users module
users_extended_docs: |
  <b>Фоновий трекер:</b>
  Модуль Users - пасивний фоновий модуль без команд для користувачів. Він працює непомітно на кожному повідомленні, яке обробляє бот, і автоматично відстежує всіх відправників повідомлень та всі чати, де активний бот.

  <b>Що відстежується:</b>
  • ID користувачів, імена користувачів (username) та відображувані імена кожного відправника повідомлень
  • ID та назви чатів кожної групи, де є бот
  • ID, назви та імена користувачів (username) пов'язаних каналів

  <b>Обмеження частоти:</b>
  • Оновлення користувачів: не частіше одного разу на <code>UserUpdateInterval</code>
  • Оновлення чатів: не частіше одного разу на <code>ChatUpdateInterval</code>
  • Це запобігає надмірним записам у базу даних і водночас підтримує дані достатньо актуальними

  <b>Пасивна робота:</b>
  • Працює як спостерігач повідомлень у групі обробників -1 (спрацьовує перед усіма обробниками команд)
  • Взаємодія з користувачем не потрібна - усе автоматично
  • Інші модулі, як-от <code>/info</code>, залежать від даних, зібраних цим модулем

