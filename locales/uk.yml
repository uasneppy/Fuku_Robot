settings_mreq_hint_ai: "Claude від Anthropic отримує лише ім'я, прізвище та username, але ніколи повідомлення. ШІ може помилятися, тому для цього правила краще пасують Попередження або Заглушення, ніж Вилучення чи Бан."
settings_mreq_hint_join: "Кожного учасника перевіряють при наступному повідомленні. Якщо ввімкнено перевірку при вході, нових учасників перевіряють і під час вступу, одразу після капчі. Адмінів, схвалених користувачів, ботів і повідомлення від імені каналу не перевіряють ніколи."
settings_mreq_hint_delete: "Видалення повідомлень стирає кожне повідомлення учасника, який порушує правило, зокрема поки його заглушено або попереджено за це."
settings_mreq_hint_mute: "Кнопка «Виправлено» є лише в заглушення: коли учасник виконає вимоги й натисне її, я зніму заглушення й надішлю привітання. Вилучений учасник може повернутися; забанений чекає на адміна."
