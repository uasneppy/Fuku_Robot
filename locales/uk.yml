captcha_help_msg: "<b>🧩 Капча</b>\n\nКонтроль доступу на об'єкт. Нові учасники доводять, що вони люди, розв'язавши просте завдання, перш ніж зможуть писати.\n\n<b>Команди адмінів</b>\n• /captcha <code>&lt;on/off&gt;</code> — вмикає або вимикає капчу.\n• /captchamode <code>&lt;math/text/turnstile&gt;</code> — задає тип капчі.\n• /captchatime <code>&lt;1-10&gt;</code> — задає час на проходження в хвилинах (стандартно 2).\n• /captchaaction <code>&lt;kick/ban/mute&gt;</code> — задає дію, якщо перевірку не пройдено (стандартно kick).\n• /captchamaxattempts <code>&lt;1-10&gt;</code> — задає найбільшу кількість спроб (стандартно 3).\n\n<b>Типи капчі</b>\n• math — простий арифметичний приклад.\n• text — текст на зображенні.\n• turnstile — перевірка Cloudflare на вебсторінці.\n\n<b>Примітки</b>\nКоли капчу увімкнено, нові учасники отримують мут, доки не пройдуть перевірку. Якщо не пройдуть або час вийде, я застосовую налаштовану дію."
