settings_help_msg: |
  Керуйте цією групою з одного меню кнопок.

  <b>Команди адмінів</b>:
  × /settings: Відкрити меню налаштувань, у групі або в приватному чаті.

  Меню охоплює зв'язок зі Staff-групою, локдаун (стан, зняття й автоматичні тригери), капчу та антифлуд. Кожна зміна в ньому дорівнює відповідній команді: /linkstaff, /unlinkstaff, /unlockdown, /autolockdown, /captcha, /captchamode, /captchatime, /captchaaction, /setflood, /setfloodmode і /delflood.

  Меню, відкрите в групі, відповідає лише адміну, який його відкрив. Кожне натискання перевіряє, що ви все ще адмін групи, а кожна зміна потребує того самого права, що й відповідна команда.
