approvals_help_msg: "<b>👤 Схвалення</b>\n\nВидайте надійним мешканцям перепустку: імунітет від автоматичних антиспам-заходів без прав адміна.\n\n<b>Команди адмінів</b>\n• /approve <code>&lt;користувач&gt; [причина]</code> — схвалює користувача.\n• /unapprove <code>&lt;користувач&gt;</code> — знімає схвалення.\n• /approval <code>&lt;користувач&gt;</code> — показує, чи схвалено користувача.\n• /approved — перелічує всіх схвалених користувачів.\n\n<b>Команди власника</b>\n• /unapproveall — знімає всі схвалення.\n\n<b>Примітки</b>\nНа схвалених учасників не діють антифлуд, чорний список, замки й капча. Вкажіть користувача через @username, ID чи згадку або відповідайте на його повідомлення."
