settings_mreq_desc_russian: "Ім'я або прізвище з ы, ъ, э чи ё порушує це правило. Білоруська і болгарська використовують частину цих літер, тож такі імена теж можуть потрапити."
settings_mreq_desc_arabic: "Ім'я або прізвище з будь-якою арабською літерою порушує це правило. Перська, урду й інші мови мають те саме письмо, тож такі імена теж потрапляють."
settings_mreq_desc_chinese: "Ім'я або прізвище з будь-яким китайським ієрогліфом порушує це правило. Японські імена, записані кандзі, мають ті самі знаки, тож вони теж потрапляють."
settings_mreq_desc_photo: "Учасник без видимого мені фото профілю порушує це правило. Фото, приховане налаштуваннями приватності, вважається відсутнім. Учасник може показати його всім, або адмін може його схвалити."
settings_mreq_desc_channel: "Учасник, не підписаний на пов'язаний канал цієї групи, порушує це правило. Перевірити це я можу лише як адміністратор того каналу."
settings_mreq_desc_ai: "Ім'я, яке Claude вважає спамом, наприклад рекламу чи шахрайство, порушує це правило. Нових учасників я перевіряю при вступі або першому повідомленні, а будь-якого учасника — після зміни імені. Тих, хто вже в групі, я перевіряю лише після зміни імені."
settings_mreq_now: "Покарання: {action}"
settings_mreq_choose_hint: "Вимк. і Попередження діють одразу. Вилучення, Бан і Заглушення спершу просять підтвердження."
settings_mreq_actions_hint: "Попередження враховується в ліміті попереджень групи. Вилучення дозволяє повернутися. Бан не пускає, доки адмін не розбанить. Заглушення триває, доки учасник не виправить профіль і не натисне «Виправлено»."
