antiflood_help_msg: "Хтось заходить, надсилає 100 повідомлень і руйнує чат. З антифлудом на цьому все й закінчується.\n\nАнтифлуд вживає заходів до тих, хто надсилає понад x повідомлень поспіль. Дії: ban/kick/mute\n\n*Команди адмінів*:\n× /flood: Поточні налаштування антифлуду.\n× /setflood `<number/off/no>`: Після скількох повідомлень діяти. '0', 'off' або 'no' вимикають.\n× /setfloodmode `<action type>`: Дія для флудера. Варіанти: ban/kick/mute\n× /delflood `<yes/no/on/off>`: Чи видаляти флуд-повідомлення."
