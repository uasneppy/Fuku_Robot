approvals_help_msg: "<b>👤 Approvals</b>\n\nIssue trusted residents a pass: immunity from the automatic anti-spam measures, without making them admins.\n\n<b>Admin Commands:</b>\n\n× /approve <code><reply/username/mention/userid></code> <code>[reason]</code>\n× /unapprove <code><reply/username/mention/userid></code>\n× /approval <code><reply/username/mention/userid></code>\n× /approved: List all approved users\n× /unapproveall: Remove all approvals (creator only)\n\nApproved users are exempt from: antiflood, blacklists, locks and CAPTCHA.\n"
