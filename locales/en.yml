help_help_msg: "<b>ℹ️ Help</b>\n\nFront desk. Start here to find your way around me.\n\n<b>Commands for everyone</b>\n• /start — shows the welcome message with the navigation menu.\n• /help — shows the help menu with the module list; <code>/help &lt;module&gt;</code> shows the details.\n• /about — shows who I am and my version.\n• /donate — tells you whether I accept donations."
languages_help_msg: "<b>🌐 Language</b>\n\nLanguage settings of the facility: change the language I speak here.\n\n<b>Commands for everyone</b>\n• /lang — shows the language buttons: pick a language for yourself or, as an admin, for the group."
locks_help_msg: "<b>🔐 Locks</b>\n\nLocks restrict what members can send. Sealed doors, basically. A lock on URLs deletes every message with a link, a lock on stickers deletes every sticker, and so on. A lock on bots stops members who are not admins from adding bots to the chat.\n\n<b>Admin commands</b>\n• /lock <code>&lt;type&gt;</code> — locks a type of message.\n• /unlock <code>&lt;type&gt;</code> — unlocks it.\n• /locks — shows the chat's locks.\n• /locktypes — lists the types you can lock.\n\n<b>Example</b>\n<code>/lock media</code> — locks every media message in the chat."
misc_help_msg: "<b>🧰 Misc</b>\n\nMiscellaneous instruments of the facility. Lightly used, well maintained.\n\n<b>Commands for everyone</b>\n• /info — shows your user info; works as a reply, or with a user ID or username.\n• /id — shows the group's ID, or, as a reply, the ID of the message's sender.\n• /ping — pings the Telegram server.\n• /tr <code>&lt;language code&gt; [text]</code> — translates the text, or the message you replied to.\n• /removebotkeyboard — removes a stuck bot keyboard from the chat.\n• /stat — counts all the messages in the chat.\n• /stickerid — as a reply to a sticker, shows its file ID.\n• /github <code>&lt;user|user/repo&gt;</code> — looks up a GitHub user or repository.\n• /wiki <code>&lt;query&gt;</code> — searches English Wikipedia.\n• /ud <code>&lt;term&gt;</code> — looks a term up in Urban Dictionary.\n• /runs — sends a random quip.\n\n<b>Admin commands</b>\n• /zombies — kicks the deleted accounts I know about."
mutes_help_msg: "<b>🔇 Mutes</b>\n\nSome residents talk too much. Silence orders are issued here.\n\n<b>Admin commands</b>\n• /mute <code>&lt;user&gt;</code> — mutes a user.\n• /smute <code>&lt;user&gt;</code> — mutes a user silently: no message in the group, and your command is deleted.\n• /dmute <code>&lt;user&gt;</code> — mutes a user and deletes the message you replied to.\n• /tmute <code>&lt;user&gt; &lt;time&gt;</code> — mutes a user for a time: <code>30m</code>, <code>2h</code>, <code>7d</code>.\n• /unmute <code>&lt;user&gt;</code> — unmutes a user.\n\n<b>Notes</b>\nName the user by @username or ID, or reply to their message. Time: <code>m</code> is minutes, <code>h</code> hours, <code>d</code> days.\n\n<b>Example</b>\n<code>/tmute @user 30m</code> — a mute for half an hour."
notes_help_msg: "<b>📝 Notes</b>\n\nNotes: the facility's filing cabinet. Save any small thing for your members: a phone number, a nice gif, a funny picture, anything.\n\n<b>Commands for everyone</b>\n• /get <code>&lt;name&gt;</code> — sends a note.\n• <code>#name</code> — the same as /get.\n• /notes — lists all the chat's notes.\n• /saved — the same as /notes.\n\n<b>Admin commands</b>\n• /save <code>&lt;name&gt; &lt;text&gt;</code> — saves a note under that name. As a reply, saves that message, media included.\n• /clear <code>&lt;name&gt;</code> — deletes a note.\n• /privatenotes — turns sending notes in private on or off: then I post a message with a button that opens the note in private.\n\n<b>Owner commands</b>\n• /clearall — deletes ALL the chat's notes. This cannot be undone."
pins_help_msg: "<b>📌 Pins</b>\n\nThe facility notice board. Keep your chat up to date with a pinned message.\n\n<b>Commands for everyone</b>\n• /pinned — shows the current pinned message.\n\n<b>Admin commands</b>\n• /pin — pins the message you replied to; add <code>loud</code> or <code>notify</code> to notify members.\n• /permapin <code>&lt;text&gt;</code> — pins a message that I post; it can carry formatting and buttons.\n• /unpin — unpins the current pinned message, or, as a reply, the message you replied to.\n• /unpinall — unpins every pinned message.\n• /antichannelpin <code>&lt;yes/no/on/off&gt;</code> — stops Telegram from auto-pinning posts of the linked channel; with no argument, shows the setting.\n• /cleanlinked <code>&lt;yes/no/on/off&gt;</code> — deletes messages sent by the linked channel.\n\n<b>Notes</b>\nWith /antichannelpin on, unpin with /unpin rather than by hand, or the old message is pinned again when the channel posts."
purges_help_msg: "<b>🧹 Purges</b>\n\nWaste disposal. Removed messages do not come back.\n\n<b>Admin commands</b>\n• /purge — deletes every message from the one you replied to up to this one.\n• /del — deletes the message you replied to.\n• /purgefrom — marks the message you replied to as the start of a purge.\n• /purgeto — within 30 seconds of /purgefrom, reply to another message to delete everything from the marked one to it.\n\n<b>Example</b>\n<code>/purge</code> as a reply — deletes that message and everything after it."
reports_help_msg: "<b>📣 Reports</b>\n\nNobody can watch a group around the clock. I can, but your admins need to be told when someone spams.\n\n<b>Commands for everyone</b>\n• /report <code>[reason]</code> — as a reply, reports the message to the admins.\n• @admin — the same as /report, but not a command.\n\n<b>Admin commands</b>\n• /reports <code>&lt;on/off/yes/no&gt;</code> — changes the report setting or shows it: your own in private, the group's in a group.\n• /reports <code>block</code> — as a reply, stops a user from using /report and @admin.\n• /reports <code>unblock</code> — as a reply, lets a user use /report and @admin again.\n• /reports <code>showblocklist</code> — lists the users who cannot use /report and @admin.\n\n<b>Notes</b>\nYou can only report by replying to a message; I reply that the admins have been told. @admin is not for calling admins for no reason. Neither works when an admin sends it."
rules_help_msg: "<b>📜 Rules</b>\n\nEvery facility runs on regulations. This module keeps yours clear.\n\n<b>Commands for everyone</b>\n• /rules — shows the chat's rules.\n\n<b>Admin commands</b>\n• /setrules <code>&lt;text&gt;</code> — sets the chat's rules.\n• /privaterules <code>&lt;yes/no/on/off&gt;</code> — sets whether the rules are sent in private.\n• /resetrules — clears the chat's rules.\n• /rulesbtn <code>&lt;text&gt;</code> — sets the text of the rules button.\n• /resetrulesbutton — puts the default text of the rules button back.\n• /resetrulesbtn — the same as /resetrulesbutton."
utils_string_handling_extract_time_invalid_time_amount: "Invalid time amount."
utils_string_handling_extract_time_invalid_time_type: "Invalid time unit. Expected m, h, d or w, got: %s"
warns_help_msg: "<b>🚩 Warnings</b>\n\nViolation notices keep residents in check before things get out of control. For automatic warnings, see the blacklist module.\n\n<b>Commands for everyone</b>\n• /warns — shows a user's warnings.\n\n<b>Admin commands</b>\n• /warn <code>&lt;user&gt; [reason]</code> — warns a user.\n• /dwarn <code>[reason]</code> — as a reply, warns the sender and deletes their message.\n• /swarn <code>&lt;user&gt; [reason]</code> — warns a user silently and deletes your command.\n• /rmwarn <code>&lt;user&gt;</code> — removes a user's latest warning.\n• /resetwarn <code>&lt;user&gt;</code> — resets a user's warnings to 0.\n• /warnings — shows the chat's warning settings.\n• /setwarnmode <code>&lt;ban/kick/mute&gt;</code> — sets the action when the warning limit is reached.\n• /setwarnlimit <code>&lt;number&gt;</code> — sets how many warnings come before the action.\n\n<b>Owner commands</b>\n• /resetallwarns — deletes every warning in the chat.\n\n<b>Example</b>\n<code>/warn @user For disobeying the rules</code> — a warning with a reason."
users_help_msg: "<b>📇 Users</b>\n\nResident registry. I keep an automatic record of users and chats. There are no commands here: I quietly note every message sender and every chat I am active in.\n\n<b>What I record</b>\n• User IDs, usernames and display names of every message sender.\n• Chat IDs and names of every group I am in.\n• Channel IDs, names and usernames of linked channels.\n\n<b>Notes</b>\n• A user's record is updated at most once per UserUpdateInterval, a chat's once per ChatUpdateInterval.\n• Other modules, such as /info, depend on the data collected here."

