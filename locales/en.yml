settings_help_msg: "<b>⚙️ Settings</b>\n\nOne control panel for the whole facility.\n\n<b>Admin commands</b>\n• /settings — opens the settings menu. In the group it opens here or in private; in a private chat with me it lists the groups you can manage.\n• /timezone — shows the group's timezone, or changes it: /timezone Europe/Kyiv, /timezone +2 or /timezone default.\n\n<b>Notes</b>\n• Pages: Staff Group, blocked sources, lockdown, captcha, antiflood, warnings, locks, blacklist, filters, welcome, goodbye, rules, notes, reactions, messages, member requirements, deletion, switches, language, timezone, log channel, anonymous admins and access.\n• Lists and messages are set by sending them to me in private.\n• A change in the menu is the same as its command: /linkstaff, /unlinkstaff, /unlockdown, /autolockdown, /captcha, /captchamode, /captchatime, /captchaaction, /setflood, /setfloodmode, /delflood, /setwelcome, /setgoodbye, /setrules and the rest. Member requirements have no command: the menu is the only way to set them.\n• Only the owner can open the menu, unless the owner lets admins in. The commands still work for admins.\n• A menu opened in the group answers only to whoever opened it. Every press checks that you are still allowed in and have the right its command needs."
