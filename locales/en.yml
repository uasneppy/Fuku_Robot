captcha_help_msg: "<b>🧩 Captcha</b>\n\nEntry control for the facility. New members prove they are human by solving a simple challenge before they can send messages.\n\n<b>Admin commands</b>\n• /captcha <code>&lt;on/off&gt;</code> — turns captcha on or off.\n• /captchamode <code>&lt;math/text/turnstile&gt;</code> — sets the captcha type.\n• /captchatime <code>&lt;1-10&gt;</code> — sets the time limit in minutes (default 2).\n• /captchaaction <code>&lt;kick/ban/mute&gt;</code> — sets the action for a failed check (default kick).\n• /captchamaxattempts <code>&lt;1-10&gt;</code> — sets the most attempts allowed (default 3).\n\n<b>Captcha types</b>\n• math — a simple arithmetic problem.\n• text — text shown in an image.\n• turnstile — a Cloudflare check on a web page.\n\n<b>Notes</b>\nWith captcha on, new members are muted until they pass. If they fail or run out of time, I take the configured action."
