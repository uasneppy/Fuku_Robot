connections_help_msg: "<b>🔗 Connections</b>\n\nRemote access to a facility. Connect to a group from your private chat with me and manage it without the group seeing it. Only admins can change things, but any member can look (banned or kicked users cannot).\n\n<b>Commands for everyone</b>\n• /connect <code>&lt;chat ID&gt;</code> — connects to the given group to view or edit its contents.\n• /disconnect — disconnects from the current group.\n• /reconnect — connects to the previous group again.\n• /connection — shows which group you are connected to.\n\n<b>Admin commands</b>\n• /allowconnect <code>&lt;yes/no&gt;</code> — lets members connect to the group, or not.\n\n<b>Notes</b>\nThe /id command in the group shows its ID. Do not be surprised if the ID is negative: all supergroups have negative IDs."
