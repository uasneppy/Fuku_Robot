# Backup/Restore module strings
backup_help_msg: "<b>📦 Backup</b>\n\nBack up and restore your group's settings. Facility records, filed and retrievable.\n\n<b>Admin commands</b>\n• /export — exports all the group's settings to a JSON file.\n• /export <code>notes filters rules</code> — exports only the modules you name.\n\n<b>Owner commands</b>\n• /import — as a reply to a backup file, restores the settings.\n• /import <code>notes filters</code> — imports only the modules you name.\n• /reset — resets every setting to its default.\n• /reset <code>warnings locks</code> — resets only the modules you name.\n\n<b>Notes</b>\nExport once per 5 minutes, import once per 10 minutes, reset once per hour."

