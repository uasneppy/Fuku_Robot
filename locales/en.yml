# AntiRaid module strings
antiraid_help_msg: |
  The old raid mode is retired, and nobody is temp-banned any more. I lock a group automatically when a raid starts, and admins can lock it by hand.

  × <code>/autolockdown</code>: See or change the automatic triggers, the join surge and the message flood.
  × <code>/lockdown</code> and <code>/unlockdown</code>: Lock this group by hand, and lift the lock.
  × <code>/autoantiraid N|off</code>: Still sets the join-surge threshold (3 to 500 joins in 60 seconds) and turns it on, or turns the join surge off.

  <code>/antiraid</code>, <code>/raidtime</code> and <code>/raidactiontime</code> only point here now and change nothing.
  A group's old auto threshold became its join-surge threshold.

# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: "Federations share a ban list across the groups you own. One removal, every facility.\n\n*Owner (PM):*\n× /newfed <name>: Create a federation (one per user).\n× /renamefed <name>: Rename your federation.\n× /delfed: Delete your federation (confirm).\n× /fedpromote /feddemote: Manage fed admins.\n× /fedreason on/off: Require a reason for fbans.\n× /fednotif on/off: PM the owner on fbans.\n× /subfed /unsubfed /fedsubs: Subscribe to another fed (max 5).\n× /fbanlist [csv|json|minicsv]: Export fbans.\n× /importfbans: Import from a replied CSV/JSON file.\n× /setfedlog /unsetfedlog: Federation log chat.\n\n*Group owner:*\n× /joinfed <fed_id>: Join this chat to a federation.\n× /leavefed: Leave the federation.\n× /quietfed on/off: Suppress passive fban notices.\n\n*Fed admins:*\n× /fban /unfban /funban: Federation ban/unban.\n× /fedstat /fbanstat: Check a user's fban.\n\n*Anyone:*\n× /fedinfo /fedadmins /chatfed /myfeds\n"
logchannels_help_msg: "Send admin actions to a dedicated log channel. Every facility keeps records.\n\n1. Add the bot to a channel as admin.\n2. In that channel, send /setlog.\n3. Forward that message to the group.\n\n*Admin commands:*\n× /unsetlog: Remove the log channel.\n× /logchannel: Show the current log channel.\n× /logcategories: List categories.\n× /log <category>: Enable a category.\n× /nolog <category>: Disable a category.\n\nCategories: settings, admin, user, automated, reports, other.\n"
