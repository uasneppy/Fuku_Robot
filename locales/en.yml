admin_help_msg: "Supervisor staffing, handled by me. Promote and demote users with the admin module.\n\n*User Commands:*\n× /adminlist: List the admins in the current chat.\n\n*Admin Commands:*\n× /promote `<reply/username/mention/userid>`: Promote a user.\n× /demote `<reply/username/mention/userid>`: Demote a user.\n× /title `<reply/username/mention/userid>` `<custom title>`: Set a custom title for a user\n× /setgtitle <title>: Change the group title.\n× /setgpic: Reply to a photo to set it as the group picture.\n× /setgdesc [text]: Change the group description."
