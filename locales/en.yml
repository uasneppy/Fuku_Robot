# AI spam filter module strings
aispam_help_msg: "<b>🤖 AI spam</b>\n\nAn opt-in filter: an AI model judges every message in this chat and deletes the ones it is confident are spam. Nothing else happens: no warning, no mute, no reply, no notice, and the sender is never told.\n\n<b>Admin commands</b>\n• /aispam — shows whether the filter is on, and exactly what is sent to the model.\n• /aispam <code>&lt;on/off&gt;</code> — turns the filter on or off for this chat.\n\n<b>Notes</b>\n• Messages in English are deleted from 80% confidence, messages in any other language from 90%, because the model is English-first.\n• The filter is off in every chat until an admin turns it on, and it needs my operator to have set up an API key."
aispam_status_enabled: "The AI spam filter is <b>on</b> in this chat."
aispam_status_disabled: "The AI spam filter is <b>off</b> in this chat. Turn it on with <code>/aispam on</code>."
aispam_status_key_missing: "⚠️ Unavailable: my operator has not configured an API key, so no message is being checked."
aispam_status_globally_disabled: "⚠️ Unavailable: my operator has switched the AI spam filter off globally, so no message is being checked."
aispam_data_notice: "<b>What is sent for each checked message</b>\n• The chat's title, description, rules and language.\n• The sender's profile: days since I first saw them, messages in the last hour and their warnings.\n• The message text or caption, the domains it links to, and whether it is a forward or a reply.\n• The sender's few most recent messages in this chat.\n\nNo names, usernames, user IDs, phone numbers or messages from other chats are sent."
aispam_enabled_success: "✅ The AI spam filter is now <b>on</b>. Messages the model is confident are spam will be deleted."
aispam_disabled_success: "❌ The AI spam filter is now <b>off</b>."
aispam_no_key: "❌ I cannot turn the AI spam filter on: my operator has not configured an API key. Nothing has changed."
aispam_globally_disabled: "❌ I cannot turn the AI spam filter on: my operator has switched it off globally. Nothing has changed."
aispam_invalid_option: "Unrecognised input. I accept <code>on</code>/<code>off</code>/<code>yes</code>/<code>no</code> only."
aispam_breaker_notice: "⚠️ AI spam checks are paused in this chat for a few minutes after repeated failures from the AI provider. They resume on their own, and the filter stays on."

# Admin module extended documentation
admin_extended_docs: "<b>Anonymous Admin Support</b>\n\nThe <code>/anonadmin</code> command lets group owners toggle anonymous admin recognition:\n<code>/anonadmin on</code> - Enable anonymous admin checks\n<code>/anonadmin off</code> - Disable anonymous admin checks\n\nWhen enabled, I ask anonymous accounts to verify before an admin action.\n\n<b>How Anonymous Admin Verification Works:</b>\n1. I detect that the sender is GroupAnonymousBot\n2. The original message is cached with a 20-second TTL\n3. A \"Verify Admin\" button is sent to the chat\n4. The user who presses it is verified as an admin and the command runs\n5. The button expires after 20 seconds if nobody verifies\n\n<b>Supported Commands:</b>\nAdmin: /promote, /demote, /title\nBans: /ban, /dban, /sban, /tban, /unban\nMutes: /mute, /smute, /dmute, /tmute, /unmute\nPins: /pin, /unpin, /permapin, /unpinall\nPurges: /purge, /del\nWarns: /warn, /swarn, /dwarn"

admin_notes_docs: "<b>Security Notes</b>\n• All user-controlled input is HTML-escaped to prevent injection attacks\n• Admin permission changes run with proper error handling and panic recovery"

# Antiflood extended docs
antiflood_notes_docs: "<b>Default Behaviour</b>\nAntiflood is <b>disabled by default</b>. Turn it on yourself with <code>/setflood &lt;number&gt;</code>."

# Locks module extended documentation
locks_types_docs: "<b>Permission Locks</b> (16 types)\n<code>sticker</code> - Block stickers\n<code>audio</code> - Block audio files\n<code>voice</code> - Block voice messages\n<code>document</code> - Block documents\n<code>video</code> - Block videos\n<code>videonote</code> - Block video notes\n<code>contact</code> - Block contacts\n<code>photo</code> - Block photos\n<code>gif</code> - Block GIFs\n<code>url</code> - Block URLs\n<code>bots</code> - Prevent adding bots\n<code>forward</code> - Block forwards\n<code>game</code> - Block games\n<code>location</code> - Block locations\n<code>rtl</code> - Block RTL text\n<code>anonchannel</code> - Block channel messages\n\n<b>Restriction Locks</b> (6 types)\n<code>messages</code> - Block all messages\n<code>comments</code> - Block non-member comments\n<code>media</code> - Block all media\n<code>other</code> - Block games/stickers/GIFs\n<code>previews</code> - Block URL previews\n<code>all</code> - Block everything"

locks_notes_docs: "<b>Technical Notes</b>\n• Locks are enforced in real time\n• Admins are exempt from all locks\n• Locks survive my restarts\n• The cache is cleared on updates"

# Languages extended docs
languages_extended_docs: "<b>How It Works</b>\n• <b>Private Chats:</b> Any user can change their personal language\n• <b>Group Chats:</b> Only admins can change the group language\n\nLanguage preferences are cached for performance and stored separately for users and groups."

# Greetings extended docs
greetings_extended_docs: "<b>Captcha Integration</b>\nWhen the Captcha module is enabled:\n1. New members are muted when they join\n2. A captcha challenge is sent instead of the welcome\n3. After verification, the welcome message is sent\n4. A failed verification applies the captcha action"

# Extended documentation locale keys - Notes module
notes_extended_docs: "<b>Features:</b>\n• <b>Text &amp; Media Support</b>: Save text messages, photos, videos, documents and more\n• <b>Custom Buttons</b>: Add inline keyboard buttons to notes\n• <b>Formatting Options</b>: Control how a note is shown and behaves\n• <b>Admin-Only Notes</b>: Restrict certain notes to admins\n• <b>Private Notes</b>: Send notes to users in a private message\n• <b>Web Preview Control</b>: Turn link previews on or off\n• <b>Protected Content</b>: Stop note content from being forwarded\n\n<b>Note Formatting Options:</b>\nWhen saving a note, special tags control its behaviour:\n• <code>{private}</code> - The note is only sent in a private message, never in the group\n• <code>{noprivate}</code> - The note is only sent in the group, never in a private message\n• <code>{admin}</code> - Only admins can get the note\n• <code>{protect}</code> - The content cannot be forwarded\n• <code>{nonotif}</code> - Sent without a notification sound\n• <code>{nopreview}</code> - No link preview\n\n<b>Private Notes Mode:</b>\nWith private notes on (<code>/privatenotes on</code>), all notes go to users in a private message instead of the group. The group chat stays clean.\n\nA single note can override this:\n• <code>{private}</code> - Always send privately\n• <code>{noprivate}</code> - Always send in the group\n\n<b>Raw Note (No Formatting):</b>\nTo see a note's raw content without formatting (for editing):\n<code>/get notename noformat</code>"

notes_permissions_docs: "<b>Required Permissions:</b>\n• Save/Clear notes: Change Group Info\n• View admin notes: Admin status\n• Clear all notes: Chat Owner\n• Get regular notes: Any user"

# Extended documentation locale keys - Pins module
pins_extended_docs: "<b>Features:</b>\n\n<b>Anti-Channel Pin:</b>\nWhen enabled, I unpin any message that the linked channel auto-pins. Useful when you want control over what gets pinned in your group.\n\n<b>Important:</b> with anti-channel pin on, always use the <code>/unpin</code> command instead of unpinning manually in Telegram. A manual unpin makes the old message get pinned again when the channel posts.\n\n<b>Clean Linked:</b>\nWhen enabled, I delete every message sent to the group from the linked channel. Your group chat stays free of cross-posted channel content.\n\n<b>Permapin:</b>\nCreate custom pinned messages with:\n• Text with HTML/Markdown formatting\n• Inline buttons with URLs\n• Media attachments (photos, documents, stickers, audio, video, voice notes, video notes)\n• All standard message fillings ({first}, {chatname}, etc.)\n\n<b>Supported via Connection:</b>\nThese commands work when connected to a chat via <code>/connect</code>:\n• <code>/antichannelpin</code>\n• <code>/cleanlinked</code>"

pins_notes_docs: "<b>Notes:</b>\n• <code>/unpinall</code> asks for confirmation before unpinning all messages\n• Permapin supports every media type Telegram can pin\n• Anti-channel pin and clean linked settings are stored per chat and survive my restarts\n\n<b>Required Permissions:</b>\n<b>Me:</b> I must be an admin with \"Pin Messages\" permission\n<b>User:</b> Most commands require admin with \"Pin Messages\" permission"

# Extended documentation locale keys - Purges module
purges_extended_docs: "<b>Range Deletion with purgefrom/purgeto:</b>\nWhen you need more control over what gets deleted:\n\n1. Reply to the <b>first</b> message of the range:\n<code>/purgefrom</code>\nI confirm the message is marked (expires after 30 seconds).\n\n2. Reply to the <b>last</b> message of the range:\n<code>/purgeto</code>\nAll messages between the two markers (inclusive) are deleted.\n\nUseful when you cannot easily scroll to the starting point or want to check the range before deleting.\n\n<b>Limits and Restrictions:</b>\n• <b>Maximum messages per purge:</b> 1000 messages\n• <b>Message age limit:</b> Messages older than 48 hours may not be deletable (Telegram API restriction)\n• <b>Permissions required:</b> Both the user and I need the \"Delete Messages\" permission"

purges_notes_docs: "<b>Notes:</b>\n• The <code>/purgefrom</code> marker expires after 30 seconds if no <code>/purgeto</code> follows\n• Large ranges are deleted concurrently for better performance\n• Status messages (how many messages were deleted) delete themselves after 3 seconds\n• Messages already deleted are skipped without errors"

# Extended documentation locale keys - Reports module
reports_extended_docs: "<b>How It Works:</b>\n\n<b>Reporting a Message:</b>\n1. <b>Reply to the offending message</b> with <code>/report</code> or mention <code>@admin</code>\n2. I send a notification mentioning every admin who has reports enabled\n3. The notification has action buttons for quick moderation\n\n<b>Admin Action Buttons:</b>\n• <b>➡ Message</b> - Link to the reported message\n• <b>⚠ Kick</b> - Kick the reported user (they can rejoin)\n• <b>⛔️ Ban</b> - Permanently ban the reported user\n• <b>❎ Delete Message</b> - Delete the reported message\n• <b>✔️ Mark Resolved</b> - Mark the report as resolved without action\n\n<b>Private and Group Settings:</b>\n• <b>In private:</b> <code>/reports on/off</code> toggles whether YOU receive report notifications\n• <b>In Group:</b> <code>/reports on/off</code> toggles whether reporting is enabled for that group"

reports_permissions_docs: "<b>Who Can Report?</b>\n✅ Regular users\n❌ Admins (no need to report to themselves)\n❌ Blocked users\n❌ Anonymous channels / Telegram system accounts\n\n<b>Who Can Be Reported?</b>\n✅ Regular users\n❌ Me\n❌ Admins (protected from reports)\n❌ Anonymous channels / Telegram system accounts"

# Extended documentation locale keys - Rules module
rules_extended_docs: "<b>Features:</b>\n\n<b>Private Rules:</b>\nTurn on private rules (<code>/privaterules on</code>) to send the rules in private instead of in the group. The group chat stays clean.\n\n<b>Custom Rules Button:</b>\nSet a custom button text (max 30 characters):\n<code>/rulesbtn View Rules</code>\n\nReset to default:\n<code>/resetrulesbtn</code>\n\n<b>Setting Rules:</b>\nSet rules by giving the text directly or by replying to a message:\n<code>/setrules Be respectful to all members.</code>\n\nOr reply to a message:\n<code>/setrules</code>\n\n<b>Required Permissions:</b>\n• User commands: Available to all users\n• Admin commands: Require admin permissions in the chat"

# Extended documentation locale keys - Warns module
warns_extended_docs: "<b>Default Settings:</b>\n• <b>Default warn limit:</b> 3 warnings\n• <b>Default warn mode:</b> mute\n\n<b>Available Warn Modes:</b>\n• <code>ban</code> - Permanently ban the user from the chat\n• <code>kick</code> - Kick the user (they can rejoin)\n• <code>mute</code> - Mute the user (cannot send messages)\n\n<b>Silent and Delete Warnings:</b>\n• <code>/swarn</code> - Delete your command and warn silently\n• <code>/dwarn</code> - Delete the user's message and warn them"

warns_permissions_docs: "<b>Permission Requirements:</b>\n• <code>/warn</code>, <code>/dwarn</code>, <code>/swarn</code>: I am admin + user is admin with restrict\n• <code>/rmwarn</code>, <code>/unwarn</code>: I am admin + user is admin\n• <code>/resetwarn</code>, <code>/resetwarns</code>: I am admin + user is admin\n• <code>/resetallwarns</code>: Chat owner only\n• <code>/setwarnmode</code>, <code>/setwarnlimit</code>: I am admin + user is admin\n• <code>/warnings</code>: I am admin + user is admin\n• <code>/warns</code>: Any user (disableable)"

warns_notes_docs: "<b>Notes:</b>\n• When a user reaches the warn limit, the configured action (ban/kick/mute) is applied automatically\n• Warning reasons are stored and shown when checking a user's warns\n• <code>/warns</code> is the only command in this module admins can disable\n• Anonymous channel posts cannot be warned\n• Admins cannot be warned"

# Extended documentation locale keys - Mutes module
mutes_extended_docs: "<b>Time Format for Temporary Mutes:</b>\n• <code>m</code> = minutes (e.g., <code>30m</code>)\n• <code>h</code> = hours (e.g., <code>2h</code>)\n• <code>d</code> = days (e.g., <code>1d</code>)\n\n<b>Mute Variants:</b>\n• <code>/mute</code> - Standard mute with an optional reason\n• <code>/smute</code> - Silent mute (deletes your command message)\n• <code>/dmute</code> - Delete-mute (mutes the user and deletes their message)\n• <code>/tmute</code> - Temporary mute for the given duration\n\n<b>Required Permissions:</b>\n<b>Admin only commands.</b> Users running these commands must have:\n• Admin status in the chat\n• Permission to restrict members\n\nI must also be an admin with permission to restrict members."

# Extended documentation locale keys - Filters module
filters_extended_docs: "<b>Advanced Features:</b>\n\n<b>Random Responses:</b>\nSeparate several responses with <code>%%%</code>. One is picked at random:\n<code>/filter hello Hi there!%%%Hello!%%%Hey, how are you?</code>\n\n<b>Media Filters:</b>\nReply to any media (photo, video, document, sticker, etc.) with <code>/filter trigger</code> to make a filter that sends that media.\n\n<b>Noformat Mode:</b>\nAdmins can see the raw filter content (with formatting codes) by adding <code>noformat</code> after the trigger:\n<code>hello noformat</code>\nUseful for debugging filters or checking button setups.\n\n<b>Filter Buttons:</b>\nYou can add inline buttons to your filters:\n<code>/filter hello Hello! Check out these links:\n[Button 1](buttonurl:https://example.com)\n[Button 2](buttonurl:https://example2.com)</code>"

filters_technical_docs: "<b>How Filters Work:</b>\n1. When a message arrives, I fetch all filters of the chat with an optimised cached query\n2. The Aho-Corasick algorithm matches every filter keyword against the message text\n3. The first matching filter triggers a response\n4. Filters support text, media and button responses\n\n<b>Overwrite Confirmation:</b>\nWhen you add a filter that already exists, I ask for confirmation before overwriting. The confirmation expires after 5 minutes.\n\n<b>Cache Behaviour:</b>\n• Filter lists are cached for 15 minutes per chat\n• The cache is cleared automatically when filters are added or removed"

filters_limits_docs: "<b>Limits:</b>\n• Maximum 150 filters per chat\n• Maximum 100 characters per filter keyword\n• Filter keywords are stored in lowercase\n\n<b>Required Permissions:</b>\n• <code>/filter</code>, <code>/addfilter</code>: Admin with Change Info permission\n• <code>/stop</code>, <code>/rmfilter</code>, <code>/removefilter</code>: Admin with Change Info permission\n• <code>/stopall</code>: Chat Owner only\n• <code>/filters</code>: Available to all users"

# Extended documentation locale keys - Captcha module
captcha_extended_docs: "<b>How It Works:</b>\n1. When captcha is enabled, new members are automatically muted upon joining\n2. A captcha challenge is sent to the new member\n3. The user must select the correct answer from the provided options, or pass the web check\n4. If successful, the user is unmuted and can participate in the group\n5. If they fail or timeout, the configured action is taken (kick, ban, or mute)\n\n<b>Captcha Types:</b>\n• <b>Math</b>: Solve simple arithmetic problems (addition, subtraction, multiplication)\n• <b>Text</b>: Identify text shown in a distorted image\n• <b>Turnstile</b>: Pass a Cloudflare check on a web page\n\n<b>Held Messages:</b>\nWhen a user is completing the captcha, any messages they try to send are stored and deleted. Admins can:\n• View what messages a user tried to send using <code>/captchapending</code>\n• Clear stored messages using <code>/captchaclear</code>\n\nThis helps identify potential spam attempts before users complete verification."

captcha_permissions_docs: "<b>What I Need:</b>\n• Ban users (for kick/ban actions)\n• Restrict members (for muting during verification)\n• Delete messages (for cleaning up captcha messages)\n\n<b>Failure Actions:</b>\n• <code>kick</code> - Remove the user while allowing them to rejoin\n• <code>ban</code> - Permanently ban the user\n• <code>mute</code> - Keep the user muted for 24 hours"

# Extended documentation locale keys - Blacklists module
blacklists_extended_docs: "<b>Available Actions:</b>\nThese actions can be set with <code>/blaction</code>:\n• <code>none</code> - Only deletes the message, nothing else\n• <code>warn</code> - Deletes the message and warns the user (default)\n• <code>mute</code> - Deletes the message and mutes the user\n• <code>kick</code> - Deletes the message and kicks the user (they can rejoin)\n• <code>ban</code> - Deletes the message and permanently bans the user\n\n<b>Note:</b>\nThe default mode for Blacklist is <b>warn</b>, which deletes the message and warns the user.\n\n<b>Commands:</b>\n• <code>/addblacklist &lt;trigger&gt;</code> - Blacklists the word in the current chat\n• <code>/rmblacklist &lt;trigger&gt;</code> - Removes the word from the chat's blacklisted words\n• <code>/blaction &lt;mute/kick/ban/warn/none&gt;</code> - Sets the action I take when a blacklisted word is detected\n• <code>/remallbl</code> - Removes all blacklisted words from chat (Owner Only)"

# Extended documentation locale keys - Disabling module
disabling_extended_docs: "<b>Key Features:</b>\n• Disable specific bot commands for non-admin users\n• Admins can always use disabled commands\n• Optional automatic deletion of disabled command messages\n• Disable several commands at once\n\n<b>Disable Multiple Commands:</b>\n<code>/disable adminlist rules info</code>\nDisables <code>/adminlist</code>, <code>/rules</code> and <code>/info</code> at once.\n\n<b>Toggle Command Deletion:</b>\n<code>/disabledel on</code> - Disabled commands will now be deleted.\n<code>/disabledel off</code> - Disabled commands will no longer be deleted.\n<code>/disabledel</code> - Check the current deletion setting."

disabling_notes_docs: "<b>Important Notes:</b>\n• <b>Admin Bypass:</b> Disabled commands only affect non-admin users. All admins can still use any command.\n• <b>Connection Support:</b> Disabled commands are still reachable through the <code>/connect</code> feature for connected chats.\n• <b>Multiple Commands:</b> Both <code>/disable</code> and <code>/enable</code> accept several command names in one message.\n• <b>Error Handling:</b> If some commands fail to disable/enable, you are told which ones succeeded and which failed.\n\n<b>Required Permissions:</b>\n• <code>/disable</code>, <code>/enable</code>, <code>/disabledel</code>: Admin only\n• <code>/disableable</code>, <code>/disabled</code>: All users (but <code>/disabled</code> can be disabled)"

# Extended documentation locale keys - Help module
help_extended_docs: "<b>Navigation System:</b>\nThe Help module is my main entry point and navigation. When a user sends <code>/start</code> in a private chat, I show a welcome message with an inline keyboard for navigating to the modules.\n\nThe <code>/help</code> command shows the module list. Pressing a module button shows that module's commands and usage. When <code>/help</code> is used in a group chat, I send the user to a private chat for detailed help, so the group stays clean.\n\n<code>/about</code> shows who I am and my version, while <code>/donate</code> says whether I accept donations."

# Extended documentation locale keys - Devs module
devs_extended_docs: "<b>Team Hierarchy:</b>\nThe Devs module provides management and diagnostic commands restricted to my internal team. The team has three tiers with descending privilege levels.\n\n<b>Tier 1 — Owner:</b> Set with the <code>OWNER_ID</code> environment variable at deployment. Full control: manage the team roster, all diagnostic commands, all team commands.\n\n<b>Tier 2 — Sudo / Dev:</b> Assigned by the owner with <code>/addsudo</code> or <code>/adddev</code>. Diagnostic commands: my stats, chat info, chat management.\n\n<b>Tier 3 — Team Member:</b> Automatically includes the owner + all sudo + all dev users. Can only view the team roster with <code>/teamusers</code>.\n\n<b>Note:</b> Sudo and Dev have identical command access. The distinction exists for organisational purposes.\n\n<b>Important:</b> These commands are not visible in the public help menu and silently ignore unauthorised users."

# Extended documentation locale keys - Users module
users_extended_docs: "<b>Background Tracker:</b>\nThe Users module is a passive background module with no user-facing commands. I run it quietly on every message I process, tracking every message sender and every chat I am active in.\n\n<b>What It Tracks:</b>\n• User IDs, usernames and display names of every message sender\n• Chat IDs and names of every group I am in\n• Channel IDs, names and usernames of linked channels\n\n<b>Rate Limiting:</b>\n• User updates: limited to one per <code>UserUpdateInterval</code>\n• Chat updates: limited to one per <code>ChatUpdateInterval</code>\n• This prevents excessive database writes while keeping the data reasonably current\n\n<b>Passive Operation:</b>\n• Runs as a message watcher at handler group -1 (fires before all command handlers)\n• No user interaction required — fully automatic\n• Other modules, such as <code>/info</code>, depend on the data this module collects"

