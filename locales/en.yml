antiflood_help_msg: "<b>🌊 Antiflood</b>\n\nSomeone joins, sends 100 messages and ruins the chat. With antiflood, that stops here: I act on anyone who sends too many messages in a row.\n\n<b>Admin commands</b>\n• /flood — shows the antiflood settings.\n• /setflood <code>&lt;number/off/no&gt;</code> — sets after how many messages in a row I act; <code>0</code>, <code>off</code> or <code>no</code> turn antiflood off.\n• /setfloodmode <code>&lt;action&gt;</code> — sets the action for a flooder: <code>ban</code>, <code>kick</code> or <code>mute</code>.\n• /delflood <code>&lt;yes/no/on/off&gt;</code> — turns deleting the flood messages on or off.\n\n<b>Example</b>\n<code>/setflood 5</code> — act after five messages in a row."
