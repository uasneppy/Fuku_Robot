# AntiRaid module strings
antiraid_help_msg: "<b>🛡 Anti-raid</b>\n\nThe old raid mode is retired, and nobody is temp-banned any more. I lock a group on my own when a raid starts, and admins can lock it by hand.\n\n<b>Admin commands</b>\n• /autolockdown — shows or changes the automatic triggers: the join surge and the message flood.\n• /lockdown and /unlockdown — lock this group by hand and lift the lockdown.\n• /autoantiraid <code>N|off</code> — sets the join-surge threshold (3 to 500 joins in 60 seconds) and turns it on, or turns the join surge off.\n\n<b>Notes</b>\n/antiraid, /raidtime and /raidactiontime only point here now and change nothing. A group's old auto threshold became its join-surge threshold."

# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: "<b>🏛 Federations</b>\n\nA federation shares one ban list across the groups you own. One ban, every facility.\n\n<b>Federation owner commands (in private)</b>\n• /newfed <code>&lt;name&gt;</code> — creates a federation (one per user).\n• /renamefed <code>&lt;name&gt;</code> — renames your federation.\n• /delfed — deletes your federation, after a confirmation.\n• /fedpromote and /feddemote — manage the federation's admins.\n• /fedreason <code>on/off</code> — requires a reason for fbans.\n• /fednotif <code>on/off</code> — tells the owner about fbans in private.\n• /subfed, /unsubfed and /fedsubs — subscribe to another federation (up to 5).\n• /fbanlist <code>[csv|json|minicsv]</code> — exports the fbans.\n• /importfbans — imports fbans from the CSV or JSON file you replied to.\n• /unsetfedlog — clears the federation log chat.\n\n<b>Federation log chat</b>\n• /setfedlog — in a group, makes that group the federation log; you must be an admin there.\n• For a channel, post <code>/setfedlog &lt;fed_id&gt;</code> in it (I must be an admin there), then within 1 hour forward that post to me in private or to a group, from the federation owner's account.\n\n<b>Group owner commands</b>\n• /joinfed <code>&lt;fed_id&gt;</code> — joins this group to a federation.\n• /leavefed — takes the group out of the federation.\n• /quietfed <code>on/off</code> — hides passive fban notices.\n\n<b>Federation admin commands</b>\n• /fban, /unfban and /funban — ban and unban in the federation.\n• /fedstat and /fbanstat — show a user's fbans.\n\n<b>Commands for everyone</b>\n• /fedinfo, /fedadmins, /chatfed and /myfeds — show information about federations."
logchannels_help_msg: "<b>🧾 Log channel</b>\n\nSend admin actions to a dedicated log channel. Every facility keeps records.\n\n<b>How to set it up</b>\n• Add me to a channel as an admin.\n• In that channel, send /setlog.\n• Forward that message to the group.\n\n<b>Admin commands</b>\n• /unsetlog — removes the log channel.\n• /logchannel — shows the current log channel.\n• /logcategories — lists the categories.\n• /log <code>&lt;category&gt;</code> — turns a category on.\n• /nolog <code>&lt;category&gt;</code> — turns a category off.\n\n<b>Notes</b>\nCategories: <code>settings</code>, <code>admin</code>, <code>user</code>, <code>reports</code>."
