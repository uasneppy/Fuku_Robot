bans_help_msg: "<b>🔨 Bans</b>\n\nSome residents have to leave the facility. This module removes them from the chat and lets them back when they behave.\n\n<b>Commands for everyone</b>\n• /kickme — kicks you from the chat.\n• /banme — bans you from the chat.\n\n<b>Admin commands</b>\n• /ban <code>&lt;user&gt;</code> — bans a user.\n• /sban <code>&lt;user&gt;</code> — bans a user silently: no message in the group, and your command is deleted.\n• /dban <code>&lt;user&gt;</code> — bans a user and deletes the message you replied to.\n• /tban <code>&lt;user&gt; &lt;time&gt;</code> — bans a user for a time: <code>30m</code>, <code>2h</code>, <code>7d</code>.\n• /skick <code>&lt;user&gt;</code> — kicks a user silently and deletes your command.\n• /unban <code>&lt;user&gt;</code> — unbans a user.\n• /unbanall — unbans every known user, after the owner confirms.\n• /restrict — shows buttons to kick, ban or mute.\n• /unrestrict — shows buttons to unmute or unban.\n\n<b>Notes</b>\nName the user by @username or ID, or reply to their message. Time: <code>m</code> is minutes, <code>h</code> hours, <code>d</code> days.\n\n<b>Example</b>\n<code>/tban @user 2h</code> — a ban for two hours."
