# Reactions module strings
reactions_help_msg: "<b>👍 Reactions</b>\n\nI put a reaction on every message that contains a chosen word. Morale is a facility resource too.\n\n<b>Admin commands</b>\n• /addreaction <code>&lt;word&gt; &lt;emoji&gt;</code> — adds a reaction to a word.\n• /removereaction <code>&lt;word&gt;</code> — removes the reaction of a word.\n• /reactions — lists the chat's reactions.\n• /resetreactions — removes every reaction.\n\n<b>Notes</b>\nThe emoji must be one of Telegram's reactions. A group can have up to 100 reactions. You can also manage them in /settings in a private chat.\n\n<b>Example</b>\n<code>/addreaction hello 👋</code> — I react with 👋 when someone writes \"hello\"."

