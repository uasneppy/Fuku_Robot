connections_help_msg: "Remote access to a facility. Connect to a chat's database and add things to it without the chat seeing it. You need to be an admin to add things, but any member can view your data (banned or kicked users cannot).\n\n*Commands*:\n× /connect `<chatid>`: Connect to the given chat to view or edit its contents.\n× /disconnect: Disconnect from the current chat.\n× /reconnect: Reconnect to the previously connected chat\n× /connection: Information about the currently connected chat.\n\n*Admin Commands:*\n× /allowconnect <yes/no>: Allow users to connect to chats, or not.\n\nGet the chat id with the /id command in your chat. Do not be surprised if the id is negative; all super groups have negative ids."
