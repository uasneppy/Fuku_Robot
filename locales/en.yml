blacklists_help_msg: "<b>🔤 Blacklist</b>\n\nForbidden words, deleted on sight. Contraband is not tolerated in this facility.\n\n<b>Commands for everyone</b>\n• /blacklists — lists the chat's blacklisted words.\n\n<b>Admin commands</b>\n• /addblacklist <code>&lt;word&gt;</code> — adds a word to the blacklist.\n• /rmblacklist <code>&lt;word&gt;</code> — removes a word from the blacklist.\n• /blaction <code>&lt;mute/kick/ban/warn/none&gt;</code> — sets what I do when I find a blacklisted word.\n• /blacklistaction — the same as /blaction.\n\n<b>Owner commands</b>\n• /remallbl — removes every word from the blacklist.\n\n<b>Notes</b>\nThe default action is <code>warn</code>: the message is deleted and its sender is warned."
