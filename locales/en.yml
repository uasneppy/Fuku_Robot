settings_mreq_hint_letters: "The name rules go by letters in the first and last name, never the username: Russian means ы, ъ, э or ё, Arabic means Arabic script, Chinese means Chinese characters. They can also catch related languages, such as Belarusian, Bulgarian, Persian or Japanese names."
settings_mreq_hint_blank: "A last name made only of invisible or blank characters counts as no last name."
settings_mreq_hint_photo: "Warn or Mute suits this rule better than Kick or Ban: a member can fix a hidden photo only in their own privacy settings."
settings_mreq_hint_lookup: "The channel rule works only when this group has a linked channel and I am an administrator of it. When Telegram does not answer, nobody is punished."
settings_mreq_hint_ai: "Only the first name, last name and username go to Anthropic's Claude, never messages. The AI can be wrong, so Warn or Mute suits this rule better than Kick or Ban."
settings_mreq_hint_join: "Every member is checked at their next message. With Check on join on, new members are also checked when they join, right after the captcha. Admins, approved users, bots and messages sent as a channel are never checked."
settings_mreq_hint_delete: "Delete messages removes every message from a member who breaks a rule, also while they are muted or warned for it."
settings_mreq_hint_mute: "Only a mute comes with an “I fixed it” button: once the member meets the requirements and taps it, I unmute them and send the welcome. A kicked member can join again; a banned one waits for an admin."
