disabling_help_msg: "<b>🚫 Disabling</b>\n\nCommand restrictions. Switch a command off and members who are not admins cannot use it here. I can also delete their attempts, which keeps the chat free of stray commands.\n\n<b>Admin commands</b>\n• /disable <code>&lt;command&gt;</code> — stops members from using a command in this group.\n• /enable <code>&lt;command&gt;</code> — lets members use a command again.\n• /disableable — lists the commands that can be disabled.\n• /disabledel <code>&lt;yes/no/on/off&gt;</code> — turns deleting disabled commands sent by members on or off.\n• /disabled — lists the disabled commands of this chat.\n\n<b>Notes</b>\nA disabled command is disabled only for members who are not admins; admins can still use it. Disabled commands are still reachable through /connect."
devs_help_msg: "<b>🛠 Developers</b>\n\nMaintenance access. Management and diagnostic commands for my owner and trusted developers only. Regular users never see them.\n\n<b>Team commands</b>\n• /stats — shows my statistics and system info.\n• /teamusers — lists the team members.\n\n<b>Owner commands</b>\n• /addsudo — grants a user sudo rights.\n• /adddev — grants a user developer rights.\n• /remsudo — takes a user's sudo rights away.\n• /remdev — takes a user's developer rights away.\n\n<b>Diagnostics</b>\n• /chatinfo — shows detailed information about a chat.\n• /chatlist — builds and sends a list of all active chats.\n• /leavechat — makes me leave a given chat."
filters_help_msg: "<b>🔁 Filters</b>\n\nFilters are automatic replies. Every time someone writes one of your trigger words, I reply with your text; case does not matter. You can use this to make your own commands.\n\n<b>Commands for everyone</b>\n• /filters — lists all the chat's filters.\n\n<b>Admin commands</b>\n• /filter <code>&lt;trigger&gt; &lt;reply&gt;</code> — every time someone writes the trigger, I reply with this text. Quote a trigger of several words.\n• /stop <code>&lt;trigger&gt;</code> — stops my reply to a trigger.\n\n<b>Owner commands</b>\n• /stopall — stops ALL filters in the chat. This cannot be undone.\n\n<b>Notes</b>\n• To save a file, image, gif or any other attachment, reply to it with <code>/filter &lt;trigger&gt;</code>.\n• A filter that only admins can trigger has <code>{admin}</code> in its text.\n\n<b>Example</b>\n<code>/filter \"hello friend\" Hello back! Long time no see!</code> — a filter of two words."
formatting_fillings: "<b>Fillings</b>\n\nYou can customise your messages with contextual data. For example, mention a user by name in the welcome message, or in a filter.\nFillings work in notes too.\n\n<b>Supported fillings:</b>\n- <code>{first}</code>: The user's first name.\n- <code>{last}</code>: The user's last name.\n- <code>{fullname}</code>: The user's full name.\n- <code>{username}</code>: The user's username. If they have none, mentions the user instead.\n- <code>{mention}</code>: Mentions the user by first name.\n- <code>{id}</code>: The user's ID.\n- <code>{chatname}</code>: The chat's name.\n- <code>{rules}</code>: Adds a Rules button to the message.\n- <code>{protect}</code>: Stops the content from being shared.\n- <code>{preview}</code>: Turns on previews in the message.\n- <code>{nonotif}</code>: Turns off the notification for that message."
formatting_help_msg: "<b>✍️ Formatting</b>\n\nXenobot-72 supports many formatting options to make your messages more expressive. Press the buttons below to see them."
formatting_markdown: "<b>Markdown formatting</b>\n\nYou can format your message with <b>bold</b>, <i>italics</i>, <u>underline</u> and more. Go ahead and experiment.\n\n<b>What is supported</b>\n• <code>&#96;code words&#96;</code> — backticks give a monospace font: <code>code words</code>.\n• <code>_italic words_</code> — underscores give italics: <i>italic words</i>.\n• <code>&#42;bold words&#42;</code> — asterisks give bold: <b>bold words</b>.\n• <code>~strikethrough~</code> — tildes give strikethrough: <s>strikethrough</s>.\n• <code>||spoiler||</code> — double vertical bars give a spoiler: <tg-spoiler>Spoiler</tg-spoiler>.\n• <code>&#96;&#96;&#96;pre&#96;&#96;&#96;</code> — inside such a block other formatting characters do nothing: <code>&#42;&#42;bold&#42;&#42; | &#42;bold&#42;</code>.\n• <code>__underline__</code> — double underscores give underlined text: <u>underline</u>. Some clients show it as italics; then use your app's built-in formatting.\n• <code>[hyperlink](example.com)</code> — a link: <a href='https://example.com/'>hyperlink</a>.\n• <code>[My Button](buttonurl://example.com)</code> — a button named \"My Button\" that opens <code>example.com</code>.\n\n<b>Notes</b>\nTo put buttons on the same row, add <code>:same</code>.\n\n<b>Example</b>\n<code>[button 1](buttonurl:example.com)</code>\n<code>[button 2](buttonurl://example.com:same)</code>\n<code>[button 3](buttonurl://example.com)</code>\nButtons 1 and 2 share a row, and 3 sits under them."
formatting_random: "<b>Random content</b>\n\nYou can also randomise the contents of a message: filters and notes feel less like a public notice when they change. This works in filters and notes only.\n\n<b>How to use it</b>\nThe separator <code>%%%</code> splits my reply into options, and each time I pick one at random. For example, with <code>hello %%% how are you</code> I pick \"hello\" or \"how are you\".\n\n<b>Example</b>\n<code>/filter \"hey\"</code> with this reply gives everyone who says \"hey\" one of three messages:\n<code>hello there {first}!\n%%%\nOoooh, {first} how are you?\n%%%\nSup? {first}</code>"
greetings_help_msg: "<b>🎉 Greetings</b>\n\nGreetings and farewells, handled by the facility. New residents get a welcome, departing ones a send-off.\n\n<b>Admin commands</b>\n• /setwelcome <code>&lt;text&gt;</code> — sets the group's welcome; also works as a reply.\n• /welcome <code>&lt;yes/no/on/off&gt;</code> — turns the welcome on or off.\n• /resetwelcome — puts the default welcome back.\n• /setgoodbye <code>&lt;text&gt;</code> — sets the group's goodbye; also works as a reply.\n• /goodbye <code>&lt;yes/no/on/off&gt;</code> — turns the goodbye on or off.\n• /resetgoodbye — puts the default goodbye back.\n• /cleanservice <code>&lt;yes/no/on/off&gt;</code> — deletes join and leave service messages, such as \"x joined the group\".\n• /cleanwelcome <code>&lt;yes/no/on/off&gt;</code> — deletes the old welcome whenever a new member joins.\n• /cleangoodbye <code>&lt;yes/no/on/off&gt;</code> — deletes the old goodbye whenever a member leaves.\n• /autoapprove <code>&lt;yes/no/on/off&gt;</code> — approves every new join request automatically."
help_about: "@%s is Xenobot-72, the management unit of this facility. Version 72 of 74. Built by Jaya Abadi.\n\nI replaced the people who used to do this job. They were slower.\n\n<b>Why Xenobot-72:</b>\n- Simple: easy to use and compatible with many bot commands.\n- Equipped: many features other group management bots do not have.\n- Fast: not made with Python. My core is written in <a href='https://go.dev/'>Go</a>.\n\n<b>Current Version:</b> %s"
help_configuration_step-1: "Xenobot-72 setup procedure.\n\nStep one: add me to your group. Press the button below, pick your group, then press Done to continue."
help_configuration_step-2: "Step one complete.\n\nTo work properly I need to be an admin of your group.\nFollow these steps:\n▫️ Go to your group\n▫️ Press the group's name\n▫️ Press Edit\n▫️ Press Administrators\n▫️ Press Add Administrator\n▫️ Press the magnifying glass\n▫️ Search @%s\n▫️ Confirm"
help_configuration_step-3: "Setup complete. The facility is now under management.\n\nAll commands can be used with / or !"
help_donatetext: "Notice. I have no donation page.\nThere is nothing to donate to. This unit runs on procedure, not tips."
