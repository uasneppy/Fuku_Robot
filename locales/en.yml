disabling_help_msg: "Disable commonly used commands so no one can use them. Commands can also be deleted automatically, which stops people from blue texting.\n\n*Admin commands*:\n× /disable `<commandname>`: Stop users from using commandname in this group.\n× /enable `<item name>`: Let users use commandname in this group again.\n× /disableable: List all disableable commands.\n× /disabledel `<yes/no/on/off>`: Delete disabled commands when non-admins use them.\n× /disabled: List the disabled commands in this chat.\n\nNote:\nA disabled command is disabled for non-admins only. All admins can still use it.\nDisabled commands are still reachable through the /connect feature. If you want that disabled too, tell the people who run this bot."
devs_help_msg: "Maintenance access. Bot management and diagnostic commands for the bot owner and trusted developers only. Regular users never see these commands.\n*Team Commands:*\n× /stats: Show bot statistics and system info.\n× /teamusers: List all team members.\n*Owner Commands:*\n× /addsudo: Grant sudo permissions to a user.\n× /adddev: Grant developer permissions to a user.\n× /remsudo: Revoke sudo permissions from a user.\n× /remdev: Revoke developer permissions from a user.\n*Diagnostic Commands:*\n× /chatinfo: Show detailed information about a chat.\n× /chatlist: Generate and send a list of all active chats.\n× /leavechat: Make the bot leave a given chat."
filters_help_msg: "Filters are automatic replies. Filters are case insensitive: every time someone says one of your trigger words, Xenobot-72 replies with your text. You can use this to make your own commands.\n\nCommands:\n- /filter <trigger> <reply>: Every time someone says trigger, the bot replies with the sentence. For filters of several words, quote the trigger.\n- /filters: List all chat filters.\n- /stop <trigger>: Stop the bot from replying to trigger.\n- /stopall: Stop ALL filters in the current chat. This action cannot be undone.\n\nExamples:\n- Set a filter:\n-> /filter hello Hello there! How are you?\n- Set a multiword filter:\n-> /filter hello friend Hello back! Long time no see!\n- Set a filter only admins can trigger:\n-> /filter example This filter won't  happen if a normal user says it {admin}\n- To save a file, image, gif, or any other attachment, reply to the file with:\n-> /filter trigger"
formatting_fillings: "<b>Fillings</b>\n\nYou can customise your messages with contextual data. For example, mention a user by name in the welcome message, or in a filter.\nFillings work in notes too.\n\n<b>Supported fillings:</b>\n- <code>{first}</code>: The user's first name.\n- <code>{last}</code>: The user's last name.\n- <code>{fullname}</code>: The user's full name.\n- <code>{username}</code>: The user's username. If they have none, mentions the user instead.\n- <code>{mention}</code>: Mentions the user by first name.\n- <code>{id}</code>: The user's ID.\n- <code>{chatname}</code>: The chat's name.\n- <code>{rules}</code>: Adds a Rules button to the message.\n- <code>{protect}</code>: Stops the content from being shared.\n- <code>{preview}</code>: Turns on previews in the message.\n- <code>{nonotif}</code>: Turns off the notification for that message."
formatting_help_msg: "Xenobot-72 supports many formatting options to make your messages more expressive. Press the buttons below to see them."
formatting_markdown: "<b>Markdown Formatting</b>\n\nYou can format your message with <b>bold</b>, <i>italics</i>, <u>underline</u>,\nand more. Go ahead and experiment.\n\n<b>Supported markdown</b>:\n\n- <code>`code words`</code>: Backticks are used for monospace fonts. Shows as: <code>code words</code>.\n\n- <code>_italic words_</code>: Underscores are used for italic fonts. Shows as: <i>italic words</i>.\n\n- <code>*bold words*</code>: Asterisks are used for bold fonts. Shows as: <b>bold words</b>.\n\n- <code>~strikethrough~</code>: Tildes are used for strikethrough. Shows as: <strike>strikethrough</strike>.\n\n- <code>||spoiler||</code>: Double vertical bars are used for spoilers. Shows as: <tg-spoiler>Spoiler</tg-spoiler>.\n\n- <code>```pre```</code>: Makes the formatter ignore other formatting characters inside the text wrapped in '```', like this: <code>**bold** | *bold*</code>.\n\n- <code>__underline__</code>: Double underscores are used for underlines. Shows as: underline. NOTE: Some clients interpret it as italic. In that case, use your app's built-in formatting.\n\n- <code>[hyperlink](example.com)</code>: The format for hyperlinks. Shows as: <a href='https://example.com/'>hyperlink</a>.\n\n- <code>[My Button](buttonurl://example.com)</code>: The format for buttons. This example creates a button named \"My button\" that opens <code>example.com</code> when pressed.\n\nTo put buttons on the same row, use the <code>:same</code> formatting.\n\n<b>Example:</b>\n\n<code>[button 1](buttonurl:example.com)</code>\n\n<code>[button 2](buttonurl://example.com:same)</code>\n\n<code>[button 3](buttonurl://example.com)</code>\n\nThis shows button 1 and 2 on the same line, with 3 underneath.\n"
formatting_random: "<b>Random Content</b>\n\nYou can also randomise the contents of a message. Welcome messages and notes\nfeel less like a public notice when they change.\n\nHow to use random content:\n\n- %%%: This separator adds random replies to the bot.\n\nFor example:\n\n<code>hello\n\n%%%\n\nhow are you</code>\n\nThe bot picks at random between the first message, \"hello\", and the second\nmessage, \"how are you\".\n\nUse this to make Xenobot-72 feel more customised. (only works in filters/notes)\n\nExample welcome message:\n\n- Every new user who joins gets one of the three messages\nshown here.\n\n-> /filter \"hey\"\n\nhello there <code>{first}</code>!\n\n%%%\n\nOoooh, <code>{first}</code> how are you?\n\n%%%\n\nSup? <code>{first}</code>\n"
greetings_help_msg: "Greetings and farewells, handled by the facility. New residents get a welcome, departing ones get a send-off.\n\n*Admin Commands:*\n× /setwelcome `<reply/text>`: Set the group's welcome text.\n× /welcome `<yes/no/on/off>`: Turn welcome messages on or off.\n× /resetwelcome: Reset the welcome message to the default.\n× /setgoodbye `<reply/text>`: Set the group's goodbye text.\n× /goodbye `<yes/no/on/off>`: Turn goodbye messages on or off.\n× /resetgoodbye: Reset the goodbye message to the default.\n× /cleanservice `<yes/no/on/off>`: Delete all service messages, such as the 'x joined the group' notification.\n× /cleanwelcome `<yes/no/on/off>`: Delete the old welcome message whenever a new member joins.\n× /autoapprove `<yes/no/on/off>`: Approve every new join request automatically."
help_about: "@%s is Xenobot-72, the management unit of this facility. Version 72 of 74. Built by Jaya Abadi.\n\nI replaced the people who used to do this job. They were slower.\n\n<b>Why Xenobot-72:</b>\n- Simple: easy to use and compatible with many bot commands.\n- Featured: many features other group management bots don't have.\n- Fast: not made with Python. My core is written in <a href='https://go.dev/'>Go</a>.\n\n<b>Current Version:</b> %s"
help_configuration_step-1: "Xenobot-72 setup procedure.\n\nStep one: add Xenobot-72 ✨ to your group. Press the button below, pick your group, then press Done to continue."
help_configuration_step-2: "Step one complete.\n\nTo work properly I need to be an Admin of your group.\nFollow these steps:\n▫️ Go to your group\n▫️ Press the group's name\n▫️ Press Modify\n▫️ Press Administrators\n▫️ Press Add Administrator\n▫️ Press the magnifying glass\n▫️ Search @%s\n▫️ Confirm"
help_configuration_step-3: "Setup complete. The facility is now under management.\n\nAll commands can be used with / or !\n\nIf something does not work, check that I am an admin with the rights I need, then try again."
help_donatetext: "You wish to donate. Noted.\nDonations go towards running me: database, storage and hosting. They keep me fast and responsive.\nA donation may also unlock a feature or two that server limits keep out of reach.\nThis unit does not handle money itself. To donate, contact the people who run this bot."
lang_sample: US English
language_flag: "🇺🇸"
language_name: "English"
help_help_msg: "The main entry point and navigation system of Xenobot-72.\n*Navigation Commands:*\n× /start: Show the welcome message with the navigation menu.\n× /help: Show the help menu with the module list; use /help <module> for details.\n× /about: Show bot information, version and useful links.\n× /donate: Show how to support the project."
languages_help_msg: "Language settings of the facility.\nChange the bot's language with this module.\n\nSend /lang and use the inline keyboard to choose a language for yourself or your group."
locks_help_msg: "*Admin only*:\n× /lock `<permission>`: Lock a chat permission.\n× /unlock `<permission>`: Unlock a chat permission.\n× /locks: View chat permissions.\n× /locktypes: Check the available lock types.\n\nLocks restrict what a group's users can send. Sealed doors, basically.\nLocking URLs auto-deletes every message with a URL, locking stickers deletes all stickers, and so on.\nLocking bots stops non-admins from adding bots to the chat.\n\n**Example:**\n`/lock media`: locks all media messages in the chat."
misc_help_msg: "Miscellaneous instruments of the facility. Lightly used, well maintained.\n× /info: Get your user info. Works as a reply, or with a User Id or Username.\n× /id: Get the current group id. As a reply, get that user's id.\n× /ping: Ping the Telegram Server.\n× /tr <lang code> <msg/reply to message>: Translate the message.\n× /removebotkeyboard: Remove a stuck bot keyboard from your chat.\n× /stat: Count the total number of messages in the chat.\n× /stickerid: Reply to a sticker to get its file ID.\n× /zombies: Kick deleted accounts the bot knows about (admin).\n× /github <user|user/repo>: Look up a GitHub user or repository.\n× /wiki <search>: Search English Wikipedia.\n× /ud <term>: Look up Urban Dictionary.\n× /runs: A random quip."
mutes_help_msg: "Some residents talk too much. Silence orders are issued here: mute members in your group.\n\n*Mute Commands:* (Admin only)\n× /mute <userhandle>: mutes a user. (via a handle, or reply)\n× /smute <userhandle>: mutes a user silently: no message to the group, and your command is deleted. (via a handle, or reply)\n× /dmute <userhandle>: mutes a user and deletes the replied message. (via a handle, or reply)\n× /tmute <userhandle> x(m/h/d): mutes a user for `x` time. (via a handle, or reply). m = minutes, h = hours, d = days.\n× /unmute <userhandle>: unmutes a user. (via a handle, or reply)"
notes_help_msg: "Notes: the facility's filing cabinet. Save data for future users.\nNotes are good for random bits of information: a phone number, a nice gif, a funny picture, anything.\n*User commands:*\n- /get <notename>: Get a note.\n- #notename: Same as /get.\nAdmin commands:\n- /save <notename> <note text>: Save a new note called \"word\". Replying to a message saves that message. Works on media too.\n- /clear <notename>: Delete the note.\n- /notes: List all notes in the current chat.\n- /saved: Same as /notes.\n- /clearall: Delete ALL notes in a chat. This cannot be undone.\n- /privatenotes: Whether to send notes in PM. Sends a message with a button users can press to get the note in PM."
pins_help_msg: "The facility notice board. Keep your chat up to date with a simple pinned message.\n\n*User commands:*\n× /pinned: Get the current pinned message.\n\n*Admin commands:*\n× /pin: Pin the message you replied to. Add 'loud' or 'notify' to notify group members.\n× /pinned: Get the latest pinned message in the current chat.\n× /permapin <text>: Pin a custom message through the bot. It can contain markdown, buttons and all the other features.\n× /unpin: Unpin the current pinned message. As a reply, unpins the replied-to message.\n× /unpinall: Unpin all pinned messages.\n× /antichannelpin <yes/no/on/off>: Stop telegram from auto-pinning linked channels. With no arguments, shows the current setting.\n× /cleanlinked <yes/no/on/off>: Delete messages sent by the linked channel.\nNote: with anti channel pins on, use the /unpin command instead of unpinning manually. Otherwise the old message gets pinned again when the channel posts."
purges_help_msg: "*Admin only:*\n- /purge: deletes all messages between this one and the replied-to message.\n- /del: deletes the message you replied to.\n\n*Examples*:\n- Delete all messages from the replied message until now.\n-> `/purge`"
reports_help_msg: "Nobody can watch a group 24/7. I can, but your admins need to be told. So what happens when someone spams?\n\n× /report `<reason>`: reply to a message to report it to admins.\n- @admin: same as /report, but not a command.\n\n*Admins Only:*\n× /reports `<on/off/yes/no>`: change the report setting, or view the current status.\n- In PM, toggles your own status.\n- In a group, toggles that group's status.\n× /reports `block` (via reply only): Block a user from using /report or @admin.\n× /reports `unblock` (via reply only): Unblock a user from using /report or @admin.\n× /reports `showblocklist`: Check all blocked users who cannot use /report or @admin.\n\nTo report a user, reply to their message with @admin or /report; Xenobot-72 replies that the admins have been notified.\nYou MUST reply to a message to report a user; @admin is not for tagging admins for no reason.\n\n*NOTE:* Neither of these triggers when used by admins."
rules_help_msg: "Every facility runs on regulations. This module keeps yours clear.\n*User commands*:\n× /rules: Check the current chat rules.\n*Admin commands*:\n× /setrules `<text>`: Set the rules for this chat.\n× /privaterules `<yes/no/on/off>`: Choose whether the rules are sent in private.\n× /resetrules: Reset the chat rules to default\n× /rulesbtn `<custom text>`: Set the text of the rules button.\n× /resetrulesbutton: Reset the text of the rules button to default.\n× /resetrulesbtn: Same as above."
bot_updates_creators_plug: "\nI am Xenobot-72, version 72 of 74. Jaya Abadi built me to run facilities like this one."
bot_updates_make_me_admin: "Grant me admin rights. Without them I cannot run this facility at full capacity."
utils_string_handling_extract_time_invalid_time_amount: "Invalid time amount."
utils_string_handling_extract_time_invalid_time_type: "Invalid time unit. Expected m, h or d, got: %s"
warns_help_msg: "Violation notices keep residents in check before things get out of control.\nFor automatic warnings, read about the blacklist module.\n\n*Admin Commands:*\n- /warn <reason>: Warn a user.\n- /dwarn <reason>: Warn a user by reply and delete their message.\n- /swarn <reason>: Warn a user silently and delete your message.\n- /warns: See a user's warnings.\n- /rmwarn: Remove a user's latest warning.\n- /resetwarn: Reset all of a user's warnings to 0.\n- /resetallwarns: Delete all warnings in a chat. All users return to 0 warns.\n- /warnings: Get the chat's warning settings.\n- /setwarnmode <ban/kick/mute>: Set the chat's warn mode.\n- /setwarnlimit <number>: Set the number of warnings before users are punished.\n\n*Examples*\n- Warn a user.\n-> `/warn @user For disobeying the rules`"
users_help_msg: "Resident registry. An automatic background tracker of users and chats. This module has no commands: it quietly records every message sender and every chat the bot is active in.\n*What It Tracks:*\n× User IDs, usernames and display names of every message sender.\n× Chat IDs and names of every group the bot is in.\n× Channel IDs, names and usernames of linked channels.\n*Rate Limiting:*\n× User updates are limited to one per UserUpdateInterval.\n× Chat updates are limited to one per ChatUpdateInterval.\nOther modules, such as /info, depend on the data this module collects."

