settings_mreq_desc_lastname: "A member with no last name breaks this rule."
settings_mreq_desc_username: "A member with no @username breaks this rule."
settings_mreq_desc_russian: "A first or last name with ы, ъ, э or ё breaks this rule. Belarusian and Bulgarian use some of these letters, so their names can be caught too."
settings_mreq_desc_arabic: "A first or last name with any Arabic letter breaks this rule. Persian, Urdu and other languages use the same script, so their names are caught too."
settings_mreq_desc_chinese: "A first or last name with any Chinese character breaks this rule. Japanese names written in kanji use the same characters, so they are caught too."
settings_mreq_desc_photo: "A member with no profile photo that I can see breaks this rule. A photo hidden by privacy settings counts as missing. The member can show it to everyone, or an admin can approve them."
settings_mreq_desc_channel: "A member who is not subscribed to this group's linked channel breaks this rule. I can check it only as an administrator of that channel."
settings_mreq_desc_ai: "A name that Claude judges to be spam, such as an advert or a scam, breaks this rule. I check new members when they join or at their first message, and any member after their name changes. Members already here are checked only after they change their name."
settings_mreq_now: "Punishment: {action}"
settings_mreq_choose_hint: "Off and Warn change at once. Kick, Ban and Mute ask you to confirm first."
settings_mreq_actions_hint: "Warn counts toward the group's warn limit. Kick lets them join again. Ban keeps them out until an admin unbans them. Mute lasts until they fix it and tap “I fixed it”."
settings_mreq_confirm: "Set “{rule}” to {action}?"
settings_mreq_confirm_kick: "Every member who breaks this rule is removed at their next message, members already in the group included. They can join again once they fix it."
settings_mreq_confirm_ban: "Every member who breaks this rule is banned at their next message, members already in the group included. Only an admin can unban them."
settings_mreq_confirm_mute: "Every member who breaks this rule is muted at their next message, members already in the group included. They get an “I fixed it” button to free themselves."
settings_mreq_confirm_ai_kick: "A member whose name is judged spam is removed when they join or at their first message, or after a name change. Members already here are checked only after one. They can join again once they fix it."
settings_mreq_confirm_ai_ban: "A member whose name is judged spam is banned when they join or at their first message, or after a name change. Members already here are checked only after one. Only an admin can unban them."
settings_mreq_confirm_ai_mute: "A member whose name is judged spam is muted when they join or at their first message, or after a name change. Members already here are checked only after one. They get an “I fixed it” button to free themselves."
