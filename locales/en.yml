antiflood_help_msg: "Someone joins, sends 100 messages and ruins the chat. With antiflood, that stops here.\n\nAntiflood acts on users who send more than x messages in a row. Actions: ban/kick/mute\n\n*Admin commands*:\n× /flood: Get the current antiflood settings.\n× /setflood `<number/off/no>`: Set the number of messages after which to act on a user. Set '0', 'off' or 'no' to disable.\n× /setfloodmode `<action type>`: Choose the action for a user who floods. Options: ban/kick/mute\n× /delflood `<yes/no/on/off>`: Whether the bot deletes the flood messages."
