approvals_help_msg: "<b>👤 Approvals</b>\n\nIssue trusted residents a pass: immunity from the automatic anti-spam measures, without making them admins.\n\n<b>Admin commands</b>\n• /approve <code>&lt;user&gt; [reason]</code> — approves a user.\n• /unapprove <code>&lt;user&gt;</code> — removes a user's approval.\n• /approval <code>&lt;user&gt;</code> — shows whether a user is approved.\n• /approved — lists every approved user.\n\n<b>Owner commands</b>\n• /unapproveall — removes every approval.\n\n<b>Notes</b>\nApproved members are exempt from antiflood, the blacklist, locks and captcha. Name the user by @username, ID or mention, or reply to their message."
