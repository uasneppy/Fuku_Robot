captcha_help_msg: "Entry control for the facility. Protect your group from bots and spammers with CAPTCHA verification.\n\nNew members prove they are human by solving a simple challenge before they can send messages.\n\n*Captcha Types:*\n× Math: Solve simple arithmetic problems\n× Text: Identify text shown in an image\n× Turnstile: A Cloudflare check on a web page\n\n*Admin Commands:*\n× /captcha `<on/off>`: Enable or disable captcha verification\n× /captchamode `<math/text/turnstile>`: Set the captcha type\n× /captchatime `<1-10>`: Set the timeout in minutes (default: 2)\n× /captchaaction `<kick/ban/mute>`: Set the action for a failed verification (default: kick)\n× /captchaattempts `<1-10>`: Set the maximum verification attempts (default: 3)\n\nWhen enabled, new members are muted until they complete the captcha.\nIf they fail or time out, the configured action is taken."
