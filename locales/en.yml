admin_help_msg: "<b>👮 Admins</b>\n\nSupervisor staffing, handled by me. Supervisors are your admins: promote and demote them here.\n\n<b>Commands for everyone</b>\n• /adminlist — lists the admins of this chat.\n\n<b>Admin commands</b>\n• /promote <code>&lt;user&gt;</code> — makes a user an admin.\n• /demote <code>&lt;user&gt;</code> — takes a user's admin rights away.\n• /title <code>&lt;user&gt; &lt;title&gt;</code> — sets a custom title for a user.\n• /setgtitle <code>&lt;title&gt;</code> — changes the group's title.\n• /setgpic — as a reply to a photo, makes it the group picture.\n• /setgdesc <code>[text]</code> — changes the group's description.\n\n<b>Notes</b>\nName the user by @username, ID or mention, or reply to their message."
