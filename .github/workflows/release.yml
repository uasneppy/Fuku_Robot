name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-ci-checks:
    name: Release CI Checks
    runs-on: ubuntu-latest
    # The tests are not run again here: the tagged commit is on main, and CI
    # ran every check (gosec, govulncheck, lint, the migration chain, the
    # PostgreSQL integrity tests, make test with its coverage threshold,
    # translations and docs drift) on its push. This job only proves that CI
    # run succeeded. It waits while that run is still going (a tag pushed
    # right after a merge), so the limit covers one CI run plus some slack.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to a merged main commit
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$TAG' must be vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::tag $TAG points to a commit that is not merged into main; merge the version-bump PR before tagging" >&2
            exit 1
          fi

      - name: Verify CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only push and workflow_dispatch runs count: they test this exact
          # commit. A pull_request run tests the PR head, not the merge commit.
          while :; do
            runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]')
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              url=$(jq -r '[.[] | select(.conclusion == "success")][0].html_url' <<<"$runs")
              echo "CI passed on ${RELEASE_SHA}: ${url}"
              exit 0
            fi
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -gt 0 ]; then
              echo "CI is still running on ${RELEASE_SHA}; checking again in 60 s"
              sleep 60
              continue
            fi
            if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
              echo "::error::no CI run found for ${RELEASE_SHA}. Tag a commit that CI ran on after it was pushed to main, or run CI on main with workflow_dispatch and tag the commit it ran on." >&2
            else
              echo "::error::CI did not pass on ${RELEASE_SHA} ($(jq -r '[.[].conclusion] | join(", ")' <<<"$runs")). A newer push to main cancels the CI run of the commit before it, so tag the latest main commit whose CI passed, or re-run CI on this one." >&2
            fi
            exit 1
          done

  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [release-ci-checks]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Resolve release tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$tag' must be vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Verify BotVersion matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          if ! grep -qF "BotVersion:  \"${ver}\"" fuku/config/config.go; then
            echo "::error::BotVersion in fuku/config/config.go != ${ver} — prepare a version-bump PR with 'make bump-version TAG=${TAG}', merge it, then tag the merged commit" >&2
            exit 1
          fi
          if ! grep -qF "version = \"${TAG}\"" main.go; then
            echo "::error::CLI version fallback in main.go != ${TAG} — prepare a version-bump PR with 'make bump-version TAG=${TAG}', merge it, then tag the merged commit" >&2
            exit 1
          fi
          echo "BotVersion matches release tag ${TAG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Clean up existing release (handle tag moves)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" &>/dev/null 2>&1; then
            echo "Existing release for $TAG found, deleting before recreate..."
            gh release delete "$TAG" --yes
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.13.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 7

  attest-artifacts:
    name: Attest Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [goreleaser]
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "./artifacts/*"

  post-release-scan:
    name: Post-Release Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [goreleaser]
    if: always() && needs.goreleaser.result == 'success'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/uasneppy/fuku_robot:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Release notification
        run: |
          echo "Release completed successfully!"
          echo "Artifacts published to GitHub Releases"
          echo "Docker images available at ghcr.io/uasneppy/fuku_robot"
